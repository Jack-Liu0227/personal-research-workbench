.mail-trans-head .tb-btn:last-child { margin-left: auto; }
.mail-trans-body { padding: 10px 12px; font-size: 13px; line-height: 1.75; color: inherit; }
.mail-trans-body .md { font-size: 13px; }
.mail-trans-err { color: var(--err); font-size: 12.5px; }
.mail-trans-note { padding: 0 12px 9px; font-size: 11px; color: var(--muted); }
.tb-btn.danger { color: var(--err); }
.tb-btn.danger:hover { background: color-mix(in srgb,var(--err) 14%,transparent); color: var(--err); }
.ma-list { display: flex; flex-direction: column; gap: 6px; max-height: 210px; overflow-y: auto; }
.ma-item { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 9px; }
.ma-item.active { border-color: var(--accent); background: color-mix(in srgb,var(--accent) 14%,transparent); }
.ma-item-info { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.ma-item-info b { font-size: 13px; }
.ma-item-info span { font-size: 11.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ma-item-ops { display: flex; gap: 5px; flex-shrink: 0; }
.ma-empty { padding: 16px; text-align: center; font-size: 12.5px; color: var(--muted); background: var(--panel2); border-radius: 9px; line-height: 1.7; }
.ma-form-title { margin: 0 0 10px; font-size: 13.5px; }
.ma-advanced { margin-top: 12px; font-size: 12.5px; color: var(--muted); }
.ma-advanced summary { cursor: pointer; padding: 4px 0; color: var(--muted); user-select: none; }
.ma-advanced summary:hover { color: var(--accent); }
.ma-advanced .prof-grid { margin-top: 8px; }
.ma-checks { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 10px; font-size: 12.5px; color: var(--muted); }
.ma-checks label { display: inline-flex; align-items: center; gap: 5px; cursor: pointer; }
.ma-test-result { margin-top: 12px; padding: 9px 12px; border-radius: 8px; font-size: 12.5px; background: var(--panel2); color: var(--muted); line-height: 1.7; word-break: break-word; }
.ma-test-result.ok { background: color-mix(in srgb,#12a150 14%,transparent); color: #12a150; }
.ma-test-result.err { background: color-mix(in srgb,var(--err) 14%,transparent); color: var(--err); }
/* ===== 邮箱页（版式/数值全部取自 lit；变量映射到本项目主题） ===== */
.mail-page{height:100%;min-height:0;display:flex;flex-direction:column}
.mail-page .view{display:flex;flex-direction:column;height:100%;min-height:0}
.mail-page .btn{background:var(--panel);border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:7px 14px;font-size:13px;font-weight:600;cursor:pointer}
.mail-page .btn:hover{background:var(--panel2)}
.mail-page .btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.mail-page .btn-primary:hover{filter:brightness(1.06)}
.mail-page .btn-ghost{border-color:transparent;background:transparent;color:var(--muted)}
.mail-page .btn-ghost:hover{background:var(--panel2)}
.as-link{background:none;border:0;color:var(--accent);cursor:pointer;font-size:12.5px;padding:0}
.as-link:hover{text-decoration:underline}
.nav-badge{margin-left:auto;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--err);color:#fff;font-size:11px;font-weight:700;display:inline-flex;align-items:center;justify-content:center}
.nav-badge.hidden{display:none}
.toast{position:fixed;right:18px;bottom:18px;z-index:200;max-width:380px;padding:10px 14px;border-radius:9px;background:var(--panel);border:1px solid var(--line);color:var(--fg);font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.2);opacity:0;transform:translateY(6px);transition:opacity .16s,transform .16s;pointer-events:none}
.toast.show{opacity:1;transform:none}
.toast.error{color:var(--err);border-color:color-mix(in srgb,var(--err) 45%,var(--line))}
.toast.success{color:#12a150;border-color:color-mix(in srgb,#12a150 45%,var(--line))}

/* 工作流页：左竖列（照最左侧导航栏的卡片样式）+ 右功能区 */
.wf-page{display:grid;grid-template-columns:168px 1fr;gap:0;height:100%;min-height:0}
.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap}
.ph-acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.set-wrap{display:grid;grid-template-columns:168px 1fr;gap:16px;align-items:start}
.set-nav{display:flex;flex-direction:column}
.set-row{width:100%;display:flex;align-items:center;gap:8px;text-align:left;padding:8px 10px;margin-bottom:2px;border:1px solid var(--line);border-radius:8px;background:var(--panel2);color:var(--fg);font-size:14px;cursor:pointer}
.set-row:hover{background:color-mix(in srgb,var(--accent) 12%,transparent)}
.set-row.on{background:color-mix(in srgb,var(--accent) 20%,transparent);box-shadow:inset 2px 0 0 var(--accent);border-color:transparent;font-weight:600}
.set-ico{width:18px;text-align:center}
.at-title{cursor:text;border-radius:8px;padding:2px 6px;margin-left:-6px;transition:background .15s,color .15s}
.at-title:hover{background:var(--panel2);color:var(--accent)}
.at-idwrap{display:flex;align-items:center;cursor:pointer}
.as-chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:4px}
.as-chip{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:8px 12px;font-size:13px;color:var(--fg);cursor:pointer;transition:border-color .15s,color .15s}
.as-chip:hover{border-color:var(--accent);color:var(--accent)}

.wf-rail{display:flex;flex-direction:column;min-height:0;margin:-16px 0;padding:16px 12px 16px 0;border-right:4px solid var(--line)}   /* 4px、用全局边框色；负边距顶到 #main 上下边缘（-16px 跟 .main 的 padding 走） */
.wf-step{width:100%;padding:8px 10px;margin-bottom:2px;border:1px solid var(--line);border-radius:8px;background:var(--panel2);color:var(--fg);font-size:14px;text-align:center;cursor:pointer}
.wf-step:hover{background:color-mix(in srgb,var(--accent) 12%,transparent)}
.wf-step.on{background:color-mix(in srgb,var(--accent) 20%,transparent);box-shadow:inset 2px 0 0 var(--accent);border-color:transparent;font-weight:600}
.wf-body{display:flex;min-width:0;min-height:0;margin:-16px -16px -16px 0}   /* 右区抵到上/右/下框架 */
.wf-body>*{flex:1;min-width:0}
.wf-body .card{margin-bottom:0;height:100%;min-height:0;display:flex;flex-direction:column}
/* 右区里的对话页收窄共享 .at 的大边距，让功能区填满 */
.wf-body .at-head{min-height:auto;padding:10px 16px}
.wf-body .at-tabs{padding:6px 16px}
.wf-body .at-msgs{padding:14px 16px 16px}
.wf-body .at-dock{padding:0 16px 10px}
.wf-body .at-panel{margin-top:6px}

.steps{display:flex;flex-direction:column;gap:6px}
.steprow{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:7px 9px;background:var(--panel2)}
.steprow .n{width:20px;height:20px;flex:none;border-radius:50%;background:var(--panel);border:1px solid var(--line);display:grid;place-items:center;font-size:11px;color:var(--muted)}

/* ===== 论文搜索（照科研工作台 literature.tsx 的「联网检索」）===== */
.ws{display:flex;flex-direction:column;height:100%;min-height:0;gap:10px;padding:14px 16px 0}   /* 上/左右留白，底部留给结果面板贴框 */
.ws-bar{display:flex;align-items:center;gap:10px;flex:none}
.ws-navbtn{width:30px;height:30px;flex:none;cursor:pointer;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--muted);font-size:15px;line-height:1}
.ws-navbtn:hover:not(:disabled){border-color:var(--accent);color:var(--fg)}
.ws-navbtn:disabled{opacity:.4;cursor:not-allowed}
.ws-query{position:relative;display:flex;min-width:220px;flex:1 1 360px;align-items:center}
.ws-query span{position:absolute;left:11px;color:var(--muted);font-size:12px}
.ws-query input{width:100%;height:44px;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:0 12px 0 36px;font-size:14px;color:inherit;font-family:inherit;outline:none}
.ws-query input:focus{border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.ws-query svg{position:absolute;left:12px;width:16px;height:16px;color:var(--muted);pointer-events:none}
.ws-bar>.btn{height:44px;padding:0 16px;display:inline-flex;align-items:center;justify-content:center;font-size:13px}
.ws-bar>select{height:44px;max-width:240px;flex:0 0 auto;padding:0 10px;font-size:13px}
.ws-bar .ws-navbtn{width:44px;height:44px;font-size:17px}
.ws-yr select{padding:6px 8px}
.ws-bar select,.ws-field select{appearance:none;cursor:pointer;background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:6px 9px;font-size:12.5px;color:inherit;font-family:inherit}
.ws-fields{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;flex:none;border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:9px 12px}
.ws-field{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.ws-field>span{white-space:nowrap}
.ws-field input{width:150px;background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:6px 9px;font-size:12.5px;color:inherit;font-family:inherit;outline:none}
.ws-more{font-size:12px;color:var(--muted);margin-left:auto;position:relative}
.ws-more>summary{cursor:pointer;border:1px solid var(--line);border-radius:7px;background:var(--panel2);padding:5px 10px;list-style:none}
.ws-more[open]>summary{border-color:var(--accent);color:var(--fg)}
.ws-more>div{position:absolute;right:0;z-index:5;width:min(320px,60vw);margin-top:6px;border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:10px 12px;box-shadow:var(--shadow)}
.ws-results{display:flex;min-height:0;flex:1;flex-direction:column;border:1px solid var(--line);border-radius:10px;background:var(--panel);overflow:hidden}
.ws-head{flex:none;border-bottom:1px solid var(--line);padding:10px 14px}
.ws-head h1{margin:2px 0 3px;font-size:17px;font-weight:750}
.ws-list{min-height:0;flex:1;overflow-y:auto}
.ws-row{display:flex;align-items:flex-start;gap:12px;border-bottom:1px solid var(--line);padding:11px 14px}
.ws-pick{align-self:center;display:flex;flex:none;cursor:pointer}
.ws-pick input{width:16px;height:16px;accent-color:var(--accent);cursor:pointer;margin:0}
.ws-pickinfo{font-size:12px;color:var(--muted);white-space:nowrap}
.ws-bar>.btn.on-pri,#wsToDl{background:var(--accent);color:var(--accent-ink);border:0;font-weight:600}
#wsToDl:disabled{opacity:.5;cursor:not-allowed}
/* 下载精读：下载位置 + 两个计数 + 待手动下载清单 + 一键精读 */
.dl-page{display:flex;flex-direction:column;height:100%;min-height:0;gap:10px;padding:14px 16px 0}
.dl-loc{flex:none;border:1px solid var(--line);border-radius:10px;background:var(--panel2);padding:9px 12px}
.dl-loc .k{font-size:12px;color:var(--muted);margin:0 0 4px}
.dl-loc .v{font-size:13px;font-family:ui-monospace,Consolas,monospace;word-break:break-all}
.dl-stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;flex:none}
.dl-stat{border:1px solid var(--line);border-radius:10px;background:var(--panel2);padding:10px 14px}
.dl-stat .k{font-size:12px;color:var(--muted);margin:0}
.dl-stat .v{font-size:26px;font-weight:700;margin:2px 0 0;line-height:1.15}
.dl-box{display:flex;min-height:0;flex:1;flex-direction:column;border:1px solid var(--line);border-radius:10px;background:var(--panel);overflow:hidden}
.dl-box>.h{flex:none;display:flex;align-items:center;justify-content:space-between;gap:8px;border-bottom:1px solid var(--line);padding:9px 14px;font-size:13px;font-weight:600}
.dl-box>.h .hint{font-weight:400}
.dl-foot{flex:none;display:flex;justify-content:flex-end;gap:10px;padding:0 0 14px}
.dl-foot .btn{height:38px;padding:0 20px;background:var(--accent);color:var(--accent-ink);border:0;font-weight:600}
.ws-chip{flex:none;font-size:11px;border-radius:999px;padding:3px 9px;white-space:nowrap}
.ws-chip.ok{color:var(--accent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 45%,transparent)}
.ws-chip.need{color:var(--err);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--err) 45%,transparent)}
.ws-row:hover{background:var(--panel2)}
.ws-row-main{min-width:0;flex:1}
.ws-row h3{margin:0;font-size:13.5px;font-weight:600;line-height:1.45}
.ws-meta{margin:3px 0 0;color:var(--muted);font-size:11.5px}
.ws-abs{margin:5px 0 0;color:var(--muted);font-size:11.5px;line-height:1.6;display:-webkit-box;overflow:hidden;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.ws-row-actions{display:flex;flex:none;align-items:center;gap:6px}
.ws-foot{display:flex;flex:none;align-items:center;gap:12px;border-top:1px solid var(--line);background:var(--panel2);padding:7px 14px;font-size:11.5px;color:var(--muted)}
.ws-foot .ws-pageinfo{margin-left:auto;font-variant-numeric:tabular-nums}
.steprow.done .n{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.swatches{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sw{display:inline-flex;align-items:center;gap:7px;padding:4px 10px 4px 5px;border-radius:999px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-size:12px;color:var(--muted)}
.sw::before{content:"";width:18px;height:18px;border-radius:50%;background:var(--c,var(--accent));flex:none}
.sw em{font-style:normal}
.sw.sel{border-color:var(--accent);color:var(--fg)}
.sw.sel::before{box-shadow:0 0 0 2px var(--accent)}
.sw.doton{padding:0;border:0;background:none;gap:0}
.sw.doton::before{width:19px;height:19px}
.sidebar-foot .swatches{padding:6px 10px 2px;display:grid;grid-template-columns:repeat(7,1fr);gap:6px;justify-items:center}   /* 一行七个，14 色正好两行 */
.md h1,.md h2,.md h3{margin:10px 0 6px}.md ul{margin:6px 0 6px 18px}.md code{background:var(--panel2);padding:1px 4px;border-radius:4px}
/* ---------------- 大笔记（照抄 lit 的 Markdown 笔记，变量换成我们的主题） ---------------- */
.seg-tabs{display:inline-flex;background:var(--panel2);border-radius:10px;padding:3px;gap:2px}
.seg-tab{border:none;background:none;font-family:inherit;font-size:13px;padding:7px 16px;border-radius:8px;cursor:pointer;color:var(--muted)}
.seg-tab.active{background:var(--panel);color:var(--accent);font-weight:700;box-shadow:var(--shadow)}
.md-view{height:100%;min-height:0;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.md-view .md-note-title,.md-view .md-source{background:transparent}
.md-view { display: grid; grid-template-columns: 238px minmax(0, 1fr); min-height: 0; background: var(--panel); }
.md-note-side { min-width: 0; border-right: 1px solid var(--line); background: var(--panel2); padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.md-note-side-head { display: flex; gap: 7px; }
.md-note-side-head .btn { flex: 1 1 0; min-width: 0; padding: 8px 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }   /* 三个挤 213px：只 flex:1 会被各自 min-content 顶住 → 第三个按钮被右边界切掉（2026-10-12 修） */
.md-note-list { min-height: 0; flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; }
.md-note-item { border: 1px solid transparent; border-radius: 6px; padding: 9px 10px; cursor: pointer; min-width: 0; }
.md-note-item:hover { background: var(--panel); border-color: var(--line); }
.md-note-item.active { background: color-mix(in srgb,var(--accent) 14%,transparent); border-color: var(--accent); }
.md-note-item b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; color: var(--fg); }
.md-note-item span { display: block; margin-top: 4px; font-size: 11px; color: var(--muted); }
.md-bind { display: inline-block; margin-top: 4px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; border-radius: 999px; background: color-mix(in srgb,var(--accent) 16%,transparent); color: var(--fg); font-size: 10px; font-style: normal; padding: 1px 7px; }
.md-task-select { flex: 0 0 auto; max-width: 190px; height: 30px; padding: 0 8px; background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; color: var(--fg); font-size: 12.5px; font-family: inherit; }
/* 「专注模式」：整页缩成一长列记事本（读论文时放旁边随手记） */
#btnMdFocus, #btnMdNarrow, #btnMdFocusOut { display: inline-flex; align-items: center; }
#btnMdNarrow, #btnMdFocusOut { display: none; }
.md-view.focus { grid-template-columns: minmax(0, 1fr); }
.md-view.focus .md-note-side, .md-view.focus .md-toolbar,
.md-view.focus #btnMdExport, .md-view.focus #btnMdPdf, .md-view.focus #btnMdDelete, .md-view.focus #btnMdFocus { display: none; }
.md-view.focus #btnMdNarrow, .md-view.focus #btnMdFocusOut { display: inline-flex; }
.md-view.focus .md-title-row { border-bottom: 0; padding: 16px 22px 6px; }
.md-view.focus .md-note-title { font-size: 17px; font-weight: 700; }
.md-view.focus .md-workspace { grid-template-columns: minmax(0, 1fr); }
.md-view.focus .md-source { max-width: 760px; width: 100%; margin: 0 auto; padding: 10px 22px 40vh; font-size: 15.5px; line-height: 1.95; }
.md-view.focus .md-preview { max-width: 760px; width: 100%; margin: 0 auto; }
.md-focus-hint { display: none; margin: 0 0 10px; color: var(--muted); font-size: 11px; text-align: center; }
.md-view.focus .md-focus-hint { display: block; }
/* 窄栏：整扇窗就是一张白纸 —— 只剩「笔记名 + 退出」，别的全白 */
.md-view.narrow, .md-view.narrow .md-note-main, .md-view.narrow .md-editor-shell, .md-view.narrow .md-workspace { border: 0; border-radius: 0; background: #fff; color: #111; }
.md-view.narrow .md-focus-hint, .md-view.narrow #mdSaveState, .md-view.narrow #mdTask,
.md-view.narrow #btnMdNarrow, .md-view.narrow #btnMdFocus, .md-view.narrow #btnMdPdf,
.md-view.narrow #btnMdExport, .md-view.narrow #btnMdDelete { display: none; }
.md-view.narrow #btnMdFocusOut { display: inline-flex; }
.md-view.narrow .md-title-row { padding: 10px 14px 2px; border: 0; gap: 8px; }
.md-view.narrow .md-note-title { background: transparent; border: 0; color: #111; font-size: 15px; font-weight: 700; padding: 4px 2px; }
.md-view.narrow .md-source { max-width: none; width: 100%; background: #fff; color: #111; border: 0; padding: 6px 14px 40vh; font-size: 15.5px; line-height: 1.95; }
.md-view.narrow #btnMdFocusOut { color: var(--accent); }
/* 窄栏时整扇窗就剩这一张纸：侧栏/标签页/状态栏全收掉，顶栏压成一条白条（只留窗口那三个键，不然没法关窗） */
body.md-narrow .sidebar, body.md-narrow .tabsbar, body.md-narrow .statusbar { display: none; }
body.md-narrow .main { padding: 0; }
body.md-narrow .topbar { height: 28px; padding: 0 0 0 8px; background: #fff; border: 0; }
body.md-narrow .topbar > *:not(.wctl) { display: none; }
body.md-narrow .wctl button { color: #444; }
body.md-narrow .wctl button:hover { background: #eee; }
.md-drop-zone { border: 1px dashed var(--line); border-radius: 6px; padding: 10px; text-align: center; color: var(--muted); font-size: 12px; }
.md-drop-zone.dragging { color: var(--accent); border-color: var(--accent); background: color-mix(in srgb,var(--accent) 14%,transparent); }
.md-view.md-view-dragging { outline: 3px dashed var(--accent); outline-offset: -7px; background: color-mix(in srgb,var(--accent) 14%,transparent); }
.md-note-main { min-width: 0; min-height: 0; display: flex; background: var(--panel); }
.md-empty { margin: auto; color: var(--muted); font-size: 14px; }
.md-editor-shell { flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; }
.md-title-row { min-height: 54px; display: flex; align-items: center; gap: 8px; padding: 8px 14px; border-bottom: 1px solid var(--line); }
.md-note-title { flex: 1; min-width: 100px; border: none; outline: none; background: transparent; font-size: 20px; font-weight: 700; color: var(--fg); }
.md-save-state { color: var(--muted); font-size: 11.5px; white-space: nowrap; min-width: 42px; }
.md-toolbar { min-height: 45px; padding: 6px 10px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 5px; flex-wrap: wrap; background: var(--panel2); }
.md-tool-btn, .md-tool-select { height: 30px; border: 1px solid var(--line); border-radius: 5px; background: var(--panel); color: var(--fg); font-size: 12px; }
.md-tool-btn { padding: 0 9px; cursor: pointer; }
.md-tool-btn:hover, .md-tool-select:hover { border-color: var(--accent); color: var(--accent); }
.md-tool-select { padding: 0 6px; max-width: 132px; }
.md-tool-sep { width: 1px; height: 22px; background: var(--line); margin: 0 2px; }
.md-tool-spacer { flex: 1; }
.md-mode-tabs { flex-shrink: 0; }
.md-mode-tabs .seg-tab { padding: 5px 9px; font-size: 11.5px; }
.md-workspace { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
.md-workspace.write { grid-template-columns: 1fr; }
.md-workspace.preview { grid-template-columns: 1fr; }
.md-workspace.write .md-preview, .md-workspace.preview .md-source { display: none; }
.md-source { resize: none; border: none; border-right: 1px solid var(--line); outline: none; padding: 24px clamp(18px, 4vw, 52px); font: 14px/1.75 Consolas, "Microsoft YaHei", monospace; color: var(--fg); background: var(--panel); tab-size: 2; min-width: 0; }
.md-preview { overflow: auto; padding: 24px clamp(18px, 4vw, 52px); min-width: 0; }
.md-render { line-height: 1.75; color: var(--fg); overflow-wrap: anywhere; }
.md-render > :first-child { margin-top: 0; }
.md-render h1, .md-render h2, .md-render h3, .md-render h4 { margin: 1.15em 0 .55em; line-height: 1.35; color: var(--fg); }
.md-render h1 { font-size: 1.8em; border-bottom: 1px solid var(--line); padding-bottom: .25em; }
.md-render h2 { font-size: 1.48em; border-bottom: 1px solid var(--line); padding-bottom: .2em; }
.md-render h3 { font-size: 1.22em; }
.md-render p { margin: .6em 0; }
.md-render ul, .md-render ol { padding-left: 1.8em; }
.md-render blockquote { margin: .8em 0; padding: .25em 1em; border-left: 3px solid var(--accent); color: var(--fg); background: color-mix(in srgb,var(--accent) 14%,transparent); }
.md-render pre { overflow-x: auto; padding: 12px 14px; border-radius: 6px; background: #202124; color: #f4f5f7; }
.md-render code { font-family: Consolas, monospace; font-size: .92em; }
.md-render :not(pre) > code { padding: 2px 5px; border-radius: 4px; background: var(--panel2); color: var(--accent); }
.md-render table { width: 100%; border-collapse: collapse; margin: 12px 0; display: block; overflow-x: auto; }
.md-render th, .md-render td { border: 1px solid var(--line); padding: 7px 10px; text-align: left; white-space: normal; }
.md-render th { background: var(--panel2); font-weight: 700; }
.md-render img { max-width: 100%; }
.md-render mark { background: #ffe58f; padding: 0 2px; }
.md-render .katex-display { overflow-x: auto; overflow-y: hidden; padding: 5px 0; }
.md-retry { margin-top: 9px; }
.md-error-line { color: var(--err); }


/* ---------------- 情报日报（RSS：筛选条 + 条目列表 + 来源管理） ---------------- */
.intel .it-head{display:flex;align-items:center;gap:10px;margin:0 0 12px}
.intel .it-head h3{margin:0}
.intel .it-head .btn{margin-left:auto}
.it-bar{display:grid;grid-template-columns:minmax(150px,210px) minmax(0,1fr) 110px;gap:10px;align-items:center}
.it-bar select,.it-bar input,.it-add input{height:36px;box-sizing:border-box;padding:0 10px;border:1px solid var(--line);
  border-radius:8px;background:var(--panel2);color:var(--fg)}
.it-list{margin-top:6px}
.it-row{padding:11px 0;border-top:1px solid var(--line)}
.it-t{color:var(--fg);font-weight:600;text-decoration:none}
.it-t:hover{color:var(--accent)}
.it-m{margin-top:4px;color:var(--muted);font-size:12px}
.it-s{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  margin-top:6px;color:var(--muted);font-size:12.5px;line-height:1.5}
.it-x{color:var(--err);font-size:11px}

/* ---- 论文翻译（工作流第 4 步：添加论文 → 元数据 → PDF 阅读器 → 中英互译 / 笔记模式 / 荧光笔） ---- */
.tr{display:flex;flex-direction:column;gap:10px;height:100%;min-height:0}
.tr-bar{display:flex;align-items:center;gap:10px;flex:none;height:44px}
.tr-bar>.btn,.tr-bar>.tr-sel,.tr-bar>.tr-pageno,.tr-bar>.tr-zoom,.tr-bar>.tr-seg,.tr-bar>.tr-grp{height:36px;display:inline-flex;align-items:center;justify-content:center;line-height:1;box-sizing:border-box;margin:0}
.tr-bar>.btn{padding:0 14px;font-size:13px}
.tr-bar>.tr-zoom{gap:2px;padding:0 3px;border:1px solid var(--line);border-radius:9px;background:var(--panel)}
.tr-bar>.tr-zoom>button{width:30px;height:30px;border:0;background:transparent;color:var(--fg);border-radius:7px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;font:inherit;font-size:15px;line-height:1}
.tr-bar>.tr-zoom>button:hover{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent)}
.tr-zoomv{min-width:44px;text-align:center;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.tr-seg,.tr-grp{display:inline-flex;padding:3px;gap:3px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.tr-seg-b{height:30px;padding:0 11px;border:0;border-radius:7px;background:transparent;color:var(--muted);font:inherit;font-size:12.5px;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;cursor:pointer}
.tr-seg-b:hover{background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent)}
.tr-seg-b.active{background:var(--accent);color:var(--accent-ink);font-weight:600}
.tr-seg-b:disabled{opacity:.55;cursor:default}
.tr-grp>.tr-ib{width:32px;height:30px;border:0;border-radius:7px;background:transparent;color:var(--muted);font-size:15px}
.tr-grp>.tr-ib:hover{background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent)}
.tr-grp>.tr-ib.active{background:color-mix(in srgb,var(--accent) 20%,transparent);color:var(--accent)}
.tr-status{flex:none;min-height:16px;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr-spacer{flex:1}
.tr-bar .btn-teal{background:var(--accent);color:var(--accent-ink,#0d1218);font-weight:600}
.tr-sel{flex:0 0 auto;max-width:230px;height:36px;padding:0 8px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;color:var(--fg);font:inherit;font-size:13px}
.tr-zoom{display:inline-flex;gap:6px}
.tr-ib{width:36px;height:36px;border:1px solid var(--line);border-radius:8px;background:var(--panel2);color:var(--fg);cursor:pointer;font-size:15px;line-height:1}
.tr-ib:hover,.tr-ib.active{border-color:var(--accent);color:var(--accent)}
.tr-pageno{display:inline-block;min-width:74px;padding:1px 8px;height:36px;line-height:34px;border:1px solid var(--line);border-radius:8px;background:var(--panel2);color:var(--muted);font-size:12.5px;text-align:center}
.tr-meta{display:grid;grid-template-columns:1fr 1fr;gap:5px 20px;flex:none;border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:10px 14px;font-size:13px;min-height:64px}
.tr-meta.busy{opacity:.6}
.tr-meta b{color:var(--muted);font-weight:600}
.tr-meta span{color:var(--fg);overflow-wrap:anywhere}
.tr-stage{position:relative;flex:1;min-height:0;border:1px solid var(--line);border-radius:10px;background:var(--panel2);overflow:hidden}
.tr-stage.dragging{outline:2px dashed var(--accent);outline-offset:-6px}
.tr-drop{position:absolute;inset:0;display:grid;place-items:center;padding:20px}
.tr-drop-in{display:grid;justify-items:center;gap:6px;border:1px dashed var(--line);border-radius:12px;padding:34px 46px;color:var(--muted);text-align:center}
.tr-drop-in b{color:var(--fg);font-size:14px}
.tr-drop-in span{font-size:12px}
.tr-drop-ico{font-size:34px}
.tr-pane{position:absolute;inset:0;min-width:0;overflow:hidden}
.tr-pane.hidden{display:none}
.tr-stage.dual{display:grid;grid-template-columns:1fr 6px 1fr}
.tr-stage.dual .tr-pane{position:relative;inset:auto}
.tr-split.hidden{display:none}
.tr-pane.act{box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--accent) 55%,transparent)}
.tr-stage.zen{position:fixed;inset:0;z-index:900;border-radius:0;margin:0;padding:0;background:var(--bg)}
.tr-zen-exit{display:none;position:absolute;right:14px;top:12px;z-index:20;align-items:center;gap:6px;
  padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:color-mix(in srgb,var(--panel) 92%,transparent);
  color:var(--fg);font:600 13px/1 system-ui,"Microsoft YaHei",sans-serif;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.28)}
.tr-zen-exit:hover{border-color:var(--accent);color:var(--accent)}
.tr-stage.zen .tr-zen-exit{display:flex}
.tr-pane-tag{position:absolute;left:10px;top:8px;z-index:6;background:color-mix(in srgb,var(--panel) 88%,transparent);border:1px solid var(--line);border-radius:999px;padding:1px 9px;font-size:11px;color:var(--muted)}
.tr-scroll{position:absolute;inset:0;overflow:auto;display:flex;flex-direction:column;align-items:center;gap:12px;padding:30px 12px 16px;background:color-mix(in srgb,var(--bg) 70%,var(--panel2))}
.tr-split{cursor:col-resize;background:var(--line);border-radius:3px}
.tr-split:hover{background:var(--accent)}
.tr-page{position:relative;background:#fff;box-shadow:0 3px 14px rgba(0,0,0,.28);flex:none}
.tr-page canvas{display:block;width:100%;height:100%}
.tr-ph{position:absolute;inset:0;display:grid;place-items:center;color:#9aa4b2;font-size:13px}
.tr-text{position:absolute;inset:0;overflow:hidden;line-height:1;-webkit-user-select:text;user-select:text}
.tr-text span{position:absolute;display:block;overflow:hidden;color:transparent;white-space:nowrap;transform-origin:0 0;cursor:text}
.tr-text ::selection{background:color-mix(in srgb,var(--accent) 45%,transparent)}
.tr-hls{position:absolute;inset:0;pointer-events:none}
.tr-hl{pointer-events:auto}
.tr-pen{position:absolute;right:16px;bottom:66px;z-index:30;width:216px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.tr-pen>b{font-size:13px}
.tr-pen i{font-style:normal;color:var(--muted);font-size:11px;cursor:help}
.tr-colors{display:flex;gap:10px;margin:8px 0 12px}
.tr-colors i{width:24px;height:24px;border-radius:50%;cursor:pointer;border:2px solid transparent}
.tr-colors i.on{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 32%,transparent)}
.tr-pen input[type=range]{width:100%;accent-color:var(--accent)}
.tr-foot{display:flex;align-items:center;gap:10px;flex:none}
.tr-foot .btn.active{border-color:var(--accent);color:var(--accent)}
.tr-msg{color:var(--muted);font-size:12px;margin-left:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* ---- 中译英：左上 ＋ / 右上 一键翻译，下面左英文右中文 ---- */
.en{display:flex;flex-direction:column;height:100%;min-height:0;gap:10px}
.en-bar{display:flex;align-items:center;gap:10px;flex:none;height:40px}
.en-sel{height:34px;max-width:260px;padding:0 8px;border:1px solid var(--line);border-radius:8px;background:var(--panel2);color:var(--fg);font:inherit;font-size:13px}
.en-spacer{flex:1}
.en-msg{font-size:12px;color:var(--muted);max-width:52ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.en-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;flex:1;min-height:0}
.en-col{border:1px solid var(--line);border-radius:10px;background:var(--panel);display:flex;flex-direction:column;min-height:0;min-width:0;overflow:hidden}
.en-h{display:flex;align-items:center;gap:8px;flex:none;height:36px;padding:0 10px;border-bottom:1px solid var(--line);font-size:12.5px;color:var(--muted)}
.en-tag{font-size:11.5px;color:var(--muted);max-width:22ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.en-src{flex:1;min-height:0;margin:0;padding:12px 14px;border:0;background:transparent;color:var(--fg);
        font:13px/1.75 ui-monospace,Consolas,"Courier New",monospace;resize:none;outline:none;-webkit-user-select:text;user-select:text}
#panel-entrans.dragging{outline:2px dashed var(--accent);outline-offset:-6px;border-radius:12px}

/* ---- 格式转换（照 Overleaf：可选格式 + 一键转换；文件 / 代码 / PDF 预览三栏）---- */
.cv{display:flex;flex-direction:column;height:100%;min-height:0;gap:10px}
.cv-bar{display:flex;align-items:center;gap:12px;flex:none;height:32px}
.cv-label{font-size:12.5px;font-weight:700;color:var(--fg);background:var(--accent);color:var(--accent-ink,#0d1218);padding:2px 10px;border-radius:6px}
.cv-fmts{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.cv-fmts label{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel2);color:var(--muted);font-size:12.5px;cursor:pointer}
.cv-fmts label.on{border-color:var(--accent);color:var(--fg)}
.cv-fmts input{accent-color:var(--accent)}
.cv-spacer{flex:1}
.cv-msg{font-size:12px;color:var(--muted);max-width:46ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cv-grid{display:grid;grid-template-columns:minmax(170px,22fr) minmax(0,50fr) minmax(230px,28fr);gap:10px;flex:1;min-height:0}
.cv-col{border:1px solid var(--line);border-radius:10px;background:var(--panel);display:flex;flex-direction:column;min-height:0;min-width:0;overflow:hidden}
.cv-h{display:flex;align-items:center;gap:8px;flex:none;height:36px;padding:0 10px;border-bottom:1px solid var(--line);font-size:12.5px;color:var(--muted)}
.cv-ib{height:24px;padding:0 8px;border:1px solid var(--line);border-radius:6px;background:var(--panel2);color:var(--fg);font-size:12px;cursor:pointer}
.cv-tag{font-size:11.5px;color:var(--muted);max-width:16ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cv-list{flex:1;min-height:0;overflow:auto;padding:6px}
.cv-g{padding:6px 6px 2px;font-size:11.5px;color:var(--muted)}
.cv-f{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:7px;font-size:12.5px;color:var(--fg);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cv-f:hover{background:var(--panel2)}
.cv-f.on{background:color-mix(in srgb,var(--accent) 18%,transparent);border:1px solid var(--accent)}
.cv-ext{flex:none;width:26px;text-align:center;font-size:10.5px;color:var(--muted);text-transform:uppercase}
.cv-none{color:var(--muted);font-size:12.5px;padding:10px}
.cv-src{flex:1;min-height:0;margin:0;padding:12px 14px;border:0;background:transparent;color:var(--fg);
        font:12.5px/1.65 ui-monospace,Consolas,"Courier New",monospace;resize:none;outline:none;-webkit-user-select:text;user-select:text}
.cv-frame{flex:1;min-height:0;border:0;background:#fff}
.cv-empty{flex:none;padding:10px 12px;color:var(--muted);font-size:12px;line-height:1.7}

/* ---- 确认大纲：左 2/3 框架 + 右 1/3 框架 agent（聊天壳沿用创新点审查那套 at-* 样式）---- */
.ol-grid{display:grid;grid-template-columns:minmax(0,2fr) minmax(340px,1fr);gap:12px;height:100%;min-height:0}
.ol-left{display:flex;flex-direction:column;min-width:0;min-height:0;border:1px solid var(--line);border-radius:10px;background:var(--panel);overflow:hidden}
.ol-head{display:flex;align-items:center;gap:8px;flex:none;height:40px;padding:0 12px;border-bottom:1px solid var(--line);font-size:13px}
.ol-head .btn{height:28px;padding:0 10px;font-size:12px}
.ol-tag{color:var(--muted);font-size:12px}
.ol-spacer{flex:1}
.ol-meta{color:var(--muted);font-size:11.5px}
.ol-body{flex:1;min-height:0;overflow:auto;padding:14px 20px;font-size:13.5px;line-height:1.9;-webkit-user-select:text;user-select:text}
.ol-src{flex:1;min-height:0;margin:10px 12px;padding:10px 12px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;color:var(--fg);font:12.5px/1.7 ui-monospace,Consolas,monospace;resize:none}
.ol-empty{color:var(--muted);font-size:13px;line-height:2}
.ol-right{display:flex;flex-direction:column;min-width:0;min-height:0;border:1px solid var(--line);border-radius:10px;background:var(--panel);overflow:hidden}
.ol-right .at-head{padding:10px 14px 6px}
.ol-right .at-heading h1{font-size:15px}
.ol-right .at-heading p{font-size:11.5px;line-height:1.5}
.ol-marks{flex:none;border-top:1px solid var(--line);padding:6px 12px 8px;max-height:150px;display:flex;flex-direction:column;gap:4px}
.ol-marks-h{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.ol-marks-h .btn{height:26px;padding:0 9px;font-size:12px}
.ol-marks-l{display:flex;flex-wrap:wrap;gap:6px;overflow:auto}
.ol-marks .att{font-size:11.5px}
mark.dw-hl{padding:1px 0;border-radius:3px;color:inherit;cursor:pointer}
.dw-pen{position:absolute;right:14px;bottom:120px;z-index:40;width:184px;background:var(--panel);border:1px solid var(--line);
        border-radius:12px;padding:12px 14px;box-shadow:0 10px 30px rgba(0,0,0,.4);font-size:13px}
.dw-colors{display:flex;gap:10px;margin-top:8px}
.dw-colors i{width:24px;height:24px;border-radius:50%;cursor:pointer;border:2px solid transparent}
.dw-colors i.on{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 30%,transparent)}
.dw-x{position:absolute;right:10px;top:8px;cursor:pointer;color:var(--muted);font-size:12px}
.ol-right{position:relative}
body.dw-pen-on .ol-body{cursor:text}
body.dw-pen-on .ol-body ::selection{background:color-mix(in srgb,var(--accent) 40%,transparent)}
@media (max-width:1150px){ .ol-grid{grid-template-columns:minmax(0,1fr)} .ol-right{display:none} }

.tr-note{position:absolute;inset:0;z-index:12;display:flex;flex-direction:column;padding:10px;box-sizing:border-box}
.tr-note-grid{display:grid;grid-template-columns:minmax(0,3fr) minmax(300px,1fr);gap:12px;flex:1;min-height:0}
.tr-note-bar{display:flex;align-items:center;gap:8px;flex:none;height:42px;padding:0 2px}
.tr-note-bar .tr-ib,.tr-zen-zoom .tr-ib{width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center;box-sizing:border-box;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--fg);font-size:15px;line-height:1;cursor:pointer}
.tr-note-bar .tr-ib:hover,.tr-zen-zoom .tr-ib:hover{border-color:var(--accent);color:var(--accent)}
.tr-zoomv{color:var(--muted);font-size:12px;min-width:46px;text-align:center;font-variant-numeric:tabular-nums}
.tr-note-exit{width:auto !important;padding:0 12px;gap:6px;font-size:13px}
.tr-zen-zoom{display:none;position:absolute;left:14px;top:12px;z-index:20;align-items:center;gap:6px;padding:4px;border-radius:10px;background:color-mix(in srgb,var(--panel) 88%,transparent);border:1px solid var(--line)}
.tr-stage.zen .tr-zen-zoom{display:flex}
.tr-stage.note .tr-zen-zoom,.tr-stage.note .tr-zen-exit{display:none}
.tr-note-l,.tr-note-r{border:1px solid var(--line);border-radius:10px;background:var(--panel);display:flex;flex-direction:column;min-width:0;overflow:hidden}
.tr-note-h{flex:none;padding:8px 12px;border-bottom:1px solid var(--line);color:var(--muted);font-size:12px}
.tr-note-body{flex:1;min-height:0;overflow:auto;padding:12px 18px;font-size:13.5px}
.tr-note-title{margin:10px 12px 4px;padding:8px 10px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;color:var(--fg);font:inherit;font-size:14px;font-weight:600}
.tr-note-hint{padding:0 12px 8px;color:var(--muted);font-size:11px}
.tr-note-src{flex:1;min-height:0;margin:0 12px 12px;padding:10px 12px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;color:var(--fg);font:13.5px/1.75 inherit;resize:none}
.tr-load{padding:22px;color:var(--muted)}
.tr-load.err{color:var(--err)}
/* ==================== 开始卡片（splash）：地球 + 标题字 + 「进入」 ==================== */
#splash{position:fixed;inset:0;z-index:9000;background:#0B0C0E;overflow:hidden;opacity:0;pointer-events:none;transition:opacity .42s ease}
#splash.ready{opacity:1;pointer-events:auto}
#splash.out{opacity:0}
#splash .sp-globe{position:absolute;left:0;right:0;top:-12.7%;height:79%;width:100%;display:block;touch-action:none;user-select:none}
#splash .sp-word{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}   /* 字标铺满整卡：手柄三角/坐标标签要有原组件的空间比例；不吃指针事件，地球才拖得动 */
/* 「Enter」= magicui Interactive Hover Button 照抄：胶囊 + 圆点；悬停时圆点放大填满、文字右移淡出、覆盖层(文字+箭头)滑入 */
#splash .sp-go{position:absolute;left:50%;top:86%;transform:translate(-50%,-50%);display:block;width:auto;padding:12px 36px;border:1px solid var(--line);border-radius:9999px;background:linear-gradient(180deg,var(--bg) 0%,color-mix(in srgb,var(--bg) 44%,#0B0C0E) 100%);color:var(--fg);font:800 24px/1 "Inter","Segoe UI","Microsoft YaHei",system-ui,sans-serif;letter-spacing:-0.02em;text-align:center;cursor:pointer;overflow:hidden}   /* top =（标题行 71.9% + 卡底 100%）/2；字体/字重/字距与字标同一套 */
#splash .sp-in{display:flex;align-items:center;justify-content:center;gap:12px}
#splash .sp-dot{width:12px;height:12px;flex:none;border-radius:9999px;background:linear-gradient(180deg,var(--accent) 47.9%,color-mix(in srgb,var(--accent) 44%,#0B0C0E) 52.1%);transition:all .3s}   /* 蓝态=字标同款纵向渐变。圆点要 scale(100.8) 放大到 ~1210px 去填胶囊，所以渐变只占 47.9~52.1% 这一小段 —— 放大后刚好铺满 49px 的胶囊高度（胶囊高度变了要同步改这两个数） */
#splash .sp-go:hover .sp-dot{transform:scale(100.8)}
#splash .sp-lb{display:inline-block;background:linear-gradient(180deg,var(--fg) 0%,color-mix(in srgb,var(--fg) 62%,var(--bg)) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;transition:all .3s}
#splash .sp-go:hover .sp-lb{transform:translateX(48px);opacity:0}
#splash .sp-hv{position:absolute;left:0;top:0;z-index:10;display:flex;align-items:center;justify-content:center;gap:12px;width:100%;height:100%;color:var(--accent-ink);opacity:0;transform:translateX(48px);transition:all .3s;pointer-events:none}
#splash .sp-go:hover .sp-hv{transform:translateX(-20px);opacity:1}
#splash .sp-hv span{background:linear-gradient(180deg,var(--accent-ink) 0%,color-mix(in srgb,var(--accent-ink) 62%,var(--accent)) 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
#splash .sp-hv svg{width:27px;height:27px;flex:none}
#splash .sp-close{position:absolute;right:10px;top:8px;width:34px;height:34px;border:0;background:none;color:#fff;opacity:.3;font:400 18px/1 "Segoe UI",sans-serif;cursor:pointer;transition:opacity .2s}
#splash .sp-close:hover{opacity:.85}
/* ==================== 知识库（Obsidian 看板；版式照 Baixiao-Reading-Cockpit） ==================== */
.kb-page{display:flex;flex-direction:column;gap:12px;padding-bottom:8px}
.kb-head{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}
.kb-head h2{margin:0;font-size:20px;line-height:1.2}
.kb-head p{margin:3px 0 0;color:var(--muted);font-size:12px}
.kb-actions{margin-left:auto;display:flex;align-items:center;gap:10px}
.kb-search{display:flex;align-items:center;gap:8px;height:36px;padding:0 12px;background:var(--panel2);border:1px solid var(--line);border-radius:9px;color:var(--muted)}
.kb-search input{width:230px;height:100%;border:0;background:none;outline:none;color:var(--fg)}
.kb-actions .btn{height:36px;display:inline-flex;align-items:center}
.kb-vault{display:flex;align-items:center;gap:10px;padding:9px 12px;background:var(--panel2);border:1px solid var(--line);border-radius:9px;font-size:13px}
.kb-vault-i{color:var(--accent)}
.kb-vault .kb-path{color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:52%}
.kb-vault-n{margin-left:auto;color:var(--muted);font-size:12px}
.kb-vault.kb-empty{color:var(--muted)}
.kb-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kb-stat{position:relative;padding:12px 14px;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);overflow:hidden}
.kb-stat-t{color:var(--muted);font-size:12px}
.kb-stat-v{font-size:26px;font-weight:700;line-height:1.15}
.kb-stat-u{color:var(--muted);font-size:11px;margin-left:5px}
.kb-stat-c{color:var(--muted);font-size:11px;margin-top:2px}
.kb-stat-i{position:absolute;right:12px;top:10px;font-size:17px;color:var(--accent);opacity:.55}
.kb-stat.kb-slim .kb-stat-v{font-size:22px}
.kb-board{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.45fr) minmax(0,.95fr);gap:12px;align-items:start}
.kb-sec-head{display:flex;align-items:baseline;gap:10px;margin-bottom:8px}
.kb-sec-head span{margin-left:auto;color:var(--muted);font-size:12px}
.kb-tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.kb-tab{height:30px;padding:0 12px;border:1px solid var(--line);border-radius:9999px;background:var(--panel2);color:var(--muted);cursor:pointer}
.kb-tab:hover{color:var(--fg)}
.kb-tab.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.kb-list{display:flex;flex-direction:column;gap:6px;max-height:430px;overflow:auto;padding-right:2px}
.kb-row{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;background:var(--panel2);border:1px solid var(--line);border-radius:9px;cursor:pointer;text-align:left;color:var(--fg)}
.kb-row:hover{border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.kb-row.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--panel2))}
.kb-row-t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kb-row-f{color:var(--muted);font-size:11px;max-width:26%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kb-row-d{color:var(--muted);font-size:11px;font-variant-numeric:tabular-nums}
.kb-state{font-size:11px;padding:2px 8px;border-radius:9999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.kb-r1{color:#b07d00;border-color:color-mix(in srgb,#b07d00 45%,var(--line))}
.kb-r2{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 45%,var(--line))}
.kb-a1{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 45%,var(--line))}
.kb-a2{color:var(--muted)}
.kb-foot{margin-top:8px;color:var(--muted);font-size:12px}
.kb-side{display:flex;flex-direction:column;gap:12px}
.kb-detail-head{display:flex;justify-content:space-between;color:var(--muted);font-size:12px}
.kb-detail-id{color:var(--muted);font-size:11px;margin-top:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kb-detail-title{font-size:15px;font-weight:600;margin:2px 0 10px}
.kb-detail-grid{display:grid;grid-template-columns:auto 1fr;gap:7px 12px;align-items:center;font-size:12.5px}
.kb-detail-grid>span{color:var(--muted)}
.kb-detail-grid b{font-weight:500}
.kb-sel{height:30px;padding:0 8px;background:var(--panel2);border:1px solid var(--line);border-radius:7px;color:var(--fg)}
.kb-tag{font-style:normal;color:var(--accent);margin-right:6px}
.kb-tip-card{margin:11px 0;padding:9px 11px;background:var(--panel2);border:1px solid var(--line);border-radius:9px;font-size:12px;color:var(--muted);line-height:1.6}
.kb-tip-card b{display:block;color:var(--fg);margin-bottom:2px}
.kb-actions2{display:flex;gap:8px;flex-wrap:wrap}
.kb-actions2 .btn{height:34px;display:inline-flex;align-items:center}
.kb-rate b{font-size:30px;line-height:1.1}
.kb-rate small{color:var(--muted);font-size:11px;margin-left:6px}
.kb-bar{display:block;height:7px;margin:9px 0 7px;background:var(--panel2);border:1px solid var(--line);border-radius:9999px;overflow:hidden}
.kb-bar em{display:block;height:100%;background:linear-gradient(90deg,color-mix(in srgb,var(--accent) 55%,var(--panel2)),var(--accent))}
.kb-rate-n{color:var(--muted);font-size:11.5px}
.kb-heat-head{display:flex;align-items:baseline;gap:10px}
.kb-heat-head b{font-size:14px}
.kb-heat-head small{color:var(--muted);font-size:11px;margin-left:8px}
.kb-heat-head time{color:var(--muted);font-size:12px;margin-left:auto;font-variant-numeric:tabular-nums}
.kb-heat-today{height:26px;padding:0 10px;border:1px solid var(--line);border-radius:9999px;background:var(--panel2);color:var(--muted);cursor:pointer}
.kb-heat-line{margin:8px 0 10px;color:var(--muted);font-size:12px}
.kb-heat-line strong{color:var(--fg)}
.kb-heat-line i{display:inline-block;width:1px;height:10px;background:var(--line);margin:0 8px;vertical-align:-1px}
.kb-heat-scroll{overflow-x:auto;padding-bottom:4px}
.kb-heat-grid{display:grid;grid-template-rows:repeat(7,12px);grid-auto-flow:column;gap:3px;width:max-content}
.kb-heat-cell,.kb-heat-empty{width:12px;height:12px;border-radius:3px}
.kb-heat-empty{background:transparent}
.kb-heat-cell{border:0;padding:0;background:var(--panel2);cursor:pointer}
.kb-heat-cell:hover{outline:1px solid var(--muted)}
.kb-heat-cell.is-today{outline:1px solid var(--fg)}
.kb-heat-cell[data-lv="1"]{background:color-mix(in srgb,var(--ok) 38%,var(--panel2))}
.kb-heat-cell[data-lv="2"]{background:color-mix(in srgb,var(--ok) 78%,var(--panel2))}
.kb-heat-cell[data-rv="1"]{background:color-mix(in srgb,var(--accent) 42%,var(--panel2))}
.kb-heat-cell[data-rv="2"]{background:color-mix(in srgb,var(--accent) 88%,var(--panel2))}
.kb-heat-months{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-top:5px;width:max-content;min-width:100%}
.kb-heat-legend{display:flex;align-items:center;gap:10px;margin-top:6px;color:var(--muted);font-size:11px}
.kb-lg{display:inline-flex;align-items:center;gap:5px}
.kb-lg::before{content:"";width:12px;height:12px;border-radius:3px;background:var(--panel2)}
.kb-lg[data-lv="1"]::before{background:color-mix(in srgb,var(--ok) 38%,var(--panel2))}
.kb-lg[data-lv="2"]::before{background:color-mix(in srgb,var(--ok) 78%,var(--panel2))}
.kb-lg[data-rv="1"]::before{background:color-mix(in srgb,var(--accent) 42%,var(--panel2))}
.kb-lg[data-rv="2"]::before{background:color-mix(in srgb,var(--accent) 88%,var(--panel2))}
.kb-heat-tip{margin-top:7px;color:var(--muted);font-size:11.5px;font-variant-numeric:tabular-nums}
.kb-load{color:var(--muted)}
.kb-err{color:var(--err)}

/* ---- 流体统计卡（WebGL 材质；WebGL 不可用时走 .is-fallback 的 CSS 渐变，与参考插件同款降级） ---- */
.kb-stat.kb-fluid-stat{padding:14px 16px;isolation:isolate;background:linear-gradient(145deg,rgba(14,24,22,.38),rgba(2,12,10,.16));border-color:color-mix(in srgb,var(--accent) 26%,var(--line));box-shadow:0 18px 54px rgba(0,0,0,.28),inset 0 1px 0 rgba(219,255,247,.16)}
.kb-fluid-canvas{position:absolute;inset:0;z-index:0;width:100%;height:100%;pointer-events:none;opacity:.98;transform:scale(1.035);filter:saturate(1.1) contrast(1.04) blur(1.15px)}
.kb-fluid-noise{position:absolute;inset:0;z-index:1;pointer-events:none;opacity:.16;background-image:radial-gradient(rgba(225,255,248,.62) .45px,transparent .7px);background-size:4px 4px;mix-blend-mode:overlay}
.kb-fluid-fallback{position:absolute;inset:-10%;z-index:0;pointer-events:none;opacity:.8;background:radial-gradient(circle at 82% 18%,rgba(0,231,210,.75),transparent 38%),radial-gradient(circle at 54% 94%,rgba(60,200,255,.46),transparent 48%),radial-gradient(circle at 100% 58%,rgba(7,95,104,.62),transparent 58%);filter:blur(13px);animation:kb-fluid-fallback 9s ease-in-out infinite}
.kb-fluid-stat:not(.is-fallback) .kb-fluid-fallback{display:none}
.kb-fluid-stat.is-fallback .kb-fluid-canvas{display:none}
.kb-fluid-stat .kb-stat-content{position:relative;z-index:2;color:var(--stat-text,#f4f7f5);text-shadow:0 1px 8px rgba(0,0,0,var(--content-shade,.45))}
.kb-fluid-stat .kb-stat-t,.kb-fluid-stat .kb-stat-c,.kb-fluid-stat .kb-stat-u{color:inherit;opacity:.88}
.kb-fluid-stat .kb-stat-v{color:inherit}
.kb-fluid-stat .kb-stat-i{color:inherit;opacity:.55;border:0}
.kb-fluid-stat:not(.is-fallback)::before{content:"";position:absolute;inset:-20%;z-index:0;pointer-events:none;background:radial-gradient(ellipse at 76% 23%,rgba(76,255,231,.20),transparent 39%),radial-gradient(ellipse at 28% 88%,rgba(45,198,255,.15),transparent 43%);mix-blend-mode:screen;filter:blur(12px);animation:kb-fluid-breathe 5.5s ease-in-out infinite}
@keyframes kb-fluid-breathe{50%{transform:translate(-7%,5%) scale(1.13);opacity:.55}}
@keyframes kb-fluid-fallback{50%{transform:translate(4%,-3%) scale(1.08);opacity:.62}}
@media (prefers-reduced-motion:reduce){.kb-fluid-stat::before,.kb-fluid-fallback{animation:none}}

/* ---- 3D 环绕目录卡（stage / scene / ring 的变换与参考插件一致；accents 换成主题色） ---- */
.kb-visual{border-radius:14px;display:flex;flex-direction:column;padding:10px 10px 0;min-height:0;background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow)}
.kb-toolbar{min-height:34px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.kb-toolbar button{height:30px;padding:0 10px;border:1px solid var(--line);border-radius:9px;background:var(--panel2);color:var(--muted);font-size:11.5px;cursor:pointer;margin:0 5px 4px 0}
.kb-toolbar button.active,.kb-toolbar button:hover{color:var(--fg);border-color:color-mix(in srgb,var(--accent) 40%,var(--line));background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
.kb-stage{position:relative;flex:1;min-height:320px;perspective:1200px;overflow:hidden;cursor:grab;touch-action:none;user-select:none;border-radius:10px;background:radial-gradient(ellipse at 54% 56%,color-mix(in srgb,var(--accent) 12%,transparent),transparent 27%),radial-gradient(ellipse at 54% 74%,rgba(255,255,255,.05),transparent 35%)}
.kb-stage:active,.kb-stage.is-dragging{cursor:grabbing}
.kb-stage::before{content:"";position:absolute;left:6%;right:2%;bottom:4%;height:47%;background:linear-gradient(color-mix(in srgb,var(--accent) 14%,transparent) 1px,transparent 1px),linear-gradient(90deg,color-mix(in srgb,var(--accent) 10%,transparent) 1px,transparent 1px);background-size:32px 25px;transform:perspective(430px) rotateX(67deg);transform-origin:bottom;mask-image:linear-gradient(to top,#000,transparent 90%);opacity:.45;pointer-events:none}
.kb-floor{position:absolute;left:54%;top:61%;width:440px;height:92px;transform:translate(-50%,-50%) rotateX(72deg);border-radius:50%;background:radial-gradient(ellipse,color-mix(in srgb,var(--accent) 22%,transparent),transparent 70%)}
.kb-orbit-core{position:absolute;left:54%;top:52%;width:98px;height:98px;transform:translate(-50%,-50%);border-radius:50%;border:1px solid color-mix(in srgb,var(--accent) 30%,transparent);background:radial-gradient(circle,color-mix(in srgb,var(--accent) 16%,transparent),transparent 67%);box-shadow:0 0 54px color-mix(in srgb,var(--accent) 22%,transparent),inset 0 0 35px color-mix(in srgb,var(--accent) 8%,transparent);animation:kb-pulse-halo 3.3s ease-in-out infinite}
.kb-orbit-core::before,.kb-orbit-core::after{content:"";position:absolute;inset:16px;border-radius:50%;border:1px dashed color-mix(in srgb,var(--accent) 34%,transparent);animation:kb-spin-ring 11s linear infinite}
.kb-orbit-core::after{inset:30px;border-style:solid;animation-direction:reverse;animation-duration:7s}
@keyframes kb-pulse-halo{50%{box-shadow:0 0 70px color-mix(in srgb,var(--accent) 30%,transparent),inset 0 0 42px color-mix(in srgb,var(--accent) 12%,transparent)}}
@keyframes kb-spin-ring{to{transform:rotate(360deg)}}
.kb-scene{position:absolute;left:54%;top:51%;width:0;height:0;transform-style:preserve-3d;will-change:transform}
.kb-ring{transform-style:preserve-3d}
.kb-orbit-card{position:absolute;width:120px;height:182px;margin:-91px 0 0 -60px;padding:10px;border:1px solid rgba(255,255,255,.68);border-radius:12px;background:linear-gradient(145deg,rgba(244,248,246,.92),rgba(170,179,174,.49));box-shadow:0 18px 28px rgba(0,0,0,.42);color:#37423c;cursor:pointer;transform-style:preserve-3d;will-change:transform,opacity,filter;transition:opacity .12s linear,filter .12s linear}
.kb-orbit-card:hover{filter:brightness(1.15)}
.kb-orbit-card.is-front{border-color:#fff;box-shadow:0 24px 40px rgba(0,0,0,.5),0 0 22px color-mix(in srgb,var(--accent) 45%,transparent)}
.kb-card-top{display:flex;justify-content:space-between;align-items:flex-start;color:rgba(22,29,25,.7);font-size:10px;font-weight:600;padding-bottom:2px}
.kb-card-top i{display:block;width:6px;height:6px;border-radius:50%;background:rgba(19,26,22,.34);box-shadow:0 0 0 3px rgba(255,255,255,.14)}
.kb-card-lines{position:absolute;left:12px;right:12px;top:45px;height:72px;background:repeating-linear-gradient(to bottom,rgba(27,38,31,.22) 0 2px,transparent 2px 10px);opacity:.72;mask-image:linear-gradient(90deg,#000 72%,transparent)}
.kb-card-glyph{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);font-size:22px;color:rgba(15,24,18,.58);text-shadow:0 1px 0 rgba(255,255,255,.34)}
.kb-orbit-card b{position:absolute;left:10px;right:10px;bottom:31px;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kb-orbit-card small{position:absolute;bottom:12px;left:10px;right:10px;text-align:center;font-size:9.5px;color:rgba(31,42,36,.72)}
.kb-card-reflection{position:absolute;left:0;right:0;top:100%;height:60%;transform:scaleY(-1);opacity:.09;filter:blur(2px);mask-image:linear-gradient(to bottom,rgba(0,0,0,.65),transparent);background:inherit;pointer-events:none}
.kb-orbit-card.is-front .kb-card-top,.kb-orbit-card.is-front b{color:#123123}
.kb-orbit-card.is-front .kb-card-top i{background:var(--accent);box-shadow:0 0 10px color-mix(in srgb,var(--accent) 60%,transparent)}
.kb-progress{position:absolute;left:6%;top:14%;z-index:4;width:118px;padding:14px 13px;border-radius:14px;background:linear-gradient(145deg,rgba(255,255,255,.16),rgba(255,255,255,.035));border:1px solid rgba(255,255,255,.16);box-shadow:0 10px 26px rgba(0,0,0,.22);backdrop-filter:blur(6px);color:#f4f7f5;transform:rotateY(20deg) rotateZ(-4deg) scale(var(--kb-progress-scale,1));cursor:grab;touch-action:none}
.kb-progress.is-dragging{cursor:grabbing}
.kb-progress>div:first-of-type{font-size:11px;color:#cfd8d4}
.kb-progress b{display:block;font-size:30px;line-height:1.1;margin-top:9px}
.kb-progress small{font-size:10px;color:#a9b3ae}
.kb-progress>i{display:block;height:3px;background:rgba(255,255,255,.14);margin-top:10px;border-radius:2px;overflow:hidden}
.kb-progress em{display:block;height:100%;background:var(--accent)}
.kb-progress-controls{position:absolute;right:-9px;top:-9px;display:flex;gap:4px}
.kb-progress-controls button{width:20px;height:20px;border-radius:50%;border:1px solid rgba(255,255,255,.24);background:rgba(12,18,16,.86);color:#e8f2ee;font-size:12px;line-height:1;cursor:pointer}
.kb-live{position:absolute;right:9px;top:10px;font-size:10px;color:color-mix(in srgb,var(--accent) 70%,#fff)}
.kb-live i{display:inline-block;width:5px;height:5px;background:var(--accent);border-radius:50%;margin-right:5px}
.kb-caption{position:absolute;left:54%;bottom:7px;transform:translateX(-50%);white-space:nowrap;padding:6px 11px;border:1px solid rgba(255,255,255,.08);border-radius:16px;background:rgba(7,11,9,.62);font-size:10px;color:#a9b3ae;max-width:94%;overflow:hidden;text-overflow:ellipsis}
.kb-caption b{color:#eaf2ee;margin-left:5px}
@media (prefers-reduced-motion:reduce){.kb-orbit-core,.kb-orbit-core::before,.kb-orbit-core::after{animation:none}}


/* ============ 笔记页 · 方案②（莫兰迪静谧）· 全走主题变量，2026-10-11 ============ */
.md-view{ --r-md: 10px; }
.md-view .md-note-item{ border-radius: var(--r-md); }
.md-view .md-note-item.active{ background: color-mix(in srgb,var(--accent) 15%,var(--panel)); border-color: color-mix(in srgb,var(--accent) 34%,transparent); }
.md-view .md-bind{ background: color-mix(in srgb,var(--accent) 18%,var(--panel)); }
.md-view .md-tool-btn, .md-view .md-tool-select, .md-view .md-task-select, .md-view .md-drop-zone{ border-radius: var(--r-md); }
/* 阅读/预览：字号与行高走 ② 档；底色一律从 --accent 混出来（本页再无硬编码色） */
.md-view .md-render{ font-size: 15px; line-height: 1.9; }
.md-view .md-render blockquote{ margin: 15px 0; padding: 10px 15px; border-radius: 0 var(--r-md) var(--r-md) 0; background: color-mix(in srgb,var(--accent) 6%,var(--panel)); }
.md-view .md-render th{ background: color-mix(in srgb,var(--accent) 8%,var(--panel)); }
.md-view .md-render th, .md-view .md-render td{ padding: 9px 11px; }
.md-view .md-render :not(pre) > code{ background: color-mix(in srgb,var(--accent) 8%,var(--panel)); }
.md-view .md-render pre{ background: var(--panel2); border: 1px solid var(--line); border-radius: var(--r-md); }
.mp-grid{display:grid;grid-template-columns:minmax(0,2fr) minmax(320px,1fr);gap:12px;height:100%;min-height:0}
.mp-left,.mp-right{border:1px solid var(--line);border-radius:10px;background:var(--panel);display:flex;flex-direction:column;min-width:0;overflow:hidden}
.mp-head{flex:none;display:flex;align-items:center;gap:8px;height:44px;padding:0 12px;border-bottom:1px solid var(--line)}
.mp-head>b{font-size:14px;font-weight:600}
.mp-meta{color:var(--muted);font-size:12px}
.mp-spacer{flex:1}
.mp-canvas-wrap{position:relative;flex:1;min-height:0;overflow:auto;background:
  radial-gradient(circle at 1px 1px,color-mix(in srgb,var(--fg) 7%,transparent) 1px,transparent 0) 0 0/22px 22px}
.mp-canvas-wrap.dragging{outline:2px dashed var(--accent);outline-offset:-6px}
.mp-canvas{position:relative;min-width:100%;min-height:100%}
.mp-svg{position:absolute;left:0;top:0;pointer-events:none}
.mp-edge{fill:none;stroke:var(--line);stroke-width:1.4}
.mp-edge.on{stroke:var(--accent);stroke-width:2}
.mp-edge.dash{stroke-dasharray:4 4}
.mp-elabel{fill:var(--muted);font-size:10.5px}
.mp-node{position:absolute;border-radius:10px;border:1px solid var(--line);background:var(--panel2);cursor:pointer;
  padding:8px 10px;box-sizing:border-box;overflow:hidden;transition:border-color .12s,transform .12s}
.mp-node:hover{border-color:color-mix(in srgb,var(--accent) 55%,var(--line))}
.mp-node.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.mp-node.sec{background:color-mix(in srgb,var(--accent) 9%,var(--panel2));border-left:3px solid var(--accent)}
.mp-node .t{font-size:12.5px;font-weight:600;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mp-node .d{font-size:11.5px;color:var(--muted);line-height:1.4;margin-top:4px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.mp-node .k{position:absolute;right:7px;top:6px;font-size:10px;color:var(--muted)}
.mp-node.ref{display:flex;align-items:center;padding:0 9px;height:34px}
.mp-node.ref .t{-webkit-line-clamp:1;font-weight:400;font-size:12px;display:flex;align-items:center;min-width:0}
.mp-node.ref .t>span.lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mp-pill{flex:none;font-size:10px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:0 6px;margin-left:auto}
.mp-node.sec .d{-webkit-line-clamp:2;margin-top:2px}
.mp-dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:5px;vertical-align:1px}
.mp-empty{position:absolute;left:0;right:0;top:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:0 28px}
.mp-empty .big{font-size:34px}
.mp-empty .t1{font-size:14px;font-weight:600}
.mp-empty .t2{font-size:12px;color:var(--muted);line-height:1.8}
.mp-card{position:absolute;right:14px;bottom:14px;width:300px;border:1px solid var(--line);border-radius:10px;background:var(--panel);box-shadow:var(--shadow);padding:12px 14px}
.mp-card h4{margin:0 0 6px;font-size:13px}
.mp-card p{margin:0 0 8px;font-size:12px;color:var(--muted);line-height:1.7;white-space:pre-wrap}
.mp-card .row{display:flex;gap:8px;align-items:center}
.mp-src{display:flex;flex-wrap:wrap;gap:6px;padding:8px 12px 0}
.mp-chip{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 8px;background:var(--panel2)}
</style>
</head>
<body>
<!-- 开始卡片：双击快捷方式先看到它，点「进入」才进主界面（卡片在的时候主界面已经在后面加载） -->

<!-- 个人资料弹窗（照 lit 的填写页面；学校/专业/年级/进度按「其余信息不显示」删掉） -->

<script src="/vendor/splash.js"></script>
<script src="/vendor/kb3d.js"></script>
