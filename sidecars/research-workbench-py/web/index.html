<script>
"use strict";
/* ============================== 状态 ============================== */
const S = { tasks:[], chats:[], models:[], active:null, events:[], tools:[], chat:[], chatEvents:[], loaded:false };
let tabs = [{id:"agent",route:"agent",title:"Agent"}];
let activeTab = tabs[0].id;
let curTask = localStorage.getItem("rw-task") || null;
let tDir = "";                                   // 新建项目时选的「项目位置」，选完即用，不持久化
let curChat = localStorage.getItem("rw-chat") || null;   // Agent 页当前对话（独立于项目）


/* ---------------- 个人资料（照 lit：侧栏卡片 + 填写弹窗；卡片只显示头像和用户名） ---------------- */
const profile = Object.assign({ name:"研究生", avatar:"🎓", field:"", photo:"" },
  JSON.parse(localStorage.getItem("rw-profile") || "{}"));
/* 头像：有照片就用照片（本地缩成 128×128 存 localStorage），没有就回落 Emoji；默认 🎓 */
function avatarPhoto(){ const p = String(profile.photo || ""); return p.startsWith("data:image/") ? p : ""; }
function avatarInner(){                      // 给模板串用（侧栏 / 日历问候卡）
  const p = avatarPhoto();
  return p ? `<img class="avatar-img" src="${p}" alt="">` : esc(profile.avatar || "🎓");
}
function paintAvatar(){
  const a=$("profileAvatar");
  if(a){
    const p = avatarPhoto();
    if(p){ a.innerHTML = `<img class="avatar-img" src="${p}" alt="">`; a.classList.add("has-photo"); }
    else { a.textContent = profile.avatar || "🎓"; a.classList.remove("has-photo"); }
  }
  const h=$("calHelloAvatar");
  if(h){
    const p = avatarPhoto();
    if(p){ h.innerHTML = `<img class="avatar-img" src="${p}" alt="">`; }
    else h.textContent = profile.avatar || "🎓";
  }
}
function paintProfilePreview(){
  const img = $("profPhotoPrev"); if(!img) return;
  const p = avatarPhoto();
  if(p){ img.src = p; img.classList.add("on"); } else { img.removeAttribute("src"); img.classList.remove("on"); }
}
function readAvatarFile(file, cb){
  if(!file) return;
  if(!/^image\//.test(file.type || "")){ alert("这不是图片文件"); return; }
  const fr = new FileReader();
  fr.onerror = ()=>alert("读文件失败");
  fr.onload = ()=>{
    const im = new Image();
    im.onerror = ()=>alert("这张图片读不了（格式可能不支持）");
    im.onload = ()=>{
      try{
        const S = 128, side = Math.min(im.width, im.height);
        const c = document.createElement("canvas"); c.width = c.height = S;
        const g = c.getContext("2d");
        g.drawImage(im, (im.width-side)/2, (im.height-side)/2, side, side, 0, 0, S, S);
        cb(c.toDataURL("image/jpeg", 0.86));
      }catch(e){ alert("这张图片处理失败：" + e.message); }
    };
    im.src = fr.result;
  };
  fr.readAsDataURL(file);
}
function setAvatarPhoto(url){
  profile.photo = url || "";
  localStorage.setItem("rw-profile", JSON.stringify(profile));
  paintProfilePreview(); renderProfile();
}
function renderProfile(){
  const n=$("profileName");
  if(n) n.textContent = profile.name || "研究生";
  paintAvatar();
}
function openProfileModal(){
  $("profName").value = profile.name || "";
  $("profAvatar").value = profile.avatar || "🎓";
  $("profField").value = profile.field || "";
  paintProfilePreview();
  $("profileModal").classList.remove("hidden");
  setTimeout(()=>$("profName").focus(), 50);
}
function closeProfileModal(){ $("profileModal").classList.add("hidden"); }
function saveProfileModal(){
  profile.name = ($("profName").value || "").trim() || "研究生";
  profile.avatar = ($("profAvatar").value || "").trim() || "🎓";
  profile.field = ($("profField").value || "").trim();
  localStorage.setItem("rw-profile", JSON.stringify(profile));
  renderProfile(); closeProfileModal();
}
function greetWord(){
  const h = new Date().getHours();
  return h<6 ? "夜深了" : h<12 ? "早上好" : h<14 ? "中午好" : h<18 ? "下午好" : "晚上好";
}
const helloText = ()=> `${greetWord()}，${profile.name || "研究生"}`;
let seq = 1;
const $ = (id)=>document.getElementById(id);
const esc = (s)=>String(s??"").replace(/[&<>"]/g,(c)=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ---- Markdown 管线（照抄 lit：marked + KaTeX 扩展 + DOMPurify 白名单） ---- */
if(window.marked && window.marked.use){
  window.marked.use({gfm:true, breaks:true, extensions:[
    {name:"blockKatex", level:"block", start:(src)=>src.indexOf("$$"),
     tokenizer(src){ const m=/^\$\$\s*([\s\S]+?)\s*\$\$(?:\n|$)/.exec(src); return m?{type:"blockKatex",raw:m[0],text:m[1]}:undefined; },
     renderer(tok){ try{ return window.katex.renderToString(tok.text,{displayMode:true,throwOnError:false,output:"htmlAndMathml"}); }catch(e){ return `<pre>${esc(tok.text)}</pre>`; } }},
    {name:"inlineKatex", level:"inline", start:(src)=>src.indexOf("$"),
     tokenizer(src){ const m=/^\$([^$\n]+?)\$/.exec(src); return m?{type:"inlineKatex",raw:m[0],text:m[1]}:undefined; },
     renderer(tok){ try{ return window.katex.renderToString(tok.text,{displayMode:false,throwOnError:false,output:"htmlAndMathml"}); }catch(e){ return `<code>${esc(tok.text)}</code>`; } }},
  ]});
}
if(window.DOMPurify && window.DOMPurify.addHook){
  window.DOMPurify.addHook("uponSanitizeAttribute", (_node, data)=>{   // 放行工具条写进去的 font/字号/对齐/高亮样式
    if(data.attrName === "style"){
      const ok = String(data.attrValue||"").split(";").map(s=>s.trim()).filter(s=>
        /^(?:font-family\s*:\s*[\w\s,"'-]+|font-size\s*:\s*\d{1,2}(?:\.\d+)?(?:px|pt|em|rem|%)|text-align\s*:\s*(?:left|center|right|justify)|background-color\s*:\s*(?:#[0-9a-f]{3,8}|[a-z]+)|color\s*:\s*(?:#[0-9a-f]{3,8}|[a-z]+))$/i.test(s));
      data.attrValue = ok.join("; "); data.keepAttr = ok.length > 0;
    }
    if(data.attrName === "href" && !/^(?:https?:|mailto:|#|\/)/i.test(String(data.attrValue||""))) data.keepAttr = false;
  });
}
const fmtDate = (iso)=>{ const d=new Date(iso||""); return isNaN(d) ? String(iso||"").slice(0,16).replace("T"," ") : d.toLocaleString("sv-SE",{hour12:false}).slice(0,16); };   // 本地时间、到分钟（原来直接切 ISO 字符串 = UTC，差 8 小时）
const today = ()=>new Date().toLocaleDateString("sv-SE");
const clock = (d = new Date())=>{ const w = "日一二三四五六"[d.getDay()];   // 2026.10.4 周日 23:55
  return `${d.getFullYear()}.${d.getMonth()+1}.${d.getDate()} 周${w} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`; };

async function api(path, opts){
  // 两种调用约定都吃：api(path, {字段}) = POST JSON；api(path, {method,headers,body}) = 原样 fetch（lit 的邮箱代码是后者）
  let init = {};
  if(opts && (opts.method || opts.body || opts.headers)) init = {...opts};
  else if(opts) init = {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(opts)};
  const r = await fetch(path, init);
  const j = await r.json().catch(()=>({error:"响应不是 JSON"}));
  if(j && j.error) throw new Error(j.error);
  return j;
}

/* ============================== 路由 ============================== */
const NAV = [
  {g:"primary",items:[
    {id:"agent",label:"Agent",ico:"🤖"},
    {id:"assistants",label:"助手",ico:"🧑🔬"},
    {id:"team",label:"团队",ico:"👥"},
    {id:"calendar",label:"日历",ico:"📅"},
    {id:"tasks",label:"项目",ico:"📁"},
    {id:"space",label:"项目空间",ico:"🧭"}]},
  {g:"solo",items:[
    {id:"workflow",label:"工作流",ico:"🔀"},
    {id:"schedules",label:"定时任务",ico:"⏰"},
    {id:"library",label:"知识库",ico:"📚"},
    {id:"notes",label:"笔记",ico:"📝"},
    {id:"intel",label:"情报日报",ico:"📡"}]},
  {g:"solo",items:[{id:"mail",label:"邮箱",ico:"📧"}]},
  {g:"foot",items:[{id:"settings",label:"设置",ico:"⚙️"}]}
];
const TITLES = {assistants:"助手",team:"团队",agent:"Agent",calendar:"日历",tasks:"项目",workflow:"工作流",library:"知识库",notes:"笔记",intel:"情报日报",mail:"邮箱",models:"模型",schedules:"定时任务",space:"项目空间",settings:"设置"};
const route = ()=> tabs.find(t=>t.id===activeTab)?.route || "agent";

function openTab(r, title){
  const t = tabs.find(x=>x.route===r);
  if(t){ activeTab=t.id; render(); return; }          // ← 侧栏点了没反应就是这里之前没有 render()
  const id = "t"+(seq++); tabs.push({id,route:r,title:title||TITLES[r]||r}); activeTab=id;
  render();
}
function closeTab(id){
  const i = tabs.findIndex(t=>t.id===id); if(i<0) return;
  tabs.splice(i,1);
  if(!tabs.length) tabs=[{id:"agent",route:"agent",title:"Agent"}];
  if(activeTab===id) activeTab = tabs[Math.max(0,i-1)].id;
  render();
}

/* ============================== 外壳 ============================== */
let navResearchOpen = false;   // 「研究」分组已拆成三个平级入口，这个状态留着只是为了老 localStorage 不报错
let sidebarCollapsed = localStorage.getItem("rw-sidebar") === "true";

function renderSidebar(){
  const v = route();
  const item = (it,cls="")=>`<button class="nav-item ${v===it.id?"active":""} ${cls}" data-nav="${it.id}" title="${it.label}"><span class="nav-ico">${it.ico}</span><span class="lbl">${it.label}</span>${it.id==="mail"?`<span class="nav-badge hidden" id="navMailBadge">0</span>`:""}</button>`;
  const researchActive = NAV[1].items.some(i=>i.id===v);
  const open = navResearchOpen || researchActive;
  $("sidebar").className = "sidebar"+(sidebarCollapsed?" collapsed":"");
  $("sidebar").innerHTML = `
    <div class="brand"><div class="mark"><i></i><i></i><i></i></div>
      <div class="lbl" style="min-width:0"><b>科研工作</b><small>Research workspace</small></div>
      <button class="collapse" title="${sidebarCollapsed?"展开侧栏":"折叠侧栏"}">${sidebarCollapsed?"›":"‹"}</button></div>
    <div class="profile-card" id="profileCard" title="点击编辑个人资料">
      <span class="profile-avatar" id="profileAvatar">🎓</span>
      <div class="profile-info"><b id="profileName">研究生</b></div>
      <span class="profile-edit">✎</span></div>
    <nav class="nav">${NAV[0].items.map(i=>item(i)).join("")}
      ${NAV[1].items.map(i=>item(i)).join("")}${NAV[2].items.map(i=>item(i)).join("")}</nav>
    <div class="sidebar-foot">${item(NAV[NAV.length-1].items[0])}
      <div class="swatches" id="side-presets">${themeSwatches(true)}</div>
      <button class="nav-item" id="theme-toggle"><span class="nav-ico">${document.documentElement.dataset.theme==="dark"?"☀️":"🌙"}</span><span class="lbl">${document.documentElement.dataset.theme==="dark"?"浅色主题":"深色主题"}</span></button>
      <div class="online"><span class="dot"></span><span class="lbl">本地服务 已连接</span></div></div>`;
  $("sidebar").querySelectorAll("[data-nav]").forEach(b=>b.onclick=()=>openTab(b.dataset.nav));
  bindSwatches($("sidebar").querySelector("#side-presets"));
  $("sidebar").querySelector(".collapse").onclick=()=>{sidebarCollapsed=!sidebarCollapsed;localStorage.setItem("rw-sidebar",sidebarCollapsed);renderSidebar();};
  $("theme-toggle").onclick=()=>setTheme(document.documentElement.dataset.theme==="dark"?"light":"dark");
  // 个人资料卡片（点开填写页）
  $("profileCard").onclick = openProfileModal;
  $("btnProfClose").onclick = closeProfileModal;
  $("btnProfCancel").onclick = closeProfileModal;
  $("btnProfSave").onclick = saveProfileModal;
  document.querySelector("#profileModal .modal-mask").onclick = closeProfileModal;
  $("btnProfPhotoPick").onclick = ()=>$("profPhotoFile").click();
  $("profPhotoFile").onchange = (e)=>{
    const f = e.target.files && e.target.files[0];
    readAvatarFile(f, (url)=>setAvatarPhoto(url));       // 选完就立刻生效并落 localStorage
    e.target.value = "";
  };
  $("btnProfPhotoClear").onclick = ()=>setAvatarPhoto("");
  renderProfile();
}

// pw=1 = 跑在无边框自有窗口里（服务端加的标记），才需要自绘标题栏按钮
const FRAMELESS = new URLSearchParams(location.search).has("pw");
let winZoom = true;                    // 窗口现在是不是铺满工作区 → 决定右上那个键画「最大化」还是「还原」
let winStateAsked = false;
function renderTopbar(){
  $("topbar").innerHTML = `
    <span class="date">${clock()}</span>
    <span class="pill" title="当前模型">${S.active?("模型 "+esc(S.active.name)):"未配置模型"}</span>
    ${FRAMELESS?`<span class="wctl">
      <button title="最小化" data-w="minimize">\uE921</button>
      <button title="${winZoom?"还原":"最大化"}" data-w="maximize">${winZoom?"\uE923":"\uE922"}</button>
      <button class="close" title="关闭" data-w="close">\uE8BB</button>
    </span>`:""}`;
  $("topbar").querySelectorAll("[data-w]").forEach(b=>{
    b.onmousedown = e => e.stopPropagation();          // 别让标题栏拖动吃掉按钮
    b.onclick = () => api("/api/win/"+b.dataset.w, {}).then(r=>{
      if(r && typeof r.zoomed === "boolean") winSet(r.zoomed);
    }).catch(()=>{});
  });
  if(FRAMELESS && !winStateAsked){                     // 起来先问一次真实状态（还原回来可能不是铺满）
    winStateAsked = true;
    winRefresh();
  }
}
function winRefresh(){
  api("/api/win/state").then(r=>{
    if(r && typeof r.zoomed === "boolean") winSet(r.zoomed);
  }).catch(()=>{});
}
window.addEventListener("focus", ()=>{ if(FRAMELESS) winRefresh(); });   // 从任务栏还原回来时对齐一次
function winSet(zoom){
  if(zoom === winZoom) return;
  winZoom = zoom;
  renderTopbar();
}

function renderTabs(){
  $("tabsbar").innerHTML = tabs.map(t=>`<button class="tab ${t.id===activeTab?"active":""}" data-t="${t.id}">${esc(t.title)}${tabs.length>1?`<span class="x" data-x="${t.id}">✕</span>`:""}</button>`).join("")
    + `<button class="tab" id="newtab">＋</button>`;
  $("tabsbar").querySelectorAll("[data-t]").forEach(b=>b.onclick=(e)=>{
    if(e.target.dataset.x){ closeTab(e.target.dataset.x); } else { activeTab=b.dataset.t; }
    render();
  });
  $("newtab").onclick=()=>openTab("agent");
}

function renderStatus(){
  const t = S.tasks.find(x=>x.id===curTask);
  $("statusbar").innerHTML = `
    <span><span class="led"></span>本地服务 正常</span>
    <span><span class="led"></span>SQLite 正常</span>
    <span>模型 ${S.active?esc(S.active.name):"未配置"}</span>
    <span>工具 ${S.tools.length}</span>
    <span>当前项目 ${t?esc(t.title):"—"}</span>`;
}

/* ============================== 页面 ============================== */
function render(){
  renderSidebar(); renderTopbar(); renderTabs(); renderStatus();
  const r = route(); const m = $("main");
  if(!S.loaded) m.innerHTML = `<div class="muted">加载中…</div>`;
  else if(r==="agent") renderAgent(m);
  else if(r==="workflow") renderWorkflow(m);
  else if(r==="tasks") renderTasks(m);
  else if(r==="space") renderSpace(m);
  else if(r==="calendar") renderCalendar(m);
  else if(r==="mail") renderMail(m);
  else if(r==="library") renderLibrary(m);
  else if(r==="notes") renderNotes(m);
  else if(r==="intel") renderIntel(m);
  else if(r==="assistants") renderAssistants(m);
  else if(r==="team") renderTeam(m);
  else if(r==="schedules") renderSchedules(m);
  else if(r==="models") renderModels(m);
  else renderSettings(m);
}

function needTask(){
  if(!curTask) return `<div class="card"><h3>还没有选项目</h3><div class="hint">工作流、Agent、文献都挂在项目上。先去「项目」页建一个，或用右上角下拉选一个。</div><button class="btn" style="margin-top:10px" onclick="openTab('tasks')">去建项目</button></div>`;
  return "";
}


/* ---------------- 助手（照 AionUi AssistantSettings/home + editor ----------------
   我的助手 / 公开助手 两栏；点卡片进编辑器（身份 / 提示词 / 规则 / 默认模型）。
   公开助手只读，只能「复制为我的」——照 AionUi 的权限表。 ---------------- */
let asView = "mine";                       // mine | official | edit
let asEdit = { id:"", source:"user", name:"", avatar:"", description:"", rules:"", prompts:[], model_id:"" };

function asSource(a){ return a.source === "builtin" ? "official" : "mine"; }
function asOf(kind){ return (S.assistants||[]).filter(a=>asSource(a)===kind); }
function asCur(){ return (S.assistants||[]).find(a=>a.id===asEdit.id) || null; }
function asChat(){ return (S.chats||[]).find(c=>c.id===curChat) || null; }
function asBound(){ const c=asChat(); return c ? (c.assistant_id||"") : ""; }
function asAvatarOf(a, size){
  const px = size||42;
  return `<span class="as-av" style="width:${px}px;height:${px}px;font-size:${Math.round(px*0.55)}px">${esc(a&&a.avatar || "🤖")}</span>`;
}
function asCard(a){
  const on = a.enabled !== 0, mine = asSource(a)==="mine";
  return `<div class="as-card ${on?"":"off"}" data-as-open="${a.id}">
    <div class="as-card-top">${asAvatarOf(a)}<span class="as-dot ${on?"on":""}" title="${on?"已启用":"已停用"}"></span></div>
    <b>${esc(a.name)}</b>
    <i class="as-mdl">${a.model_id?("🔌 "+esc(modelName(a.model_id)||"（模型已删）")):"🔌 用当前激活模型"}</i>
    <p>${esc(a.description||"（没有描述）")}</p>
    <div class="as-card-foot">
      ${on?`<button class="btn ghost as-go" data-as-chat="${a.id}">用它对话</button>`:""}
      ${mine?`<button class="btn ghost" data-as-del="${a.id}" style="color:var(--err)">删除</button>`
            :`<button class="btn ghost" data-as-dup="${a.id}">复制为我的</button>`}
    </div></div>`;
}

/* ---------------- 团队（照 AionUi Teams：成员=助手实例、Leader 恒第一、身份色） ---------------- */
let teamScope = localStorage.getItem("rw-team-chat") || "";
let teamData = null, teamBusy = false, teamTick = null, teamList = null;
function tcColor(i){ const P=["var(--brand)","#5c9ea4","#b58a5e","#8f7fb5","#7fa06a","#b57f92"]; return P[(i||0)%P.length]; }
const modelName = (id)=>((S.models||[]).find(x=>x.id===id)||{}).name||"";
async function renderTeam(m){
  if(!teamList){ try{ teamList = await api("/api/teams"); }catch(e){ teamList = {teams:[], error:e.message}; } }
  const TL = (teamList.teams||[]);
  const curT = TL.find(t=>t.id===teamScope) || null;
  if(!curT){                                            // scope 不合法（老数据/被解散）→ 落到第一个固定团队
    const first = TL.find(t=>t.kind==="fixed") || TL[0] || null;
    teamScope = first ? first.id : "";
    if(teamScope) localStorage.setItem("rw-team-chat", teamScope); else localStorage.removeItem("rw-team-chat");
  }
  if(!teamScope){
    m.innerHTML = `<div class="page-head"><div><p class="inst-label">TEAM</p><h3>团队</h3>
      <p class="hint">正在开一个团队群…</p></div></div>`;
    try{ const r = await api("/api/chat/create", {title:"团队"}); teamScope = r.id || (r.chat&&r.chat.id) || "";
         localStorage.setItem("rw-team-chat", teamScope); await refreshState(false); }
    catch(e){ m.innerHTML = `<div class="page-head"><div><p class="inst-label">TEAM</p><h3>团队</h3>
      <p class="hint">开团队群失败：${esc(e.message)}</p></div></div>`; return; }
  }
  try{ teamData = await api("/api/team/chat?scope=" + encodeURIComponent(teamScope)); }
  catch(e){ teamData = {error:e.message, members:[], transcript:[]}; }
  const D = teamData || {}, all = D.members||[], leader = all.find(x=>x.role==="leader")||null;
  const ms = all.filter(x=>x.role!=="member"?false:true), picks = all.filter(x=>x.role==="member");
  const inTeam = new Set(picks.map(x=>x.assistant_id));
  const pool = (S.assistants||[]).filter(a=>a.enabled!==0 && !inTeam.has(a.id));
  const run = D.running;
  const tr = D.transcript||[];
  let lastUser = -1; tr.forEach((r,i)=>{ if(r.role==="user") lastUser = i; });
  const spoken = new Set(tr.slice(lastUser+1).map(r=>r.sender).filter(Boolean));   // 这一轮里已经说过话的成员
  let seq = 0;
  const bubble = (r)=>{
    const who = r.sender || (r.role==="user" ? "你" : "成员");
    const mm = picks.find(x=>x.name===who);
    const at = esc((r.at||"").replace("T"," ").slice(5,16));
    if(who==="系统") return `<div class="tc-sys"><span class="tc-av">!</span><div class="tc-body"><div class="tc-who"><b>系统</b><span class="tc-at">${at}</span></div><div class="tc-text">${esc(r.content||"")}</div></div></div>`;
    const mine = r.role==="user";
    const n = mine ? 0 : ++seq;
    return `<div class="tc-msg ${mine?"me":"them"}" style="--mc:${mine?"var(--accent)":tcColor(mm&&mm.color)}">
      <span class="tc-av">${mine?"🙋":esc((mm&&mm.name||"?").slice(0,1))}</span>
      <div class="tc-body"><div class="tc-who"><b>${esc(who)}</b>${n?`<span class="tc-idx">#${n}</span>`:""}<span class="tc-at">${at}</span></div>
        <div class="tc-text">${esc(r.content||"")}</div></div></div>`;
  };
  m.innerHTML = `<div class="tc-page">
  <div class="page-head">
    <div><p class="inst-label">TEAM</p><h3>${esc(curT?curT.name:"团队")} <span class="pill">${picks.length}/${D.max||5}</span>
      <span class="pill">${curT&&curT.kind==="temp"?"机动":"固定"}</span>${curT&&curT.status==="done"?'<span class="pill">已收工</span>':""}</h3>
      <p class="hint">最多 5 个团队：<b>2 个固定</b>（论文精读 / 论文写作，常驻）+ <b>3 个机动</b>（用完自动释放）。成员从「助手」里选（一个团队最多 ${D.max||5} 人，助手背后接的是哪个模型，就用那个模型说话）。你发一句，成员之间互相 @ 派活、一轮轮推进；谁说「完成」就散会。</p></div>
    <div class="ph-acts">${run?`<span class="pill">${esc(run.phase||"跑着")}</span><span class="pill">第 ${run.turn||0}/${run.total||6} 轮</span><button class="btn ghost" id="tcStop">停止</button>`:""}
      <button class="btn ghost" id="tcRefresh">刷新</button></div></div>
  <div class="tc-cols">
    <section class="tc-panel">
      <p class="tc-ct">团队</p>
      <div class="tc-cb">
        <div class="tc-teams">
          ${TL.map(x=>`<button class="tc-team ${x.id===teamScope?"on":""} ${x.status==="done"?"done":""}" data-tc-team="${x.id}" title="${x.kind==="fixed"?"固定团队":"机动团队"}">
            <span>${x.kind==="fixed"?"📌":"⏳"}</span><b>${esc(x.name)}</b><i>${x.picks||0}</i></button>`).join("")}
          ${(teamList.temp||0) < (teamList.max_temp||3) ? `<button class="tc-team add" id="tcNewTeam">＋ 机动团队</button>`
            : `<p class="hint" style="margin:4px 2px">机动位满了（用完会自动释放）</p>`}
        </div>
        <p class="tc-cnt">共 ${TL.length}/${teamList.max||5} 个团队（固定 ${teamList.fixed||0}/${teamList.max_fixed||2} · 机动 ${teamList.temp||0}/${teamList.max_temp||3}）</p>
        <div class="tc-row2">
          <button class="btn ghost" id="tcRename" title="改当前团队的名字">改名</button>
          ${curT&&curT.kind==="temp"?`<button class="btn ghost" id="tcDissolve" style="color:var(--err)" title="解散这个机动团队">解散</button>`:""}
        </div>
        <p class="tc-ct" style="padding:4px 3px 6px">成员 ${picks.length}/${D.max||5}</p>
        ${leader?`<div class="tc-chip" style="--mc:var(--brand)"><span class="tc-av">🧭</span><span class="tc-main"><b>${esc(leader.name)}</b><i>Leader · 主持派活</i></span></div>`:""}
        ${picks.map(x=>`<div class="tc-chip" style="--mc:${tcColor(x.color)}"><span class="tc-av">${esc((x.name||"?").slice(0,1))}</span>
          <span class="tc-main"><b>${esc(x.name)}</b><i>${esc((x.model?x.model+" · ":"")+(x.prompt?x.prompt.slice(0,8):"成员"))}</i></span>
          <button class="tc-x" data-tc-del="${x.id}" title="移出">✕</button></div>`).join("")}
        ${picks.length < (D.max||5) ? `<span class="tc-add"><select class="control" id="tcPick"><option value="">＋ 从助手里选…</option>
            ${pool.map(a=>`<option value="${a.id}">${esc(a.name)}${a.source==="builtin"?"（公开）":""}${a.model_id?" · "+esc(modelName(a.model_id)||"?"):" · 用当前激活模型"}</option>`).join("")}</select></span>`
          : `<p class="hint" style="margin:8px 3px">已满 ${D.max||5} 人</p>`}
        <p class="hint" style="margin:8px 3px 0">${picks.length?esc(picks.map(x=>x.name).join(" · ")):"还没有成员 —— 先从下面选几个助手进来。"}</p>
      </div>
    </section>
    <section class="tc-panel">
      <p class="tc-ct">团队群 · 接力记录</p>
      <div class="tc-tl" id="tcChat">
        ${tr.length ? tr.map(bubble).join("")
          : `<div class="tc-empty">🧭 团队群在这里。先选成员，然后说一句你要做的事 —— 比如「帮我挑一个钠电正极掺杂方向，产出候选表」。</div>`}
      </div>
      <div class="tc-composer">
        <textarea class="control" id="tcSay" rows="2" placeholder="跟团队说一句话…（Enter 发送，Shift+Enter 换行）"></textarea>
        <button class="btn" id="tcSend">${run?"继续追一句":"发送并让团队推进"}</button>
      </div>
      <p class="hint tc-foot">${run?`当前：${esc(run.current||"")}（第 ${run.turn||0}/${run.total||6} 轮）`:"没有在跑的轮次。"}</p>
    </section>
    <section class="tc-panel">
      <p class="tc-ct">本轮${run?` · 第 ${run.turn||0}/${run.total||6} 轮`:""}</p>
      <div class="tc-prog"><i style="width:${run&&run.total?Math.round((run.turn||0)/run.total*100):0}%"></i></div>
      <div class="tc-cb">
        ${picks.length?picks.map(x=>{ const now = !!(run&&run.current===x.name);
          return `<div class="tc-step ${now?"now":(spoken.has(x.name)?"":"idle")}"><span class="d"></span><b>${esc(x.name)}</b><em>${now?"在跑":(spoken.has(x.name)?"已说":"待命")}</em></div>`; }).join("")
          :`<p class="hint" style="margin:6px 3px">还没有成员。</p>`}
        <p class="tc-ct" style="padding:14px 3px 6px">本轮口径</p>
        <div class="tc-kv">状态：<b>${run?esc(run.phase||"跑着"):"没有在跑的轮次"}</b></div>
        <div class="tc-kv">当前：<b>${esc((run&&run.current)||"—")}</b></div>
        <div class="tc-kv">轮次：<b>${run?`${run.turn||0} / ${run.total||6}`:"—"}</b></div>
        <div class="tc-kv">成员：<b>${picks.length} / ${D.max||5}</b></div>
      </div>
    </section>
  </div></div>`;
  const box = $("tcChat"); if(box) box.scrollTop = box.scrollHeight;
  m.querySelectorAll("[data-tc-team]").forEach(b=>b.onclick = ()=>{
    if(b.dataset.tcTeam === teamScope) return;
    teamScope = b.dataset.tcTeam; localStorage.setItem("rw-team-chat", teamScope);
    teamData = null; render();
  });
  const nw = $("tcNewTeam");
  if(nw) nw.onclick = async ()=>{
    try{ const r = await api("/api/teams/new", {kind:"temp"}); teamList = null;
         teamScope = (r.team&&r.team.id)||teamScope; localStorage.setItem("rw-team-chat", teamScope); }
    catch(e){ alert("建机动团队失败：" + e.message); }
    teamData = null; render();
  };
  const rn = $("tcRename");
  if(rn) rn.onclick = async ()=>{
    const nm = prompt("团队名字：", curT?curT.name:"");
    if(!nm) return;
    try{ await api("/api/teams/rename", {id:teamScope, name:nm}); }catch(e){ return alert("改名失败：" + e.message); }
    teamList = null; teamData = null; render();
  };
  const ds = $("tcDissolve");
  if(ds) ds.onclick = async ()=>{
    if(!confirm("解散这个机动团队？（成员会释放，群记录仍留在库里）")) return;
    try{ await api("/api/teams/dissolve", {id:teamScope}); }catch(e){ return alert("解散失败：" + e.message); }
    teamList = null; teamScope = ""; teamData = null; render();
  };
  const pick = $("tcPick");
  if(pick) pick.onchange = async ()=>{
    if(!pick.value) return; teamBusy = true;
    try{ await api("/api/team/chat/member", {scope:teamScope, assistant_id:pick.value}); }
    catch(e){ alert("加成员失败：" + e.message); }
    teamBusy = false; teamData = null; render();
  };
  m.querySelectorAll("[data-tc-del]").forEach(b=>b.onclick = async ()=>{
    try{ await api("/api/team/chat/remove", {member_id:b.dataset.tcDel}); }catch(e){ alert(e.message); }
    teamData = null; render();
  });
  const st = $("tcStop");
  if(st) st.onclick = async ()=>{ try{ await api("/api/team/chat/stop", {scope:teamScope}); }catch(e){ alert(e.message); } setTimeout(()=>{ teamData=null; render(); }, 600); };
  const rf = $("tcRefresh"); if(rf) rf.onclick = ()=>{ teamData=null; render(); };
  const say = async ()=>{
    const t = $("tcSay"); const text = (t.value||"").trim();
    if(!text) return;
    if(!picks.length) return alert("先加成员：从「助手」里选几个进团队。");
    t.value = "";
    try{ await api("/api/team/chat/say", {scope:teamScope, text}); }
    catch(e){ return alert("发送失败：" + e.message); }
    teamData = null; render();
  };
  if($("tcSend")) $("tcSend").onclick = say;
  if($("tcSay")) $("tcSay").onkeydown = (e)=>{ if(e.key==="Enter" && !e.shiftKey){ e.preventDefault(); say(); } };
  clearTimeout(teamTick);                                   // 有轮次在跑就每 2s 刷新一次群
  if(run) teamTick = setTimeout(()=>{ if(route()==="team"){ teamData=null; render(); } }, 2000);
}
function renderAssistants(m){

  if(asView === "edit"){
    const a = asCur(), ro = asEdit.source === "builtin";
    m.innerHTML = `<div class="page-head">
      <div><p class="inst-label">ASSISTANT</p><h3>${a?"编辑助手":"新建助手"}</h3>
        <p class="hint">${ro?"公开助手的内容只读 —— 点「复制为我的」就能改成你自己的。":"提示词和规则会在这个助手发起的对话里生效（进 system）。"}</p></div>
      <div class="ph-acts"><button class="btn" id="as-back">← 返回</button>
        ${a&&!ro?`<button class="btn ghost" id="as-del" style="color:var(--err)">删除</button>`:""}</div></div>
    <div class="card" style="margin-top:12px">
      <p class="inst-label">身份</p>

        <label class="field"><span>名字</span><input class="control" id="as-name" ${ro?"disabled":""} value="${esc(asEdit.name)}" placeholder="如：文献检索员"></label>

        <label class="field"><span>描述</span><input class="control" id="as-desc" ${ro?"disabled":""} value="${esc(asEdit.description)}" placeholder="一句话说明它是干什么的"></label>
        <label class="field"><span>默认模型（可留空 = 用当前模型）</span>
          <select class="control" id="as-model" ${ro?"disabled":""}>
            <option value="">跟随当前模型</option>
            ${(S.models||[]).map(mm=>`<option value="${mm.id}" ${mm.id===asEdit.model_id?"selected":""}>${esc(mm.name)}</option>`).join("")}</select></label>
      </div></div>
    <div class="card" style="margin-top:12px">
      <p class="inst-label">提示词 / 推荐问题（一行一条，空状态会显示成按钮）</p>
      <textarea class="control" id="as-prompts" rows="4" ${ro?"readonly":""} placeholder="检索 O3 型钠电正极近三年掺杂改性的论文">${esc((asEdit.prompts||[]).join("\n"))}</textarea>

    if(dupBtn) dupBtn.onclick = ()=> duplicateAssistant(a);
    const delBtn = $("as-del");
    if(delBtn) delBtn.onclick = ()=> deleteAssistant(a.id, a.name);
    const saveBtn = $("as-save");

async function duplicateAssistant(a){
  if(!a) return;
  const r = await api("/api/assistant/save", { name: a.name + "（我的）", avatar: a.avatar, description: a.description,
    rules: a.rules, prompts: JSON.parse(a.prompts||"[]"), model_id: a.model_id||"" });
  await refreshState(false);
  asEdit = { id:r.assistant.id, source:"user", name:r.assistant.name, avatar:r.assistant.avatar,
             description:r.assistant.description, rules:r.assistant.rules, prompts:JSON.parse(r.assistant.prompts||"[]"), model_id:r.assistant.model_id||"" };
  asView = "mine"; render();          // 落回列表：新卡片就在那儿，改它点卡片进去
}
async function deleteAssistant(id, name){
  const a = (S.assistants||[]).find(x=>x.id===id);
  if(a && a.source === "builtin") return alert("公开助手不能删除 —— 可以「复制为我的」再改。");
  if(!confirm(`删除助手「${name}」？（已经用它的对话不受影响）`)) return;
  try{ await api("/api/assistant/delete", {id}); }catch(e){ return alert("删除失败：" + e.message); }
  await refreshState(false); asView = "mine"; render();
}
async function useAssistant(id){                       // 用它对话：绑到当前对话（没有就新建一个），切到 Agent 页
  let cid = curChat;
  if(!cid){ const r = await api("/api/chat/create", {}); cid = r.id || (r.chat && r.chat.id); }
  try{ await api("/api/chat/assistant", {id: cid, assistant_id: id}); }catch(e){ return alert("绑定失败：" + e.message); }
  curChat = cid; localStorage.setItem("rw-chat", cid);
  await refreshState(false); openTab("agent");
}

function historyGroups(pool){
  const g = {"今天":[],"昨天":[],"更早":[]};
  const list = pool || S.chats || [];
  for(const t of list){
    const d = new Date(t.updated_at || t.created_at || ""); const n = new Date();
    const dist = Math.floor((Date.UTC(n.getFullYear(),n.getMonth(),n.getDate()) - Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()))/86400000);
    (isNaN(dist) ? g["更早"] : g[dist<=0?"今天":dist===1?"昨天":"更早"]).push(t);
  }
  return g;
}
function projName(id){ return ((S.tasks||[]).find(x=>x.id===id)||{}).title || ""; }
let ahFilter = localStorage.getItem("rw-ah-filter") || "all";     // all | free | proj

  const all = (S.chats||[]).filter(c=>ahFilter==="free" ? !c.task_id : ahFilter==="proj" ? !!c.task_id : true);

}

      ${list || `<p class="hint" style="margin:14px 5px">${ahFilter==="proj"?"还没有绑定项目的对话 —— 在输入条上用「🧭 绑定项目」新建一个。":ahFilter==="free"?"还没有随意对话，点右上角 ＋ 新建。":"还没有对话，点右上角 ＋ 新建。"}</p>`}</div>

async function loadChat(){
  try{
    const {messages} = await api(`/api/chat?id=${encodeURIComponent(curChat)}`);
    S.chat = messages || [];
    S.chatEvents = S.chat.flatMap(m=> m.events || []);
    const tb = document.querySelector('[data-v="trajectory"]');
    if(tb) tb.textContent = `轨迹 ${S.chatEvents.length}`;
    const box=$("msgs"); if(!box) return;
    if(agentView==="trajectory"){ renderTrajectory(box); }
    else if(!S.chat.length){
      box.innerHTML = asEmpty(); bindChips();
    } else {
      box.innerHTML="";
      S.chat.forEach(m=>appendOne(box,{type:m.role,content:m.content,events:m.events,replay:true,at:m.created_at}));
    }
    box.scrollTop = box.scrollHeight;
    loadAgentMeta();

function appendOne(box,ev){

  }
  else if(ev.type==="error"){ el.className="msg-err"; el.textContent="⚠ "+(ev.message||"出错了"); }
  else if(ev.type==="tool_call"){

  }
  else if(ev.type==="tool_result"){
    const cards=box.querySelectorAll(".tool-card");
    const card=cards.length?cards[cards.length-1]:null;
    if(card){
      if(!ev.ok) card.classList.add("bad");
      const d=card.querySelector(".tool-detail"); if(d) d.textContent=ev.summary||"";
      const u=card.querySelector(".tool-dur"); if(u) u.textContent=ev.ok?"完成":"失败";

function setAtts(){

async function addFiles(files){
  if(!files || !files.length) return;
  for(const f of files){
    if(!curTask && /\.pdf$/i.test(f.name)){ alert("先选或建一个项目 —— PDF 要入当前项目的文献库，Agent 才读得到"); return; }
    try{
      const r = await fetch(`/api/upload?name=${encodeURIComponent(f.name)}&task_id=${encodeURIComponent(curTask||"")}`,
                            {method:"POST", headers:{"Content-Type":"application/octet-stream"}, body:f});
      const a = await r.json(); if(a.error) throw new Error(a.error);
      atts.push(a);
    }catch(e){ alert("附加失败："+e.message); }
  }
  setAtts();
}

function pick(mode){
  const mm=$("attmenu"); if(mm) mm.style.display="none";
  if(mode==="url"){
    const u = prompt("要附加的链接（http / https）：");
    if(!u) return;
    if(!/^https?:\/\//i.test(u)) return alert("只认 http / https 链接");
    atts.push({name:u.replace(/^https?:\/\//i,"").slice(0,60), url:u, size:0}); setAtts(); return;
  }
  if(mode==="paste") return void pasteImage();
  const inp=$("filepick"); if(!inp) return;
  inp.accept = mode==="images" ? "image/*" : "";
  if(mode==="folder") inp.setAttribute("webkitdirectory",""); else inp.removeAttribute("webkitdirectory");
  inp.click();
}

async function pasteImage(){
  try{
    const items = await navigator.clipboard.read(); const blobs = [];
    for(const it of items) for(const t of it.types) if(t.startsWith("image/"))
      blobs.push(new File([await it.getType(t)], `粘贴图片.${t.split("/")[1]}`, {type:t}));
    if(!blobs.length) return alert("剪贴板里没有图片");
    await addFiles(blobs);
  }catch(e){ alert("拿不到剪贴板（浏览器没放权），直接在输入框里 Ctrl+V 粘贴图片即可"); }
}

function wireDrop(el){                            // 照 use-composer-drop：进出计数 + dropEffect=copy
  if(!el) return;
  let depth = 0;
  const has = (dt)=> !!dt && Array.from(dt.types||[]).includes("Files");
  el.ondragenter = (e)=>{ if(!has(e.dataTransfer)) return; e.preventDefault(); depth++; el.classList.add("drop-on"); };
  el.ondragover  = (e)=>{ if(!has(e.dataTransfer)) return; e.preventDefault(); e.dataTransfer.dropEffect="copy"; };
  el.ondragleave = (e)=>{ if(!has(e.dataTransfer)) return; e.preventDefault(); depth=Math.max(0,depth-1); if(!depth) el.classList.remove("drop-on"); };
  el.ondrop      = (e)=>{ if(!has(e.dataTransfer)) return; e.preventDefault(); depth=0; el.classList.remove("drop-on"); addFiles([...e.dataTransfer.files]); };
}

/* 量高度用隐藏镜像那个 textarea（Hermes 同款做法）：直接读真实框的 scrollHeight 会把
   占位提示的折行也算进去，空框就涨成好几行。镜像只放真正的内容，宽度跟真实框对齐。 */
const TA_MIN = 42, TA_MAX = 200;                 // 单行高度跟着 .composer textarea 的 padding/行高走
let taMirror = null;
function measureAsk(ta){
  if(!taMirror){
    taMirror = document.createElement("textarea");
    taMirror.className = "ta-mirror"; taMirror.setAttribute("aria-hidden","true");
    taMirror.rows = 1;                             // 不给 rows，空值时按默认 2 行算
    document.body.appendChild(taMirror);
  }
  const cs = getComputedStyle(ta);
  taMirror.style.width = ta.clientWidth + "px";
  taMirror.style.font = cs.font;
  taMirror.style.lineHeight = cs.lineHeight;
  taMirror.style.padding = cs.padding;
  taMirror.style.letterSpacing = cs.letterSpacing;
  taMirror.style.whiteSpace = "pre-wrap";
  taMirror.style.wordBreak = cs.wordBreak;
  taMirror.value = ta.value;
  taMirror.style.height = "auto";
  return taMirror.scrollHeight;
}

function grow(){                                  // 一行起步，真换行了才长高
  const ta=$("ask"); if(!ta) return;
  ta.style.height = Math.min(TA_MAX, Math.max(TA_MIN, measureAsk(ta))) + "px";
}
addEventListener("resize", ()=>{ if($("ask")) grow(); });

document.addEventListener("click",(e)=>{          // 点菜单外面收起（监听只注册一次）

async function send(){
  const ta=$("ask"); const text=ta.value.trim(); if(!text && !atts.length) return;
  if(!curChat) return alert("先新建一个对话（左上角 ＋）");
  const msg = atts.length ? (text?text+"\n\n":"") + "[附件]\n" + atts.map(a=> a.url ? `- ${a.url}`
      : `- ${a.name}${a.paper_id?`（已入库 PDF，paper_id=${a.paper_id}，${a.pages} 页）`:`（本地文件：${a.path}）`}`).join("\n") : text;
  ta.value=""; grow(); atts.length=0; setAtts();
  const box=$("msgs"); if(box.querySelector(".muted")) box.innerHTML="";
  appendOne(box,{type:"user",content:msg});
  const btn=$("send"); btn.disabled=true; btn.classList.add("stop"); btn.textContent="■";
  let errMsg="";
  try{
    const res = await fetch("/api/agent",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({task_id:curChat,message:msg})});
    if(!res.ok || !res.body) throw new Error("HTTP "+res.status);
    const reader=res.body.getReader(); const dec=new TextDecoder(); let buf="";
    for(;;){
      const {value,done}=await reader.read(); if(done) break;
      buf+=dec.decode(value,{stream:true});
      let i;
      while((i=buf.indexOf("\n\n"))>=0){
        const chunk=buf.slice(0,i); buf=buf.slice(i+2);
        const line=chunk.split("\n").find(l=>l.startsWith("data: ")); if(!line) continue;
        let ev; try{ ev=JSON.parse(line.slice(6)); }catch{ continue; }
        if(ev.type!=="done") appendOne(box,ev);
        stEvent(ev);
      }
    }
  }catch(e){ errMsg = e.message; appendOne(box,{type:"error",message:e.message}); }
  btn.disabled=false; btn.classList.remove("stop"); btn.textContent="↑";
  await refreshState(false); loadChat();
  if(errMsg) appendOne(box,{type:"error",message:errMsg});   // loadChat 重渲染会把报错行刷掉，补回去
}

const ST_KEEP = 40;                                  // 滚动窗口里最多留多少条

function stReset(){ Object.assign(st,{turns:0,calls:0,tokBase:0,tok:0,tools:[],outs:[]}); }
function loadAgentMeta(){                            // 从已存的对话里回放

  st.turns = (S.chat||[]).filter(m=>m.role==="user").length;
  st.calls = evs.filter(e=>e.type==="tool_call").length;
  st.tokBase = evs.filter(e=>e.type==="usage").reduce((n,e)=>n+(e.total||0),0);
  st.tools = evs.filter(e=>e.type==="tool_call").map(e=>e.name);
  st.outs = evs.filter(e=>e.type==="tool_result"&&e.path).map(e=>({t:e.path,k:"dir"}));
  const room = curChatRow();
  if(room && (room.out_dir||"").trim()) st.outs.unshift({t:room.out_dir, k:"dir"});   // 目录常驻第一行
  if(room){                                            // 首次提问后标题会变，顺手同步抬头
    const h=$("at-title"), s=$("at-sub");
    if(h) h.textContent = room.title;

  }
  stPaint();
}
function stEvent(ev){                                // SSE 过程中实时刷新
  if(!ev || ev.type==="done") return;
  if(ev.type==="user") st.turns++;
  else if(ev.type==="usage") st.tok += ev.total || 0;   // 事件里是每次回包的用量，可累加
  else if(ev.type==="tool_call"){ st.calls++; st.tools.push(ev.name); }
  else if(ev.type==="tool_result"){ if(ev.path) st.outs.push({t:ev.path,k:"dir"}); }
  else return;
  stPaint();
}

/* ---------- 左边那份文件 ---------- */
async function docShowCite(k){
  /* 左边切成「后台引用台账」（只读）：位置 + 文献信息，随正文改动自动对锚点 */
  const st = docState(k), body = docEl(k, "body"), btn = docEl(k, "cite");
  try{
    const d = await api(`/api/doc/cite?id=${encodeURIComponent(curTask)}`);
    st.showCite = true;
    if(btn) btn.classList.add("active");
    body.innerHTML = renderMarkdown(d.markdown || "（还没有引用记录）");
    docMsg(k, `引用台账 ${d.count} 条${d.stale ? `（${d.stale} 条锚句在正文里找不到了）` : ""} · ${d.path || ""}`);
  }catch(e){ docMsg(k, "读台账失败：" + e.message); }
}
function docMsg(k, t){ const el = docEl(k, "meta"); if(el) el.textContent = t || ""; }
function docShow(k, d){
  const st = docState(k); if(!d) return;
  st.path = d.path || ""; st.exists = !!d.exists;
  const f = docEl(k, "file");
  if(f){ f.textContent = st.path ? st.path.split(/[\\/]/).pop() : "（未命名）"; f.title = st.path; }
  const md = d.markdown || "";
  st.showCite = false;
  const cb = docEl(k, "cite"); if(cb) cb.classList.remove("active");
  const body = docEl(k, "body");
  const ta = docEl(k, "src"); if(ta) ta.value = md;
  if(body){
    body.innerHTML = md.trim() ? renderMarkdown(md)
      : `<div class="ol-empty">${DOC_UI[k].empty[1]} 还没有内容。<br>右边跟 agent 说一句，或点上面「${DOC_UI[k].seed || "让 agent 写"}」。</div>`;
    if(DOC_UI[k].hl) docPaintMarks(k);                    // 标注按文本重新贴回去
  }
  const mb = docEl(k, "meta"); if(mb) mb.textContent = md.trim() ? `${d.sections || 0} 个大标题 · ${d.subs || 0} 个小标题 · ${d.chars || 0} 字` : "";
}
async function docLoad(k){
  const st = docState(k);
  try{
    const d = await api(`/api/doc/state?id=${encodeURIComponent(curTask)}&step=${encodeURIComponent(k)}`);
    st.msgs = d.messages || []; st.out = d.out || "";
    st.events = st.msgs.flatMap(x => x.events || []);
    st.stat = { turns: st.msgs.filter(x => x.role === "user").length,
                calls: st.events.filter(e => e.type === "tool_call").length,
                tok: st.events.filter(e => e.type === "usage").reduce((n, e) => n + (e.total || 0), 0) };
    docShow(k, d);
    if(!st.files) st.files = JSON.parse(localStorage.getItem("rw-marks-" + k + "-" + (curTask || "")) || "[]");
    docPaintMarks(k); docMarks(k);
  }catch(e){ docMsg(k, "读取失败：" + e.message); }
  docPaint(k); docStats(k);
}
function docEdit(k, on){
  docEl(k, "body").classList.toggle("hidden", on);
  docEl(k, "src").classList.toggle("hidden", !on);
  docEl(k, "edit").classList.toggle("hidden", on);
  docEl(k, "edit-save").classList.toggle("hidden", !on);
  if(on) docEl(k, "src").focus();
}
async function docSaveEdit(k){
  try{ docEdit(k, false); docShow(k, await api("/api/doc/save", { task_id: curTask, step: k, markdown: docEl(k, "src").value }));
       docMsg(k, "已保存到 " + docState(k).path); }
  catch(e){ docMsg(k, "保存失败：" + e.message); }
}
function docCandidate(text){
  /* 从一条回复里抠出「像成稿」的那段：优先 ``` 代码块，否则从第一个标题行截到结尾（至少 2 个标题）。 */
  if(!text) return "";
  const fence = String(text).match(/```(?:markdown|md|text)?\s*\n([\s\S]*?)```/);
  const body = fence ? fence[1] : String(text);
  const m = body.search(/^#{1,3}\s+\S/m);
  if(m < 0) return "";
  const cut = body.slice(m).trim();
  return (/^##\s+\S/m.test(cut) && (cut.match(/^#{2,3}\s+/gm) || []).length >= 2) ? cut : "";
}
function docShowCand(k){
  const b = docEl(k, "pull"); if(!b) return;
  const srcEl = docEl(k, "src"); const cur = (srcEl ? srcEl.value : "").trim();
  b.classList.toggle("hidden", !docState(k).cand || docState(k).cand === cur);
}

/* ---------- 荧光笔（审查那一步） ---------- */
function docMarksSave(k){
  const st = docState(k);
  try{ localStorage.setItem("rw-marks-" + k + "-" + (curTask || ""), JSON.stringify(st.marks)); }catch(_){}
}
function docPaintMarks(k){
  const st = docState(k), body = docEl(k, "body"); if(!body || !st.marks.length) return;
  st.marks.forEach(m => {                                   // 按文本把标注贴回去（正文没改就能对上）
    const walk = document.createTreeWalker(body, NodeFilter.SHOW_TEXT);
    let n;
    while((n = walk.nextNode())){
      const i = n.nodeValue.indexOf(m.t);
      if(i < 0 || n.parentElement.closest("mark.dw-hl")) continue;
      const r = document.createRange(); r.setStart(n, i); r.setEnd(n, i + m.t.length);
      const mk = document.createElement("mark"); mk.className = "dw-hl"; mk.style.background = m.c || "#FFE066";
      mk.title = "点一下取消这处标注";
      try{ r.surroundContents(mk); }catch(_){ continue; }
      mk.onclick = ()=>{ st.marks = st.marks.filter(x => x.t !== m.t); docPaintMarks(k); docMarks(k); docMarksSave(k); };
      break;
    }
  });
}
function docMarks(k){
  const st = docState(k), n = docEl(k, "marks-n"), host = docEl(k, "marks-l");
  if(n) n.textContent = `标注 ${st.marks.length} 处`;
  if(host) host.innerHTML = st.marks.map((m, i) =>
    `<span class="att"><b>${esc(m.t.slice(0, 46))}${m.t.length > 46 ? "…" : ""}</b><span class="x" data-rm="${i}" title="移除">✕</span></span>`).join("")
    || `<span class="ol-empty" style="font-size:12px">还没标 —— 打开 🖍 荧光笔，在左边拖选要改的文字</span>`;
  if(host) host.querySelectorAll("[data-rm]").forEach(x => x.onclick = ()=>{
    st.marks.splice(+x.dataset.rm, 1); docPaintMarks(k); docMarks(k); docMarksSave(k); });
}
function docPen(k, on){
  const st = docState(k), p = docEl(k, "penpanel"), btn = docEl(k, "pen");
  const show = on === undefined ? p.classList.contains("hidden") : !!on;
  p.classList.toggle("hidden", !show);
  st.pen = show;
  btn?.classList.toggle("active", show);
  document.body.classList.toggle("dw-pen-on", show);
  if(show) docMsg(k, "拖选左边文字 → 就标上了；点标注可取消");
}
function docPenColors(k, host){
  const st = docState(k);
  host.innerHTML = ["#FFE066", "#8BD498", "#7FC4F0", "#F0A9C0", "#F07C7C"]
    .map(c => `<i data-c="${c}" class="${c === st.color ? "on" : ""}" style="background:${c}"></i>`).join("");
  host.onclick = (e)=>{ const i = e.target.closest("i[data-c]"); if(!i) return;
    st.color = i.dataset.c; docPenColors(k, host); };
}
function docPenUp(k){
  const st = docState(k);
  if(!st.pen) return;
  const sel = window.getSelection();
  const t = (sel ? sel.toString() : "").trim();
  if(t.length < 2) return;
  const body = docEl(k, "body");
  if(!body.contains(sel.anchorNode)) return;
  const r = sel.getRangeAt(0);
  const mk = document.createElement("mark"); mk.className = "dw-hl"; mk.style.background = st.color;
  mk.title = "点一下取消这处标注";
  try{ r.surroundContents(mk); }catch(_){ return; }
  mk.onclick = ()=>{ st.marks = st.marks.filter(x => x.t !== t); docPaintMarks(k); docMarks(k); docMarksSave(k); };
  if(!st.marks.some(x => x.t === t)) st.marks.push({ t, c: st.color });
  sel.removeAllRanges(); docMarks(k); docMarksSave(k);
  docMsg(k, `已标 ${st.marks.length} 处 —— 标完点「把标注发给 agent」`);
}

/* ---------- 右边对话 ---------- */
function docBind(k, m){
  if(!docEl(k, "msgs")) return;
  m.querySelectorAll("[data-dv]").forEach(b => b.onclick = ()=>{
    const [kk, v] = b.dataset.dv.split("|"); docState(kk).view = v; docPaint(kk); });
  docEl(k, "send").onclick = () => docSend(k);
  docEl(k, "ask").onkeydown = (e)=>{ if(e.key === "Enter" && !e.shiftKey){ e.preventDefault(); docSend(k); } };
  docEl(k, "ask").oninput = () => docGrow(k);
  docEl(k, "plus").onclick = () => docEl(k, "filepick").click();
  docEl(k, "filepick").onchange = (e)=>{ const fs = [...e.target.files]; e.target.value = ""; docAddFiles(k, fs); };
  docEl(k, "modpick").onchange = async (e)=>{ if(!e.target.value) return;
    await api("/api/models/active", { id: e.target.value }); await refreshState(false); render(); };
  docEl(k, "assist").oninput = (e)=>localStorage.setItem("rw-assist", e.target.value.trim() || "researcher");
  if(DOC_UI[k].seed) docEl(k, "seed").onclick = async ()=>{ try{ docShow(k, await api("/api/doc/seed", { task_id: curTask, step: k }));
    docMsg(k, k === "write" ? "已按框架搭好骨架（标题层级照抄框架）" : "已按模板起稿"); }catch(e){ docMsg(k, "起稿失败：" + e.message); } };
  if(docEl(k, "pull")) docEl(k, "pull").onclick = async ()=>{
    const st = docState(k); if(!st.cand) return;
    try{ const r = await api("/api/doc/save", { task_id: curTask, step: k, markdown: st.cand });
         st.cand = ""; docShow(k, r); docShowCand(k); docMsg(k, `已用这条回复更新（${r.chars || 0} 字）`); }
    catch(e){ docMsg(k, "写入失败：" + e.message); }
  };
  if(DOC_UI[k].cite) docEl(k, "cite").onclick = ()=>{
    if(docState(k).showCite) docLoad(k); else docShowCite(k); };
  if(docEl(k, "reload")) docEl(k, "reload").onclick = ()=>docLoad(k);
  if(docEl(k, "edit")) docEl(k, "edit").onclick = ()=>docEdit(k, true);
  if(docEl(k, "edit-save")) docEl(k, "edit-save").onclick = ()=>docSaveEdit(k);
  if(DOC_UI[k].hl){
    docEl(k, "pen").onclick = ()=>docPen(k);
    docEl(k, "penpanel").querySelector(".dw-x").onclick = ()=>docPen(k, false);
    docPenColors(k, docEl(k, "colors"));
    docEl(k, "marks-send").onclick = ()=>{
      const st = docState(k);
      if(!st.marks.length) return docMsg(k, "还没标任何地方");
      const lines = st.marks.map((m, i) => `${i + 1}. ${m.t}`).join("\n");
      docEl(k, "ask").value = `我要改这几处细节，请逐条给建议（要改就直接更新正文）：\n[我的标注]\n${lines}`;
      docSend(k);
    };
    docEl(k, "marks-clear").onclick = ()=>{ const st = docState(k); st.marks = []; docPaintMarks(k); docMarks(k); docMarksSave(k); };
    if(!window.__docHlBound){        // 全局只挂一次；**事件发生时才取当前步骤**（闭包住 k 会在别的步骤失效）
      window.__docHlBound = 1;
      document.addEventListener("mouseup", (e)=>{
        const cur = wfStep;
        if(!DOC_UI[cur] || !DOC_UI[cur].hl) return;
        if(docEl(cur, "body")?.contains(e.target)) docPenUp(cur);
      });
    }
  }
  wireDrop(docEl(k, "composer")); docSetAtts(k); docGrow(k); docLoad(k);
}
function docPaint(k){
  const st = docState(k), box = docEl(k, "msgs"); if(!box) return;
  document.querySelectorAll("[data-dv]").forEach(b => b.classList.toggle("on", b.dataset.dv === `${k}|${st.view}`));
  if(st.view === "trajectory"){ renderTrajectory(box, st.events); return; }
  const c = DOC_UI[k];
  if(!st.msgs.length){ box.innerHTML = emptyState(c.empty[0], c.empty[1], c.empty[2]); return; }
  box.innerHTML = "";
  st.msgs.forEach(mv => appendOne(box, { type: mv.role, content: mv.content, events: mv.events, replay: true, at: mv.created_at }));
  box.scrollTop = box.scrollHeight;
}
function docStats(k){
  const st = docState(k);
  const t = docEl(k, "turns"), c = docEl(k, "calls"), tk = docEl(k, "tok"), tn = docEl(k, "trail-n");
  if(t) t.textContent = st.stat.turns;
  if(c) c.textContent = st.stat.calls;
  if(tk) tk.textContent = (st.stat.tok || 0).toLocaleString();
  if(tn) tn.textContent = st.stat.calls;
  const log = (id, rows, empty)=>{ const el = docEl(k, id); if(!el) return;
    el.innerHTML = rows.length ? rows.map(r => `<div title="${esc(r)}">${esc(r)}</div>`).join("")
                               : `<div class="none">${esc(empty)}</div>`;
    el.scrollTop = el.scrollHeight; };
  log("tools", st.events.filter(e => e.type === "tool_call").map(e => e.name).slice(-40), "还没有工具调用");
  const outs = [st.out].filter(Boolean).concat(st.events.filter(e => e.type === "tool_result" && e.path).map(e => e.path));
  log("outs", outs.slice(-40), "还没有产出");
}
function docSetAtts(k){
  const st = docState(k), host = docEl(k, "atts"); if(!host) return;
  host.innerHTML = st.atts.map((a, i) => `<span class="att"><b>${esc(a.name)}</b><span>${a.url ? "链接" : a.paper_id ? "已入库 " + a.pages + " 页" : fmtSize(a.size)}</span><span class="x" data-rm="${i}" title="移除">✕</span></span>`).join("");
  host.querySelectorAll("[data-rm]").forEach(x => x.onclick = ()=>{ st.atts.splice(+x.dataset.rm, 1); docSetAtts(k); });
}
async function docAddFiles(k, files){
  const st = docState(k);
  if(!files || !files.length) return;
  for(const f of files){
    if(!curTask && /\.pdf$/i.test(f.name)){ alert("先选或建一个项目 —— PDF 要入当前项目的文献库，agent 才读得到"); return; }
    try{
      const r = await fetch(`/api/upload?name=${encodeURIComponent(f.name)}&task_id=${encodeURIComponent(curTask || "")}`,
                            { method: "POST", headers: { "Content-Type": "application/octet-stream" }, body: f });
      const a = await r.json(); if(a.error) throw new Error(a.error);
      st.atts.push(a);
    }catch(e){ alert("附加失败：" + e.message); }
  }
  docSetAtts(k);
}
function docGrow(k){
  const ta = docEl(k, "ask"); if(!ta) return;
  ta.style.height = Math.min(TA_MAX, Math.max(TA_MIN, measureAsk(ta))) + "px";
}
async function docSend(k){
  const st = docState(k);
  const ta = docEl(k, "ask"); const text = ta.value.trim();
  if(!text && !st.atts.length) return;
  const msg = st.atts.length ? (text ? text + "\n\n" : "") + "[附件]\n" + st.atts.map(a => a.url ? `- ${a.url}`
      : `- ${a.name}${a.paper_id ? `（已入库 PDF，paper_id=${a.paper_id}，${a.pages} 页）` : `（本地文件：${a.path}）`}`).join("\n") : text;
  ta.value = ""; docGrow(k); st.atts.length = 0; docSetAtts(k);
  const box = docEl(k, "msgs");
  if(st.view !== "conversation"){ st.view = "conversation"; docPaint(k); }
  if(box.querySelector(".at-empty")) box.innerHTML = "";
  appendOne(box, { type: "user", content: msg });
  st.msgs.push({ role: "user", content: msg, events: [] }); st.stat.turns++; docStats(k);
  const btn = docEl(k, "send"); btn.disabled = true; btn.textContent = "■";
  let errMsg = "", final = "", evs = [];
  try{
    const res = await fetch(DOC_UI[k].post, { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ task_id: curTask, message: msg }) });
    if(!res.ok || !res.body) throw new Error("HTTP " + res.status);
    const reader = res.body.getReader(); const dec = new TextDecoder(); let buf = "";
    for(;;){
      const { value, done } = await reader.read(); if(done) break;
      buf += dec.decode(value, { stream: true });
      let i;
      while((i = buf.indexOf("\n\n")) >= 0){
        const chunk = buf.slice(0, i); buf = buf.slice(i + 2);
        const line = chunk.split("\n").find(l => l.startsWith("data: ")); if(!line) continue;
        let ev; try{ ev = JSON.parse(line.slice(6)); }catch{ continue; }
        if(ev.type === "done"){ final = ev.content || ""; continue; }
        appendOne(box, ev); evs.push(ev);
        if(ev.type === "usage") st.stat.tok += ev.total || 0;
        else if(ev.type === "tool_call") st.stat.calls++;
        docStats(k);
      }
    }
  }catch(e){ errMsg = e.message; appendOne(box, { type: "error", message: e.message }); }
  st.msgs.push({ role: "assistant", content: final, events: evs });
  st.events = st.events.concat(evs);
  const wrote = evs.some(e => e.type === "tool_call" && (e.name === "doc_write" || e.name === "outline_write" || e.name === "map_write"));
  st.cand = wrote ? "" : docCandidate(final);            // 模型没调工具就把回复里那段收着，给个一键落盘
  btn.disabled = false; btn.textContent = "↑";
  box.scrollTop = box.scrollHeight;
  await docLoad(k);                                      // 重拉：文件可能刚被 doc_write 改过 → 左边跟着更新
  if(k === "map") await mpLoad();                          // 谱系图：聊天改完立刻重画画布
  docShowCand(k);
  if(!wrote && !st.cand) docMsg(k, `这轮没有改${DOC_UI[k].file} —— 说「更新${DOC_UI[k].file}」或让它「写进文件」`);
  if(errMsg) appendOne(box, { type: "error", message: errMsg });
  await refreshState(false);
}

  $("en-run").onclick = enRun;

  $("en-reload").onclick = () => { $("en-in").value = ""; $("en-out").value = ""; enLoad(); };
  $("en-copy").onclick = async () => {
    try{ await navigator.clipboard.writeText($("en-out").value || ""); enMsg("已复制", 2500); }
    catch(_){ $("en-out").select(); document.execCommand("copy"); enMsg("已复制", 2500); }
  };
  const host = $("panel-entrans");                       // 拖进来
  let depth = 0;
  ["dragenter", "dragover"].forEach(t => host.addEventListener(t, (e) => {
    e.preventDefault(); e.stopPropagation(); if(t === "dragenter") depth++; host.classList.add("dragging"); }));
  ["dragleave", "drop"].forEach(t => host.addEventListener(t, (e) => {
    e.preventDefault(); e.stopPropagation();
    if(t === "drop"){ depth = 0; host.classList.remove("dragging");
      const f = (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0]) || null; enReadLocal(f); }
    else if(--depth <= 0){ depth = 0; host.classList.remove("dragging"); } }));
  enLoad();
}

  try{
    const res=await fetch("/api/idea",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({task_id:curTask, message:msg})});
    if(!res.ok || !res.body) throw new Error("HTTP "+res.status);
    const reader=res.body.getReader(); const dec=new TextDecoder(); let buf="";
    for(;;){
      const {value,done}=await reader.read(); if(done) break;
      buf+=dec.decode(value,{stream:true});
      let i;
      while((i=buf.indexOf("\n\n"))>=0){
        const chunk=buf.slice(0,i); buf=buf.slice(i+2);
        const line=chunk.split("\n").find(l=>l.startsWith("data: ")); if(!line) continue;
        let ev; try{ ev=JSON.parse(line.slice(6)); }catch{ continue; }
        if(ev.type==="done"){ final=ev.content||""; continue; }
        appendOne(box,ev); evs.push(ev);
        if(ev.type==="usage") iwStat.tok += ev.total||0;
        else if(ev.type==="tool_call") iwStat.calls++;
        iwPaintStats();
      }
    }
  }catch(e){ errMsg = e.message; appendOne(box,{type:"error",message:e.message}); }
  iwMsgs.push({role:"assistant",content:final,events:evs});
  iwEvents = iwEvents.concat(evs);
  btn.disabled=false; btn.textContent="↑";
  box.scrollTop = box.scrollHeight;
  iwLoad();                       // 重新拉一次：工具可能写了长期记忆 / 新笔记
  if(errMsg) appendOne(box,{type:"error",message:errMsg});   // 重渲染会把报错行刷掉，补回去
  await refreshState(false);
}

const WS_LABEL = {openalex:"OpenAlex",crossref:"Crossref",arxiv:"arXiv",pubmed:"PubMed"};

const wsYears = ()=> [...new Set((wsRes||[]).map(r=>r.year).filter(Boolean))].sort((a,b)=>String(b).localeCompare(String(a)));
function wsFiltered(){
  let list = (wsRes||[]).slice();
  if(wsYFrom!=="all" || wsYTo!=="all"){                     // 起止年份（含端点；年份未知的不算在内）
    let f = wsYFrom==="all" ? 0 : Number(wsYFrom), t = wsYTo==="all" ? 9999 : Number(wsYTo);
    if(f>t){ const tmp=f; f=t; t=tmp; }
    list = list.filter(r=>{ const y=Number(r.year); return y && y>=f && y<=t; });
  }
  if(wsText.trim()){ const q=wsText.trim().toLowerCase();
    list = list.filter(r=> ((r.title||"")+" "+(r.authors||"")).toLowerCase().includes(q)); }
  if(wsSort==="year-desc") list.sort((a,b)=>String(b.year||"").localeCompare(String(a.year||"")));
  else if(wsSort==="year-asc") list.sort((a,b)=>String(a.year||"9999").localeCompare(String(b.year||"9999")));
  else if(wsSort==="title") list.sort((a,b)=>String(a.title||"").localeCompare(String(b.title||""),"zh"));
  return list;
}

let dlReadBusy = false, dlReadTick = null;
async function dlRead(){                       // 后台精读：起完就返回；进度靠轮询；按钮再点一次=停
  if(!curTask) return;

    try{ await api("/api/deepread/stop",{task_id:curTask}); btn.textContent = "正在停…（当前这篇读完就停）"; }
    catch(e){ alert("停止失败：" + e.message); }
    return;
  }
  try{
    const r = await api("/api/workflow/deepread",{task_id:curTask});
    if(!r.started){ alert(r.reason || "这个项目已经在精读了"); return; }
    dlReadBusy = true; btn.classList.add("stop"); btn.textContent = "停止精读";
    dlReadTick = setInterval(dlReadPoll, 2000);
  }catch(err){ alert("精读失败：" + err.message); }

async function dlReadPoll(){
  try{
    const st = await api("/api/deepread/status?task_id=" + encodeURIComponent(curTask));
    if(!st || !st.phase) return;
    const tip = $("dlTip"), b2 = $("dlRead");
    const head = "精读 " + st.done + "/" + (st.total || "?") + " 篇" + (st.failed ? "（失败 " + st.failed + "）" : "")
               + ((st.skipped && st.skipped.length) ? " · 跳过非论文 " + st.skipped.length : "");
    if(tip) tip.textContent = st.phase === "running" ? head + " · 正在读 " + (st.current || "") : head;
    if(st.phase === "running") return;
    clearInterval(dlReadTick); dlReadTick = null; dlReadBusy = false;
    if(b2){
      b2.classList.remove("stop");
      b2.textContent = st.phase === "done" ? "精读完了（去看笔记）" : (st.phase === "stopped" ? "已停止" : "精读失败");
      setTimeout(()=>{ const b3 = $("dlRead"); if(b3 && !dlReadBusy) b3.textContent = "一键精读"; }, 5000);
    }
    if(st.phase === "failed" && st.error) alert("精读失败：" + st.error);
  }catch(e){ /* 轮询失败就等下一次 */ }
}

/* ---------------- 日历：版式/类名照 lit（app.js 的 calendarDateInfo/renderCalendar/renderCalDayEvents + index.html 的 home-mid/home-bottom），只多了年/月下拉 ---------------- */
let calY = new Date().getFullYear(), calM = new Date().getMonth();   // calM 0-11
let calSel = today();                                                // 选中的日子（左边点哪天，右边就显示哪天）
let calPrefs = {lunar:true, solarTerms:true, festivals:true};         // 「历法」弹窗里那三个开关
const CAL_TYPES = {mine:{color:"var(--accent)",label:"日程"},festival:{color:"#c2415d",label:"节日"},solarTerm:{color:"#27845f",label:"节气"}};
const pad2 = n => String(n).padStart(2,"0");
const dkey = (y,m,d) => `${y}-${pad2(m+1)}-${pad2(d)}`;
const hhmm = t => String(t||"").replace("T"," ").slice(5,16);

function calendarDateInfo(dateKey){
  if(!window.Solar || !/^\d{4}-\d{2}-\d{2}$/.test(dateKey)) return {label:"",events:[]};
  try{
    const [y,mo,d] = dateKey.split("-").map(Number);
    const solar = window.Solar.fromYmd(y,mo,d), lunar = solar.getLunar();
    const term = calPrefs.solarTerms ? lunar.getJieQi() : "";
    const festivals = calPrefs.festivals ? [...solar.getFestivals(), ...lunar.getFestivals()].filter(Boolean) : [];
    let lunarLabel = "";
    if(calPrefs.lunar) lunarLabel = lunar.getDay() === 1 ? `${lunar.getMonthInChinese()}月` : lunar.getDayInChinese();
    return {label: term || festivals[0] || lunarLabel,
      events: [...(term?[{type:"solarTerm",label:term,computed:true}]:[]), ...[...new Set(festivals)].map(label=>({type:"festival",label,computed:true}))]};
  }catch(_){ return {label:"",events:[]}; }
}
function calEventsByDate(){
  const map = {};
  for(const e of S.events) (map[e.date] = map[e.date] || []).push({type:"mine",label:e.title,id:e.id,done:e.done});
  return map;
}
function renderCalendar(m){
  const y = calY, mo = calM, t0 = today();
  const lead = (new Date(y,mo,1).getDay()+6)%7;                       // 周一=0
  const daysIn = new Date(y,mo+1,0).getDate(), prevDays = new Date(y,mo,0).getDate();
  const cells = [];
  for(let i=lead-1;i>=0;i--) cells.push({d:prevDays-i,out:true,off:-1});
  for(let d=1;d<=daysIn;d++) cells.push({d,out:false,off:0});
  const trail = (7-(cells.length%7))%7;
  for(let d=1;d<=trail;d++) cells.push({d,out:true,off:1});
  const events = calEventsByDate();
  const grid = cells.map(c=>{
    const mm = mo+c.off, yy = y+Math.floor(mm/12), nm = ((mm%12)+12)%12;
    const key = dkey(yy,nm,c.d);
    const info = calendarDateInfo(key);
    const evs = [...(events[key]||[]), ...info.events];
    const dots = evs.slice(0,3).map(e=>`<i class="cal-dot" style="background:${CAL_TYPES[e.type].color}"></i>`).join("");
    const more = evs.length>3 ? `<i class="cal-more">+${evs.length-3}</i>` : "";
    const cls = ["cal-cell", c.out?"out":"", key===t0?"today":"", key===calSel?"selected":""].filter(Boolean).join(" ");
    return `<div class="${cls}" data-date="${key}" title="${esc(evs.map(e=>e.label).join("；"))}"><span class="cal-num">${c.d}</span>${info.label?`<span class="cal-lunar">${esc(info.label)}</span>`:""}<span class="cal-dots">${dots}${more}</span></div>`;
  }).join("");
  const selEvs = [...(events[calSel]||[]), ...calendarDateInfo(calSel).events];
  const dayItems = S.events.filter(e=>e.date===calSel).sort((a,b)=>(a.done||0)-(b.done||0));
  const now = new Date();
  const yearOpts = Array.from({length:11},(_,i)=>now.getFullYear()-5+i).map(v=>`<option value="${v}" ${v===y?"selected":""}>${v}</option>`).join("");
  const monthOpts = Array.from({length:12},(_,i)=>`<option value="${i}" ${i===mo?"selected":""}>${i+1}月</option>`).join("");
  const doneEvs = S.events.filter(e=>e.done).sort((a,b)=>String(b.created_at||"").localeCompare(String(a.created_at||""))).slice(0,30);
  const soon = S.events.filter(e=>!e.done && e.date>=t0).sort((a,b)=>a.date.localeCompare(b.date));
  const DAY = 86400000, base = new Date(t0+"T00:00:00").getTime();

  m.innerHTML = `<div class="cal-page">
    <div class="cal-mid">
      <div class="cal-left">
      <div class="card cal-hello">
        <span class="hello-avatar" id="calHelloAvatar">${avatarInner()}</span><b id="calHelloText">${helloText()}</b></div>
      <div class="card">
        <div class="card-head"><b>📅 科研日历</b>
          <div class="cal-nav">
            <button class="cal-nav-btn" id="calOptions" title="历法显示设置">历法</button>
            <button class="cal-nav-btn" id="calPrev" title="上个月">‹</button>
            <select id="calY" title="选择年份">${yearOpts}</select>
            <select id="calM" title="选择月份">${monthOpts}</select>
            <button class="cal-nav-btn" id="calNext" title="下个月">›</button>
            <button class="cal-nav-btn cal-today-btn" id="calToday">今天</button>
          </div>
          <div id="calOptionsPop" class="cal-pop hidden">
            <label><input type="checkbox" data-cal-pref="lunar" ${calPrefs.lunar?"checked":""}> 显示农历日期</label>
            <label><input type="checkbox" data-cal-pref="solarTerms" ${calPrefs.solarTerms?"checked":""}> 显示二十四节气</label>
            <label><input type="checkbox" data-cal-pref="festivals" ${calPrefs.festivals?"checked":""}> 显示传统与公历节日</label>
            <p>节日不代表法定放假或调休安排。</p>
          </div>
        </div>
        <div class="cal-week"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span class="cal-we">六</span><span class="cal-we">日</span></div>
        <div class="cal-grid">${grid}</div>
        <div class="cal-day-events"><div class="cal-day-head">📆 ${calSel===t0?"今天 · ":""}${calSel}<span class="side-count">${selEvs.length} 项</span></div></div>
      </div>
      </div>

      <div class="card">
        <div class="card-head"><b>☀ 当日工作计划</b><span class="side-count">${calSel}</span></div>
        <div class="check-list">${dayItems.length ? dayItems.map(e=>`<div class="check-item ${e.done?"done":""}"><input type="checkbox" data-chk="${e.id}" ${e.done?"checked":""}><span class="check-title">${esc(e.title)}</span><span class="check-due">${hhmm(e.created_at)}</span><button class="check-del" data-del="${e.id}" title="删除">✕</button></div>`).join("")
          : `<div class="hint">这一天还没有安排 🎉🎉🎉</div>`}</div>
        <div class="quick-add"><input id="todayInput" class="tb-input" placeholder="＋ 添加任务，回车确认…"><button class="btn" id="btnTodayAdd">添加</button></div>
      </div>
    </div>

    <div class="cal-bottom">
      <div class="card">
        <div class="card-head"><b>📡 任务完成情况</b><span class="side-count">自动生成</span></div>
        <div class="feed-list">${doneEvs.length ? doneEvs.map(e=>`<div class="feed-item"><span class="feed-ico">✅</span><span class="feed-text">完成任务 [${esc(e.title)}]</span><span class="feed-time">${hhmm(e.created_at)}</span></div>`).join("")
          : `<div class="hint">还没有完成的任务</div>`}</div>
      </div>
      <div class="card">
        <div class="card-head"><b>⏳ 倒计时</b><span class="side-count">${soon.length} 项未完成</span></div>
        <div class="countdown-list">${soon.length ? soon.map(e=>{
            const d = Math.round((new Date(e.date+"T00:00:00").getTime()-base)/DAY);
            return `<div class="countdown-item"><span class="countdown-days ${d<=3?"urgent":""}">${d===0?"今天":d+"天"}</span><span class="countdown-label">${esc(e.title)}</span><span class="side-count">${e.date.slice(5)}</span></div>`;
          }).join("") : `<div class="hint">没有未完成的重要节点</div>`}</div>
      </div>
    </div>
  </div>`;

  $("calY").onchange = e=>{ calY = +e.target.value; render(); };
  $("calM").onchange = e=>{ calM = +e.target.value; render(); };
  $("calPrev").onclick = ()=>{ if(--calM<0){calM=11;calY--;} render(); };
  $("calNext").onclick = ()=>{ if(++calM>11){calM=0;calY++;} render(); };
  $("calToday").onclick = ()=>{ const n=new Date(); calY=n.getFullYear(); calM=n.getMonth(); calSel=today(); render(); };
  $("calOptions").onclick = ()=>$("calOptionsPop").classList.toggle("hidden");
  m.querySelectorAll("[data-cal-pref]").forEach(i=>i.onchange=()=>{ calPrefs[i.dataset.calPref]=i.checked; render(); });
  m.querySelectorAll(".cal-cell").forEach(c=>c.onclick=()=>{ const k=c.dataset.date; if(k===calSel) return; calSel=k; const n=new Date(k+"T00:00:00"); calY=n.getFullYear(); calM=n.getMonth(); render(); });
  m.querySelectorAll("[data-chk]").forEach(i=>i.onchange=async()=>{ await api("/api/calendar/toggle",{id:i.dataset.chk,done:i.checked}); await refreshState(); });
  m.querySelectorAll("[data-del]").forEach(b=>b.onclick=async(ev)=>{ ev.stopPropagation(); if(!confirm("删除这一条？")) return; await api("/api/calendar/delete",{id:b.dataset.del}); await refreshState(); });
  const add = async()=>{ const v=$("todayInput").value.trim(); if(!v) return;
    await api("/api/calendar/add",{title:v,date:calSel,task_id:curTask||null,kind:"todo"});
    $("todayInput").value=""; await refreshState(); };
  $("btnTodayAdd").onclick = add;
  $("todayInput").onkeydown = e=>{ if(e.key==="Enter"){ e.preventDefault(); add(); } };
}

  // 应用内新邮件浮层（可点击跳转）
  function showMailNotification(acc, msg) {
    const stack = $('mailNotifStack');
    if (!stack) return;
    const el2 = document.createElement('div');
    el2.className = 'mail-notif';
    el2.innerHTML = `
      <div class="mail-notif-ico">📬</div>
      <div class="mail-notif-body">
        <div class="mail-notif-title">新邮件 · ${esc(acc.label || acc.email)}</div>
        <div class="mail-notif-subject">${esc(String(msg.subject || '(无主题)').slice(0, 80))}</div>
        <div class="mail-notif-from">${esc(msg.fromName || msg.fromAddress || '未知发件人')}</div>
      </div>
      <button class="mail-notif-close" title="关闭">✕</button>`;
    const close = () => { el2.classList.add('out'); setTimeout(() => el2.remove(), 220); };
    el2.querySelector('.mail-notif-close').addEventListener('click', (e) => { e.stopPropagation(); close(); });
    // 点击浮层：切到邮箱视图并打开这封邮件
    el2.addEventListener('click', async () => {
      close();
      try {
        openTab("mail");
        await selectMailAccount(acc.id);
        if (mailCur.folder !== 'INBOX') await openMailFolder(acc.id, 'INBOX', '收件箱');
        await openMailMessage(msg.uid);
      } catch (e) { toast('打开邮件失败：' + e.message, 'error'); }
    });
    stack.appendChild(el2);
    // 12 秒后自动收起（点击/关闭不受影响）
    setTimeout(close, 12000);
  }

  // 系统级桌面通知（Electron / 浏览器原生）
  function showDesktopNotification(acc, msg) {
    try {
      if (typeof Notification === 'undefined') return;
      if (Notification.permission !== 'granted') return;
      const n = new Notification('📬 新邮件 · ' + (acc.label || acc.email), {
        body: `${msg.fromName || msg.fromAddress || '未知发件人'}\n${msg.subject || '(无主题)'}`,
        tag: `mail-${acc.id}-${msg.uid}`,
      });
      n.onclick = () => { try { window.focus(); } catch (_) {} n.close(); };
    } catch (_) { /* 通知失败不影响功能 */ }
  }

  function requestNotifyPermission() {
    try {
      if (typeof Notification === 'undefined') return;
      if (Notification.permission === 'default') Notification.requestPermission().catch(() => {});
    } catch (_) { /* ignore */ }
  }

  // 单轮轮询
  async function checkNewMail() {
    if (mailNotifyBusy || !mailNotifyEnabled) return;
    mailNotifyBusy = true;
    try {
      const since = readMailSince();
      const data = await api('/api/mail/notify?since=' + encodeURIComponent(JSON.stringify(since)));
      renderNavMailBadge(data.totalUnread || 0);

      const nextSince = { ...since };
      let changed = false;
      for (const a of data.accounts || []) {
        if (a.error) continue;
        const prev = parseInt(since[a.id], 10);
        const hadBaseline = Number.isFinite(prev);
        // 推进基线到当前最大 uid
        if (!hadBaseline || (a.newestUid || 0) > prev) { nextSince[a.id] = a.newestUid || 0; changed = true; }
        if (!hadBaseline) continue; // 首次不提醒历史邮件
        for (const m of a.fresh || []) {
          const key = a.id + ':' + m.uid;
          if (notifiedUids.has(key)) continue;
          notifiedUids.add(key);
          showMailNotification(a, m);
          showDesktopNotification(a, m);
        }
      }
      if (changed) writeMailSince(nextSince);
    } catch (_) {
      // 网络/离线/账户报错时静默，下一轮再试
    } finally {
      mailNotifyBusy = false;
    }
  }

  function startMailNotify() {
    if (mailNotifyTimer) return;
    requestNotifyPermission();
    checkNewMail();
    mailNotifyTimer = setInterval(checkNewMail, NOTIFY_INTERVAL);
  }
  function stopMailNotify() {
    if (mailNotifyTimer) { clearInterval(mailNotifyTimer); mailNotifyTimer = null; }
  }
  // 调试/自动化钩子：便于手动触发一轮检查或临时改间隔
  window.__mailNotifyTick = () => checkNewMail();
  window.__mailNotifySetInterval = (ms) => {
    stopMailNotify();
    mailNotifyTimer = setInterval(checkNewMail, Math.max(3000, parseInt(ms, 10) || NOTIFY_INTERVAL));
  };
  // 调试/自动化钩子：直接打开某篇文献的 PDF 阅读器、切换右侧页签、读取当前模型
  window.__openReader = (id) => openPdfReader(id);
  window.__setPrTab = (t) => switchPrTab(t);
  window.__activeModel = () => ({
    activeProfileId, active: activeModelInfo,
    profiles: profiles.map((p) => ({ id: p.id, label: p.label, provider: p.provider, model: p.model })),
  });

  function fmtMailDate(iso) {
    if (!iso) return '';
    const d = new Date(iso);
    if (Number.isNaN(d.getTime())) return '';
    const now = new Date();
    const pad = (n) => String(n).padStart(2, '0');
    if (d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth() && d.getDate() === now.getDate()) {
      return `${pad(d.getHours())}:${pad(d.getMinutes())}`;
    }
    if (d.getFullYear() === now.getFullYear()) return `${d.getMonth() + 1}月${d.getDate()}日`;
    return `${d.getFullYear()}/${d.getMonth() + 1}/${d.getDate()}`;
  }
  function fmtMailFullDate(iso) {
    if (!iso) return '';
    const d = new Date(iso);
    if (Number.isNaN(d.getTime())) return '';
    const pad = (n) => String(n).padStart(2, '0');
    return `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日 ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }
  function fmtMailSize(n) {
    const b = Number(n) || 0;
    if (b < 1024) return b + ' B';
    if (b < 1024 * 1024) return (b / 1024).toFixed(0) + ' KB';
    return (b / 1024 / 1024).toFixed(1) + ' MB';
  }

  // 邮件 HTML 正文：注入基础样式（自适应宽度 / 图片不溢出 / 字体统一），并清理未替换的内嵌图片引用
  function mailFrameDoc(html) {
    let s = String(html || '');
    s = s.replace(/(src|href)\s*=\s*(["'])cid:[^"']*\2/gi, '$1=$2data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7$2');
    const inject = `<base target="_blank">
<style>
html, body { margin: 0; padding: 12px 16px; font-size: 14px; line-height: 1.75; word-break: break-word;
  font-family: "Times New Roman", "Microsoft YaHei", "PingFang SC", sans-serif; color: #17231f; background: #fff; }
img { max-width: 100%; height: auto; }
table { max-width: 100% !important; }
pre { white-space: pre-wrap; }
a { color: #176b87; }
</style>`;
    if (/<head[^>]*>/i.test(s)) return s.replace(/<head[^>]*>/i, (m) => m + inject);
    if (/<html[^>]*>/i.test(s)) return s.replace(/<html[^>]*>/i, (m) => m + inject);
    return inject + s;
  }

        ? `<iframe class="mail-frame" sandbox="allow-same-origin allow-popups allow-popups-to-escape-sandbox" srcdoc="${esc(mailFrameDoc(d.html))}"></iframe>`
