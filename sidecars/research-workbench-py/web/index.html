<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>科研工作 1.0</title>
<script>
/* 标题带上构建戳：启动器靠它认出「哪扇窗是这一版」（app 窗口的 --app 复用不可靠） */
document.title = "科研工作 1.0 · v" + (new URLSearchParams(location.search).get("v") || "dev");
</script>
<style>
/* 主题色由 JS 从「主色」推导（抄 zotero-lit-tool 的 deriveTheme），这里只留两档明暗底 */
:root[data-theme=dark]{--bg:#0b0f14;--panel:#111821;--panel2:#0e141b;--line:#1e2833;--fg:#e6edf5;--muted:#8b9bb0;--ok:#4ade80;--warn:#fbbf24;--err:#f87171;--shadow:0 8px 30px rgba(0,0,0,.45);--accent:#2dd4bf;--accent-ink:#04211f;--side-bg:#0e141b}
:root[data-theme=light]{--bg:#f6f8fa;--panel:#ffffff;--panel2:#f1f4f8;--line:#dfe5ec;--fg:#16202b;--muted:#5d6b7c;--ok:#159a5a;--warn:#b07d00;--err:#c04040;--shadow:0 8px 24px rgba(16,32,52,.10);--accent:#176b87;--accent-ink:#ffffff;--side-bg:#f1f4f8}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:var(--app-font-size,14px)/1.55 "Segoe UI","Microsoft YaHei",system-ui,sans-serif;background:var(--bg);color:var(--fg);overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:var(--line);border-radius:6px}

.app-shell{display:flex;height:100vh}
.sidebar{width:232px;flex:none;background:var(--side-bg,var(--panel2));border-right:1px solid var(--line);display:flex;flex-direction:column}
.sidebar.collapsed{width:64px}
.sidebar.collapsed .lbl,.sidebar.collapsed .sidebar-group-children,.sidebar.collapsed .swatches{display:none}
.brand{display:flex;align-items:center;gap:10px;padding:12px 12px 10px}
.mark{display:flex;gap:3px;align-items:flex-end;height:22px}
.mark i{width:4px;border-radius:2px;background:var(--accent);display:block}
.mark i:nth-child(1){height:10px;opacity:.6}.mark i:nth-child(2){height:16px;opacity:.85}.mark i:nth-child(3){height:22px}
.brand b{font-size:16px;font-weight:700;display:block;line-height:1.15}
.brand small{color:var(--muted);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase}
.as-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;margin-top:12px}
.as-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;cursor:pointer;transition:border-color .18s,transform .18s}
.as-card:hover{border-color:var(--accent)}
.as-card.off{opacity:.55}
.as-card-top{display:flex;align-items:flex-start;justify-content:space-between}
.as-card b{display:block;margin-top:12px;font-size:14px;font-weight:600;color:var(--text)}
.as-card p{margin:6px 0 0;font-size:12px;line-height:1.5;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.9em}
.as-card-foot{margin-top:14px;display:flex;align-items:center;gap:8px}
.as-card-foot .as-go{opacity:0;transition:opacity .18s}
.as-card:hover .as-card-foot .as-go{opacity:1}
.as-av{display:inline-flex;align-items:center;justify-content:center;border-radius:12px;background:var(--panel2);border:1px solid var(--line)}
.as-dot{width:8px;height:8px;border-radius:50%;background:var(--line);flex:none;margin-top:4px}
.as-dot.on{background:var(--accent)}
.as-form{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;margin-top:8px}
.as-form .field{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.as-card + .as-card{}

/* 个人资料卡片（照 lit 侧栏卡片，只显示头像 + 用户名） */
.profile-card{display:flex;align-items:center;gap:10px;margin:8px 10px 4px;padding:9px 11px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;cursor:pointer;transition:background .15s}
.profile-card:hover{background:color-mix(in srgb,var(--accent) 12%,transparent)}
.profile-avatar{display:flex;width:36px;height:36px;flex:none;align-items:center;justify-content:center;border-radius:50%;background:var(--panel);border:1px solid var(--line);font-size:19px}
.profile-info{display:flex;min-width:0;flex:1;flex-direction:column}
.profile-info b{overflow:hidden;font-size:14px;text-overflow:ellipsis;white-space:nowrap}
.profile-edit{color:var(--muted);font-size:12px}
.sidebar.collapsed .profile-card{justify-content:center;padding:9px 0}
.sidebar.collapsed .profile-info,.sidebar.collapsed .profile-edit{display:none}
.collapse{margin-left:auto;background:none;border:1px solid var(--line);border-radius:6px;width:24px;height:24px;color:var(--muted);cursor:pointer}
.nav{padding:4px 8px;overflow:auto;flex:1}
.nav-item{display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:8px 10px;border:0;border-radius:8px;background:none;cursor:pointer;color:var(--fg);margin-bottom:2px}
.nav-item:hover{background:color-mix(in srgb,var(--accent) 12%,transparent)}
.nav-item.active{background:color-mix(in srgb,var(--accent) 20%,transparent);box-shadow:inset 2px 0 0 var(--accent);font-weight:600}
.nav-ico{width:20px;flex:none;text-align:center;font-size:15px;line-height:1;font-family:"Segoe UI Emoji","Segoe UI Symbol",var(--app-font,inherit)}
.sidebar-group{margin-top:6px}
.sidebar-group>.nav-item{color:var(--muted);font-size:12.5px}
.chev{margin-left:auto;transition:transform .15s}
.chev.open{transform:rotate(180deg)}
.sidebar-foot{border-top:1px solid var(--line);padding:8px}
.online{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);padding:6px 10px}
.dot{width:6px;height:6px;border-radius:50%;background:var(--ok)}

.content{flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{height:46px;flex:none;display:flex;align-items:center;gap:10px;padding:0 12px;border-bottom:1px solid var(--line);background:var(--panel)}
.topbar .date{color:var(--muted);font-size:14px}
/* 无边框窗口（pywebview）自绘标题栏按钮：右上角三个，样式照 Windows 原生。Edge --app 下不渲染 */
.topbar{-webkit-user-select:none;user-select:none}
.wctl{margin-left:auto;align-self:stretch;display:flex;margin-right:-12px}
.wctl button{width:45px;padding:0;border:0;background:none;color:var(--fg);cursor:default;font-family:"Segoe Fluent Icons","Segoe MDL2 Assets";font-size:10px;line-height:1;display:flex;align-items:center;justify-content:center}
.wctl button:hover{background:var(--panel2)}
.wctl button.close:hover{background:#c42b1c;color:#fff}
.topbar .pill{font-size:14px;font-weight:400;padding:4px 10px}   /* 模型胶囊与「选择项目」同为 14px/400 */
.control{background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:5px 8px;outline:none}
kbd{border:1px solid var(--line);border-radius:5px;padding:1px 5px;font-size:10.5px;color:var(--muted)}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:7px;padding:6px 11px;cursor:pointer;font-weight:600}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.btn:disabled{opacity:.45;cursor:not-allowed}

.tabsbar{height:36px;flex:none;display:flex;align-items:center;gap:4px;padding:0 8px;border-bottom:1px solid var(--line);background:var(--panel2);overflow-x:auto}
.tab{display:flex;align-items:center;gap:6px;padding:5px 10px;border:1px solid transparent;border-radius:7px;background:none;color:var(--muted);cursor:pointer;white-space:nowrap}
.tab.active{background:var(--panel);border-color:var(--line);color:var(--fg)}
.tab .x{opacity:.55;font-size:12px}
.tab .x:hover{opacity:1;color:var(--err)}

.body{flex:1;min-height:0;display:flex}
.main{flex:1;min-width:0;overflow:auto;padding:16px}
.statusbar{height:26px;flex:none;display:flex;align-items:center;gap:16px;padding:0 12px;border-top:1px solid var(--line);background:var(--panel);color:var(--muted);font-size:11px}
.led{width:6px;height:6px;border-radius:50%;background:var(--ok);display:inline-block;margin-right:5px}

.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
.card h3{margin:0 0 8px;font-size:15px}
.muted{color:var(--muted)}
.hint{color:var(--muted);font-size:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
input[type=text],input[type=date],input[type=password],select,textarea{background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:6px 8px;width:100%;outline:none}
textarea{resize:vertical;min-height:64px}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{text-align:left;padding:6px 7px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:11.5px}
.pill{display:inline-block;padding:1px 7px;border-radius:999px;border:1px solid var(--line);font-size:11px;color:var(--muted)}
.pill.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 45%,transparent)}
.pill.err{color:var(--err);border-color:color-mix(in srgb,var(--err) 45%,transparent)}
.pill.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,transparent)}
.chip .x{margin-left:6px;opacity:.6}
.chip .x:hover{opacity:1;color:var(--err)}
.card.prov{border-left:3px solid color-mix(in srgb,var(--accent) 55%,transparent)}
.card.prov.on{border-left-color:var(--ok);background:color-mix(in srgb,var(--ok) 5%,var(--panel))}
.chip.dflt{color:var(--fg);border-color:color-mix(in srgb,var(--accent) 45%,transparent)}
.cand{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
details.mods{margin-top:8px;border-top:1px dashed var(--line);padding-top:6px}
details.mods>summary{cursor:pointer;font-size:12px;color:var(--muted);list-style:none;display:flex;align-items:center;gap:6px}
details.mods>summary::-webkit-details-marker{display:none}
details.mods>summary::before{content:"▸";display:inline-block;transition:transform .12s}
details.mods[open]>summary::before{transform:rotate(90deg)}
details.mods>summary:hover{color:var(--fg)}
details.mods>summary b{color:var(--fg);font-weight:600}
/* ==== Agent 页（结构/版式照科研工作台 features/agent：对话历史 | 对话主线）==== */
.agent{flex:1;min-width:0;height:100%;min-height:0;display:grid;grid-template-columns:236px minmax(0,1fr);border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel)}
.eyebrow{margin:0;color:var(--accent);font-size:9px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
/* 左：对话历史 */
.ah{display:flex;min-width:0;min-height:0;flex-direction:column;border-right:1px solid var(--line);background:color-mix(in srgb,var(--panel) 88%,var(--bg))}
.ah-head{display:flex;min-height:68px;align-items:center;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);padding:12px 14px}
.ah-head h2{margin:2px 0 0;font-size:16px;font-weight:750}
.ah-new{display:grid;width:30px;height:30px;place-items:center;cursor:pointer;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--muted);font-size:15px}
.ah-new:hover{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent);color:var(--fg)}

.ah-list{min-height:0;flex:1;overflow-y:auto;padding:8px}
.ah-filter{display:flex;gap:5px;padding:0 3px 7px}
.ah-fbtn{flex:1;background:transparent;border:1px solid var(--line);border-radius:7px;padding:4px 0;font-size:11.5px;color:var(--muted);cursor:pointer;font-family:inherit}
.ah-fbtn:hover{background:var(--panel2)}
.ah-fbtn.on{background:color-mix(in srgb,var(--accent) 16%,transparent);border-color:transparent;color:var(--fg);font-weight:600}
.ah-bind{font-style:normal;color:var(--accent)}
.ah-bar{display:flex;min-height:32px;align-items:center;justify-content:space-between;gap:7px;margin-bottom:5px;border-bottom:1px solid var(--line);padding:0 3px 7px;color:var(--muted);font-size:11px}
.ah-bar label{display:flex;align-items:center;gap:6px;cursor:pointer}
.ah-bar input,.ah-check input{width:15px;height:15px;cursor:pointer;accent-color:var(--accent)}
.ah-del-sel{cursor:pointer;border:1px solid var(--line);border-radius:7px;background:transparent;color:var(--muted);padding:3px 8px;font-size:11px}
.ah-del-sel:hover:not(:disabled){border-color:var(--err);color:var(--err)}
.ah-del-sel:disabled{opacity:.45;cursor:not-allowed}
.ah-group+.ah-group{margin-top:12px}
.ah-group-label{margin:5px 7px 4px;color:var(--muted);font-size:9px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.ah-item-wrap{display:flex;min-width:0;align-items:center;gap:2px;border-radius:8px}
.ah-item-wrap:hover{background:var(--panel2)}
.ah-item-wrap.on{background:color-mix(in srgb,var(--accent) 12%,transparent)}
.ah-check{display:grid;width:24px;height:36px;flex:none;place-items:center;cursor:pointer;border-radius:6px}
.ah-item{display:flex;min-width:0;flex:1;cursor:pointer;align-items:center;gap:8px;border:1px solid transparent;border-radius:8px;background:transparent;padding:9px 8px;color:var(--muted);text-align:left}
.ah-item:hover{border-color:var(--line);background:var(--panel2);color:var(--fg)}
.ah-item.on{border-color:color-mix(in srgb,var(--accent) 26%,var(--line));background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--fg)}
.ah-ico{display:grid;width:24px;height:24px;flex:none;place-items:center;border-radius:6px;background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent);font-size:12px}
.ah-copy{display:grid;min-width:0;flex:1;gap:2px}
.ah-copy strong{overflow:hidden;color:inherit;font-size:11px;font-weight:700;text-overflow:ellipsis;white-space:nowrap}
.ah-copy span{overflow:hidden;color:var(--muted);font-size:9px;text-overflow:ellipsis;white-space:nowrap}
.ah-dot{width:6px;height:6px;flex:none;border-radius:50%;background:var(--muted);opacity:.5}
.ah-dot.run{background:var(--accent);opacity:1;box-shadow:0 0 7px color-mix(in srgb,var(--accent) 60%,transparent)}
.ah-dot.done{background:var(--ok);opacity:1}
.ah-del{opacity:0;cursor:pointer;border:0;background:none;color:var(--muted);padding:2px 4px;border-radius:5px;font-size:12px}
.ah-item-wrap:hover .ah-del{opacity:1}
.ah-del:hover{color:var(--err)}
.ah-foot{display:flex;min-height:37px;align-items:center;gap:6px;border-top:1px solid var(--line);padding:0 13px;color:var(--muted);font-size:9px}
/* 右：对话主线 */
.at{display:flex;min-width:0;min-height:0;flex-direction:column;overflow:hidden;background:var(--bg)}
.at-head{display:flex;min-height:74px;align-items:center;justify-content:space-between;gap:16px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--panel) 72%,var(--bg));padding:12px 22px}
.at-heading{display:flex;min-width:0;align-items:flex-start;gap:9px}
.at-heading h1{max-width:min(560px,45vw);margin:0;overflow:hidden;font-size:16px;font-weight:750;color:var(--fg);text-overflow:ellipsis;white-space:nowrap}
.at-heading p{margin:4px 0 0;color:var(--muted);font-size:10px}
.at-profile{display:inline-flex;min-width:0;align-items:center;gap:8px;cursor:pointer;border:1px solid var(--line);border-radius:999px;background:var(--panel);padding:6px 12px;color:var(--muted);font-size:11px}
.at-profile:hover{border-color:color-mix(in srgb,var(--accent) 40%,var(--line));color:var(--fg)}
.at-profile b{font-weight:400;color:var(--fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.at-profile em{flex:none;border-radius:999px;background:var(--panel2);padding:1px 7px;font-style:normal;font-size:10px}
.at-tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--panel) 88%,var(--bg));padding:7px 22px}
.at-tab{cursor:pointer;border:1px solid transparent;border-radius:8px;background:transparent;padding:5px 11px;color:var(--muted);font-size:12px}
.at-tab:hover{background:var(--panel2);color:var(--fg)}
.at-tab.on{border-color:color-mix(in srgb,var(--accent) 30%,var(--line));background:color-mix(in srgb,var(--accent) 12%,transparent);color:var(--fg)}
.at-msgs{display:flex;min-height:0;flex:1;flex-direction:column;gap:16px;overflow-y:auto;padding:20px clamp(16px,4vw,64px) 26px}
.at-empty{display:grid;max-width:520px;margin:auto;justify-items:center;text-align:center}
.at-empty-ico{display:grid;width:42px;height:42px;margin-bottom:12px;place-items:center;border:1px solid color-mix(in srgb,var(--accent) 28%,var(--line));border-radius:12px;background:color-mix(in srgb,var(--accent) 12%,transparent);color:var(--accent);font-size:18px}
.at-empty h2{margin:0;font-size:18px;font-weight:750;color:var(--fg)}
.at-empty p{margin:7px 0 0;color:var(--muted);font-size:12px;line-height:1.6}
/* 消息：user / assistant / tool / error（照 conversation-view.tsx） */
.msg-row{display:grid;gap:5px;border-radius:10px;padding:10px 12px;font-size:13px;line-height:1.6;white-space:pre-wrap;word-break:break-word}
.msg-user{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--fg)}
.msg-assistant{border:1px solid var(--line);background:var(--panel);color:var(--fg)}
.msg-meta{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:10px}
.msg-meta strong{color:var(--fg);font-weight:700}
.msg-ava{display:grid;width:20px;height:20px;place-items:center;border-radius:6px;background:var(--panel2);font-size:11px}
.q-av{background:transparent;border:0}
.q-av img{width:100%;height:100%;display:block;object-fit:cover;border-radius:inherit}
.msg-chip{border-radius:999px;background:var(--panel2);padding:1px 7px;font-size:9px}
.msg-err{border:1px solid color-mix(in srgb,var(--err) 30%,var(--line));border-radius:10px;background:color-mix(in srgb,var(--err) 10%,transparent);padding:10px 12px;color:var(--err);font-size:12px}
.tool-card{border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:8px;background:var(--panel);font-size:12px}
.tool-card.bad{border-left-color:var(--err)}
.tool-card>summary{display:flex;cursor:pointer;align-items:center;gap:8px;padding:8px 10px;list-style:none}
.tool-card>summary::-webkit-details-marker{display:none}
.tool-name{flex:none;font-weight:700;color:var(--fg)}
.tool-detail{min-width:0;flex:1;overflow:hidden;color:var(--muted);font-size:11px;text-overflow:ellipsis;white-space:nowrap}
.tool-dur{flex:none;color:var(--muted);font-size:10px}
.tool-body{border-top:1px dashed var(--line);padding:8px 10px;color:var(--muted)}
.tool-body pre{max-height:240px;overflow:auto;margin:5px 0 0;border:1px solid var(--line);border-radius:7px;background:var(--panel2);padding:7px 8px;font-size:10px;line-height:1.6;white-space:pre-wrap}
.tool-blk{margin:6px 0 0;color:var(--accent);font-size:9px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
/* 底部：状态行 / 步骤条 / 输入区 / 提示 */
.at-dock{flex:none;border-top:1px solid var(--line);background:color-mix(in srgb,var(--panel) 90%,var(--bg));padding:0 clamp(16px,4vw,64px) 12px}
/* 展示区（照草图）：一行三格等宽 —— 三个计数 | 工具名称 | 产出目录 */
.at-panel{flex:none;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:8px}
.st-box{min-width:0;border:1px solid var(--line);border-radius:10px;background:var(--panel2);padding:8px 12px}
.st-counts{display:flex;flex-direction:column;justify-content:center}
.st-row{display:flex;height:20px;align-items:center;justify-content:space-between;gap:8px;color:var(--muted);font-size:11px}
.st-row b{color:var(--fg);font-size:12.5px;font-variant-numeric:tabular-nums}
.st-box p{margin:0 0 2px;color:var(--muted);font-size:10px;letter-spacing:.06em}
.st-log{height:51px;overflow:hidden auto;font-size:11px;line-height:17px;color:var(--fg)}
.st-log>div{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.st-log .none{color:var(--muted)}
.st-log .dir{color:var(--accent)}
.at-outbtn{max-width:min(46vw,420px);overflow:hidden}
.at-outbtn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.at-live{display:inline-flex;align-items:center;gap:6px;margin-left:auto}
.at-live.on{color:var(--ok)}

.composer{position:relative;margin-top:12px;border:1px solid var(--line);border-radius:12px;background:var(--panel);overflow:hidden}
.composer.drop-on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.composer textarea{width:100%;min-height:24px;max-height:200px;resize:none;overflow-y:hidden;border:0;border-radius:0;background:transparent;padding:13px 15px 6px;font-size:14px;line-height:1.6;outline:none}
.at-tools{display:flex;min-height:48px;align-items:center;justify-content:space-between;gap:12px;padding:0 12px 9px}
.at-tools-l,.at-tools-r{display:flex;min-width:0;align-items:center;gap:5px}
.plus-wrap{position:relative;flex:none}
.icon-btn{display:grid;width:32px;height:32px;cursor:pointer;place-items:center;border:0;border-radius:8px;background:transparent;color:var(--muted);font-size:17px;font-weight:700}
.icon-btn:hover{background:var(--panel2);color:var(--fg)}
.at-sel{display:inline-flex;min-width:0;height:32px;align-items:center;gap:5px;border-radius:8px;padding:0 7px;color:var(--muted)}
.at-sel:hover{background:var(--panel2);color:var(--fg)}
.at-sel select,.at-sel input{max-width:160px;cursor:pointer;appearance:none;border:0;background:transparent;padding:0;color:inherit;font-size:12px;outline:none}
.at-sel input{cursor:text;width:96px}
.send-btn{display:grid;width:34px;height:34px;flex:none;cursor:pointer;place-items:center;border:0;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-size:16px;font-weight:700}
.send-btn:hover{filter:brightness(1.08)}
.send-btn:disabled{opacity:.45;cursor:not-allowed}
.send-btn.stop{background:var(--err);color:#fff}
.at-hint{margin:9px 4px 0;color:var(--muted);font-size:11px;text-align:center}
.at-hint code{border-radius:4px;background:var(--panel2);padding:0 4px;color:var(--fg);font-size:10px}
.atts{display:flex;gap:6px;flex-wrap:wrap;padding:0 12px 6px}
.att{display:flex;align-items:center;gap:6px;max-width:100%;border:1px solid var(--line);background:var(--panel2);border-radius:8px;padding:3px 8px;font-size:11.5px;color:var(--muted)}
.att b{color:var(--fg);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:220px}
.att .x{cursor:pointer;opacity:.55}
.att .x:hover{opacity:1;color:var(--err)}
.att-menu{position:absolute;bottom:calc(100% + 6px);left:0;width:240px;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:4px;z-index:40}
.att-menu .lbl{padding:4px 8px 2px;font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.att-menu .sep{height:1px;background:var(--line);margin:4px 0}
.att-menu button{display:flex;align-items:center;gap:8px;width:100%;background:none;border:0;text-align:left;padding:6px 8px;border-radius:6px;font-size:12.5px;color:var(--fg);cursor:pointer}
.att-menu button:hover{background:var(--panel2)}
.att-menu .tip{padding:4px 8px;font-size:11px;color:var(--muted)}
.ta-mirror{position:fixed;left:-9999px;top:0;visibility:hidden;overflow:hidden;resize:none;border:0;outline:none;min-height:0;max-height:none}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding:0 12px 8px}
.chip{border:1px solid var(--line);background:var(--panel2);border-radius:999px;padding:3px 9px;font-size:11.5px;color:var(--muted);cursor:pointer}
.chip:hover{color:var(--fg);border-color:var(--accent)}
.proj-new{position:sticky;top:-16px;z-index:6}

.pf{display:grid;grid-template-columns:118px 1fr;gap:10px;align-items:center;margin-bottom:10px}
.pf.area{align-items:start}
.pf .lb{background:var(--accent);color:var(--accent-ink);border-radius:8px;padding:9px 6px;text-align:center;font-weight:600;font-size:13px;line-height:1.35}
.pf.area .lb{padding:13px 6px}
/* 项目页 = 卡片托盘（方案 C）：一个项目一张卡，左侧 3px 色带按顺序轮换莫兰迪六色 */
.pj-sec{background:none;border:0;box-shadow:none;padding:0}
.proj-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
.proj-row{position:relative;cursor:pointer;overflow:hidden;border:1px solid var(--line);border-radius:14px;background:var(--panel);padding:13px 15px 11px 18px;font-size:14px;box-shadow:0 1px 2px color-mix(in srgb,var(--fg) 6%,transparent),0 6px 18px color-mix(in srgb,var(--fg) 7%,transparent);transition:transform .16s ease,box-shadow .16s ease,border-color .16s ease}
.proj-row::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:0 3px 3px 0;background:var(--accent)}
.proj-row:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--accent) 55%,var(--line));box-shadow:0 2px 4px color-mix(in srgb,var(--fg) 7%,transparent),0 14px 28px color-mix(in srgb,var(--fg) 10%,transparent)}
.proj-row.cur{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 7%,var(--panel))}
.proj-add{display:flex;align-items:center;justify-content:center;min-height:118px;border:1px dashed color-mix(in srgb,var(--fg) 22%,transparent);border-radius:14px;background:transparent;color:var(--muted);font-weight:600;cursor:pointer}
.proj-add:hover{border-color:var(--accent);color:var(--accent)}
/* 2026-10-08 撤掉「暖色孤岛」：原来这套米驼/陶土色把项目页做成了另一套配色，和其它页风格割裂。
   现在项目页跟别的页一样吃应用主题（--bg/--panel/--line/--accent 全由主题推导），只保留卡片托盘的版式。 */
.pj-page h1{font-size:22px;font-weight:700;margin:0 0 3px;letter-spacing:-.01em}
.pj-page .sub{color:var(--muted);font-size:12.5px;margin-bottom:14px}
.pj-new{padding:13px 15px}
.pj-new h3{font-size:14px;color:var(--muted);font-weight:600;margin:0 0 10px}
.pj-new .row{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
.pj-new label{display:block}
.pj-new label>span{display:block;font-size:11px;color:var(--muted);letter-spacing:.04em;margin-bottom:4px}
.pj-new input,.pj-new textarea{width:100%;border:1px solid var(--line);border-radius:9px;background:var(--panel);padding:7px 10px;font:inherit;font-size:13px;color:var(--fg)}
.pj-new textarea{height:46px;resize:none}
.pj-new .full{grid-column:1/-1}
.proj-row.cur{outline:2px solid color-mix(in srgb,var(--accent) 45%,transparent);outline-offset:1px}
.proj-row .go{background:transparent;color:color-mix(in srgb,var(--accent) 78%,var(--fg));padding:0;font-size:12.5px;font-weight:700}
.proj-row .go:hover{filter:none;text-decoration:underline}
.proj-row .go.del{color:var(--err);font-weight:400;padding:0 4px}
.proj-add:hover{background:color-mix(in srgb,var(--accent) 8%,transparent)}

/* ===== 定时任务（版式照原版 automation.tsx：页头+编辑器栅格+任务卡+说明+运行记录；配色用本应用变量） ===== */
.sch-eyebrow,.inst-label{font-size:11px;letter-spacing:.08em;color:var(--muted);font-weight:600;text-transform:uppercase;margin:0 0 4px}
.sch-head{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap}
.sch-head h3{margin:0;font-size:16px}
.sch-head p{color:var(--muted);font-size:12.5px;margin:5px 0 0;max-width:74ch;line-height:1.6}
.sch-head .btn{margin-left:auto;flex:none}
.sch-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px 12px;margin-top:12px}
@media (max-width:1180px){.sch-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.sch-grid label{display:block;min-width:0}
.sch-grid label>span{display:block;font-size:11px;color:var(--muted);letter-spacing:.04em;margin-bottom:4px}
.sch-grid input,.sch-grid select,.sch-grid textarea{width:100%;border:1px solid var(--line);border-radius:9px;background:var(--panel2);padding:7px 10px;font:inherit;font-size:13px;color:var(--fg)}
.sch-grid textarea{height:80px;resize:vertical}
.sch-grid .full{grid-column:1/-1}
.sch-card{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-radius:14px;background:var(--panel);padding:13px 15px;margin-top:10px}
.sch-card.off{opacity:.62}
.sch-card .ic{width:32px;height:32px;flex:none;border-radius:10px;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--accent) 12%,transparent);font-size:15px}
.sch-card .main{min-width:0;flex:1}
.sch-card .nmrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sch-card .nm{font-size:14.5px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sch-card .ln{color:var(--muted);font-size:12px;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sch-card .acts{display:flex;gap:6px;flex:none;flex-wrap:wrap;justify-content:flex-end}
.sch-note{display:flex;gap:8px;align-items:center;margin-top:10px;color:var(--muted);font-size:12.5px;background:color-mix(in srgb,var(--accent) 8%,transparent);border-radius:10px;padding:9px 12px;line-height:1.5}
.sch-run{display:flex;flex-wrap:wrap;align-items:center;gap:8px;border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:9px 12px;margin-top:8px}
.sch-run .nm{font-size:12.5px;font-weight:700}
.sch-run .tm{font-size:11.5px;color:var(--muted)}
.sch-run .det{flex-basis:100%;font-size:11.5px;color:var(--muted);margin-top:2px;overflow-wrap:anywhere}
.sch-run .acts{margin-left:auto;display:flex;gap:6px}

/* ===== 项目空间（版式照原版 project-space.tsx：页头+tab+概览四卡+快照；色/控件全走主题变量） ===== */
.wf-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 10px}
.wf-head .hint{font-size:12.5px}
.sp-tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin-top:12px}
.sp-tab{background:none;border:0;border-bottom:2px solid transparent;color:var(--muted);font:inherit;font-size:13px;padding:8px 12px;cursor:pointer;white-space:nowrap}
.sp-tab:hover{color:var(--fg)}
.sp-tab.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
.sp-grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.sp-grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:1180px){.sp-grid4{grid-template-columns:repeat(2,minmax(0,1fr))}.sp-grid2{grid-template-columns:1fr}}
.sp-kpi strong{display:block;font-size:26px;font-weight:700;letter-spacing:-.01em;margin:2px 0 4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sp-kpi-note{color:var(--muted);font-size:12px;margin:0;line-height:1.5}
.sp-bar{height:6px;border-radius:999px;background:var(--panel2);margin-top:8px;overflow:hidden}
.sp-bar>div{height:100%;background:var(--accent);border-radius:999px}
.sp-row{display:flex;gap:10px;align-items:flex-start;border-top:1px solid var(--line);padding:9px 0}
.sp-row:first-of-type{border-top:0}
.sp-ic{width:22px;flex:none;text-align:center;color:var(--muted);font-size:13px}
.sp-main{min-width:0;flex:1}
.sp-nm{font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sp-meta{color:var(--muted);font-size:11.5px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sp-dot{width:9px;height:9px;border-radius:50%;flex:none;margin-top:5px;background:color-mix(in srgb,var(--fg) 18%,transparent)}
.sp-dot.run{background:color-mix(in srgb,var(--accent) 45%,transparent)}
.sp-dot.on{background:var(--accent)}
.sp-kv{display:flex;gap:10px;border-top:1px solid var(--line);padding:7px 0;font-size:12.5px}
.sp-kv:first-of-type{border-top:0}
.sp-kv span{color:var(--muted);flex:none;width:9em}
.sp-kv b{font-weight:600;overflow-wrap:anywhere}
.sp-acts{display:flex;gap:6px;flex:none;flex-wrap:wrap}
.tm-ev{flex-basis:100%;margin-top:6px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:12px;color:var(--muted);display:grid;gap:4px;max-height:280px;overflow:auto}
.tm-ev-k{display:inline-block;min-width:6em;color:var(--accent);font-weight:600;font-family:ui-monospace,Consolas,monospace}
.tm-ev-t{margin-right:8px;opacity:.7;font-variant-numeric:tabular-nums}
.pf-dir{display:flex;align-items:center;gap:10px;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:4px 6px 4px 12px}
.pf-dir .dp{flex:1;min-width:0;font-size:13px;color:var(--muted-fg,var(--muted));white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:ui-monospace,Consolas,monospace}
.pf-dir.set .dp{color:inherit}
.pf-dir .btn{flex:0 0 auto;height:26px;padding:0 12px;font-size:13px}
.pf-actions{display:flex;justify-content:flex-end}

.proj-row .nm{font-size:15.5px;font-weight:700;letter-spacing:-.005em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.proj-row .q{color:var(--muted);font-size:12.5px;margin:3px 0 9px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.proj-row .kws{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:9px}
.proj-row .kw{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:1px 9px;font-size:11.5px;color:var(--muted)}
.proj-row .meta{display:flex;align-items:center;gap:8px;border-top:1px dashed var(--line);padding-top:8px;font-size:12px;color:var(--muted)}
.proj-row .st{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:11.5px;font-weight:600;color:var(--fg);white-space:nowrap}
.proj-row .tm{margin-left:auto;white-space:nowrap;font-variant-numeric:tabular-nums}
.proj-row .go{flex:none;background:var(--accent);color:var(--accent-ink);border:0;border-radius:999px;padding:5px 13px;font-size:12.5px;font-weight:600;cursor:pointer}
.proj-row .go:hover{filter:brightness(1.08)}
.proj-row .go.del{background:transparent;color:var(--err);opacity:.75;padding:5px 8px}
.proj-row .go.del:hover{opacity:1;background:color-mix(in srgb,var(--err) 12%,transparent);filter:none}
.pf-actions .btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:999px;padding:8px 20px;font-size:13.5px;font-weight:600;cursor:pointer}
.pf-actions .btn:hover{filter:brightness(1.08)}
.proj-new{border-radius:14px}
.proj-new .lb{border-radius:10px}


/* ================= 日历页：四块卡片，上下 3:1，上排 2:1，下排 1:1（样式数值直接取 lit 的 public/style.css，变量映射到本项目的 --accent/--line/--muted/--err/--panel/--panel2） ================= */
.cal-page{display:grid;grid-template-rows:3fr 1fr;gap:14px;height:100%;min-height:0}
.cal-mid{display:grid;grid-template-columns:2fr 1fr;gap:14px;min-height:0}
/* 左列再分两层：问候卡 : 日历 = 1 : 2.2（照草图比例），问候卡内容整体居中 */
.cal-left{display:grid;grid-template-rows:1fr 2.2fr;gap:14px;min-height:0}
.cal-page .card.cal-hello{flex-direction:row;align-items:center;justify-content:center;gap:14px}

.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap}
.ph-acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
/* ================= 团队页（方案 C · 流水线）：三列 = 团队 | 群聊时间线 | 本轮 ================= */
.tc-page{display:flex;flex-direction:column;gap:12px;height:100%;min-height:0}
.tc-page .page-head{flex:none}
.tc-cols{flex:1;min-height:0;display:grid;grid-template-columns:256px minmax(0,1fr) 232px;gap:12px}
.tc-panel{min-width:0;min-height:0;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.tc-ct{font-size:11px;letter-spacing:.14em;font-weight:700;color:var(--muted);margin:0;padding:11px 13px 8px}
.tc-cb{min-height:0;flex:1;overflow:auto;padding:0 11px 11px}
.tc-teams{display:flex;flex-direction:column;gap:5px}
.tc-team{display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:transparent;border:1px solid transparent;border-radius:10px;padding:9px 10px;color:var(--fg);font-size:13px;cursor:pointer}
.tc-team:hover{background:var(--panel2)}
.tc-team.on{background:color-mix(in srgb,var(--accent) 14%,transparent);box-shadow:inset 3px 0 0 var(--accent);font-weight:600}
.tc-team.done{opacity:.6}
.tc-team b{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.tc-team i{margin-left:auto;font-style:normal;font-size:10.5px;color:var(--muted);background:var(--panel2);border-radius:999px;padding:1px 8px;font-variant-numeric:tabular-nums}
.tc-team.add{border:1px dashed var(--line);color:var(--muted);justify-content:center}
.tc-cnt{color:var(--muted);font-size:11px;margin:9px 2px 8px;padding-bottom:8px;border-bottom:1px dashed var(--line)}
.tc-row2{display:flex;gap:6px;margin:0 0 10px}
.tc-row2 .btn{flex:1;height:30px;padding:0 10px;font-size:12px}
.tc-chip{display:flex;align-items:center;gap:9px;width:100%;box-sizing:border-box;border:0;border-radius:9px;background:transparent;padding:6px 7px;font-size:12.5px}
.tc-chip:hover{background:var(--panel2)}
.tc-chip .tc-av{flex:none;width:26px;height:26px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:12px;background:color-mix(in srgb,var(--mc,var(--accent)) 24%,var(--panel2));border:1px solid color-mix(in srgb,var(--mc,var(--accent)) 45%,transparent)}
.tc-chip .tc-main{min-width:0;flex:1;line-height:1.25}
.tc-chip b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tc-chip i{display:block;font-style:normal;color:var(--muted);font-size:10.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tc-chip .tc-x{margin-left:auto;border:0;background:none;color:var(--muted);cursor:pointer;font-size:11px;padding:0 3px}
.tc-chip .tc-x:hover{color:var(--err)}
.tc-add{margin-top:8px;display:block}
.tc-add select{width:100%;box-sizing:border-box;max-width:none}
.tc-tl{min-height:0;flex:1;overflow:auto;padding:2px 14px 10px}
.tc-msg{position:relative;display:flex;flex-direction:row;align-self:stretch;gap:12px;max-width:none;padding:0 0 14px}
.tc-msg::before{content:"";position:absolute;left:13px;top:30px;bottom:0;width:1px;background:var(--line)}
.tc-msg:last-child::before{display:none}
.tc-msg .tc-av{flex:none;width:27px;height:27px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:12px;z-index:1;background:var(--panel);border:2px solid var(--mc,var(--accent))}
.tc-msg .tc-body{min-width:0;flex:1}
.tc-msg .tc-who{display:flex;align-items:baseline;gap:8px;font-size:12px;color:var(--muted);margin:0}
.tc-msg .tc-who b{color:var(--mc,var(--accent));font-weight:700;font-size:12.5px}
.tc-msg .tc-idx{font-size:10.5px;color:var(--muted);background:var(--panel2);border-radius:4px;padding:0 5px;font-variant-numeric:tabular-nums}
.tc-msg .tc-at{margin-left:auto;font-size:10.5px;font-variant-numeric:tabular-nums}
.tc-msg .tc-text{margin-top:5px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px;line-height:1.7;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 11px}
.tc-msg.me .tc-text{background:color-mix(in srgb,var(--accent) 12%,var(--panel));border-color:color-mix(in srgb,var(--accent) 35%,var(--line))}
.tc-sys{position:relative;display:flex;gap:12px;align-items:flex-start;padding:0 0 14px}
.tc-sys::before{content:"";position:absolute;left:13px;top:30px;bottom:0;width:1px;background:var(--line)}
.tc-sys:last-child::before{display:none}
.tc-sys .tc-av{flex:none;width:27px;height:27px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:12px;z-index:1;background:var(--panel);border:2px solid color-mix(in srgb,var(--warn) 60%,transparent);color:var(--warn)}
.tc-sys .tc-body{min-width:0;flex:1}
.tc-sys .tc-who{display:flex;align-items:baseline;gap:8px;font-size:12px;color:var(--muted);margin:0}
.tc-sys .tc-who b{color:var(--warn);font-weight:700;font-size:12.5px}
.tc-sys .tc-text{margin-top:5px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px;color:var(--muted);border:1px dashed var(--line);border-radius:10px;padding:8px 11px}
.tc-empty{color:var(--muted);font-size:12.5px;text-align:center;padding:26px 10px;line-height:1.8}
.tc-composer{flex:none;display:flex;gap:10px;align-items:flex-end;border-top:1px solid var(--line);padding:10px 11px}
.tc-composer textarea{flex:1;min-height:38px}
.tc-composer .btn{flex:none;height:38px;padding:0 14px;background:var(--accent);color:var(--accent-ink);border:0;font-weight:700}
.tc-foot{flex:none;margin:0;padding:0 13px 10px;font-size:11px}
.tc-prog{flex:none;height:4px;border-radius:999px;background:var(--panel2);overflow:hidden;margin:0 13px 10px}
.tc-prog i{display:block;height:100%;background:var(--accent);transition:width .3s}
.tc-step{display:flex;align-items:center;gap:8px;padding:6px 3px;font-size:12px;border-top:1px dashed color-mix(in srgb,var(--line) 70%,transparent)}
.tc-step:first-child{border-top:0}
.tc-step .d{flex:none;width:7px;height:7px;border-radius:50%;background:var(--muted)}
.tc-step.now .d{background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 20%,transparent)}
.tc-step.idle{opacity:.5}
.tc-step b{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tc-step em{margin-left:auto;font-style:normal;font-size:10.5px;color:var(--muted)}
.tc-kv{font-size:11.5px;color:var(--muted);padding:3px 3px}
.tc-kv b{color:var(--fg);font-weight:600}
@media (max-width:1080px){.tc-cols{grid-template-columns:minmax(0,1fr)}.tc-panel{min-height:200px}}
.hello-avatar{display:grid;width:48px;height:48px;flex:none;place-items:center;border-radius:50%;background:var(--panel2);border:1px solid var(--line);font-size:24px}
.avatar-img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
.prof-photo-prev{width:44px;height:44px;border-radius:50%;object-fit:cover;border:1px solid var(--line);display:none}
.prof-photo-prev.on{display:block}
.cal-page .card.cal-hello b{font-size:20px;font-weight:700}
.cal-bottom{display:grid;grid-template-columns:1fr 1fr;gap:14px;min-height:0}
.cal-page .card{margin-bottom:0;padding:14px 16px;min-height:0;display:flex;flex-direction:column}
.cal-page .card-head{display:flex;align-items:center;gap:10px;margin-bottom:10px;position:relative;flex:none}
.cal-page .card-head b{font-size:15px;white-space:nowrap;flex:none}
.side-count{font-size:11px;color:var(--muted);margin-left:auto;flex:none}

.cal-nav{display:flex;align-items:center;gap:5px;margin-left:auto;flex-wrap:nowrap}
.cal-nav-btn{border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:2px 7px;font-size:13px;cursor:pointer;color:var(--muted);font-family:inherit;white-space:nowrap;flex:none}
.cal-nav-btn:hover{border-color:var(--accent);color:var(--accent)}
.cal-nav select{border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:2px 2px 2px 6px;font-size:13px;color:inherit;font-family:inherit;cursor:pointer;flex:none}
.cal-nav #calY{width:74px}
.cal-nav #calM{width:62px}
.cal-week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:4px;flex:none}
.cal-week span{text-align:center;font-size:11.5px;color:var(--muted);padding:2px 0}
.cal-week .cal-we{color:var(--err);opacity:.7}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;flex:1;min-height:0;overflow:auto;align-content:start}
.cal-cell{min-height:40px;border-radius:8px;border:1px solid transparent;padding:3px 5px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;cursor:pointer;transition:background .12s,border-color .12s}
.cal-cell:hover{background:color-mix(in srgb,var(--accent) 14%,transparent)}
.cal-cell.out{opacity:.32;cursor:default}
.cal-cell.selected{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent)}
.cal-cell.today .cal-num{background:var(--accent);color:var(--accent-ink);border-radius:50%;width:20px;height:20px;display:inline-flex;align-items:center;justify-content:center}
.cal-num{font-size:12px;font-weight:600}
.cal-lunar{display:block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted);font-size:9.5px;line-height:1.2}
.cal-cell.today .cal-lunar{color:var(--accent)}
.cal-dots{display:flex;gap:3px;align-items:center;justify-content:center;flex-wrap:wrap}
.cal-dot{width:6px;height:6px;border-radius:50%;display:inline-block;flex-shrink:0}
.cal-more{font-size:9.5px;color:var(--muted);font-style:normal}
.cal-day-events{margin-top:10px;border-top:1px dashed var(--line);padding-top:8px;flex:none}
.cal-day-head{font-size:12.5px;font-weight:700;display:flex;align-items:center;gap:8px}
.cal-pop{position:absolute;z-index:70;width:210px;padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:var(--panel);box-shadow:0 8px 24px rgba(0,0,0,.16);top:32px;right:0}
.cal-pop label{display:flex;align-items:center;gap:7px;padding:5px 0;font-size:12.5px}
.cal-pop p{margin:7px 0 0;padding-top:7px;border-top:1px solid var(--line);color:var(--muted);font-size:11px;line-height:1.5}

.check-list{display:flex;flex-direction:column;gap:6px;flex:1;min-height:0;overflow-y:auto}
.check-item{display:flex;align-items:center;gap:8px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;font-size:13px}
.check-item input{accent-color:var(--accent);cursor:pointer}
.check-item.done .check-title{text-decoration:line-through;color:var(--muted)}
.check-title{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.check-due{font-size:11px;color:var(--muted);flex-shrink:0}
.check-del{border:none;background:none;color:var(--muted);cursor:pointer;font-size:12px;flex-shrink:0}
.check-del:hover{color:var(--err)}
.quick-add{display:flex;gap:8px;margin-top:10px;flex:none}
.tb-input{flex:1;min-width:0;background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:6px 9px;font-size:13px;color:inherit;outline:none;font-family:inherit}

.feed-list{display:flex;flex-direction:column;gap:0;flex:1;min-height:0;overflow-y:auto}
.feed-item{display:flex;gap:10px;padding:7px 0;font-size:13px;border-bottom:1px dashed var(--line)}
.feed-item:last-child{border-bottom:none}
.feed-ico{flex-shrink:0}
.feed-text{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.feed-time{font-size:11px;color:var(--muted);flex-shrink:0}

.countdown-list{display:flex;flex-direction:column;gap:8px;flex:1;min-height:0;overflow-y:auto}
.countdown-item{display:flex;align-items:center;gap:10px;font-size:13px}
.countdown-days{min-width:46px;text-align:center;padding:4px 6px;border-radius:8px;background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent);font-weight:700;font-size:12px}
.countdown-days.urgent{background:color-mix(in srgb,var(--err) 14%,transparent);color:var(--err)}
.countdown-label{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hidden{display:none}

.hidden { display: none !important; }
.field-inline { display: flex; align-items: center; gap: 8px; }
.field-inline > span { flex-shrink: 0; white-space: nowrap; }
.field-inline .tb-input, .field-inline .tb-select { flex: 1; min-width: 120px; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;   /* 内容居中：inline-flex 默认是 flex-start，被拉宽的按键（三等分/定宽）文字会贴左（2026-10-12 他定的规矩：功能键一律居中） */
  padding: 8px 14px; border: 1px solid var(--line); background: var(--panel);
  color: inherit; border-radius: 8px; cursor: pointer; font-size: 13px;
  transition: all .15s; white-space: nowrap;
}
.btn:hover { background: var(--panel2); border-color: var(--line); }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn-primary:hover { background: var(--accent); border-color: var(--accent); }
.btn-ghost { border-color: transparent; background: transparent; color: var(--muted); }
.btn-ghost:hover { background: var(--panel2); }
.btn-ghost.active { background: color-mix(in srgb,var(--accent) 14%,transparent); color: var(--accent); border-color: var(--accent); }
.btn-danger { background: var(--err); border-color: var(--err); color: #fff; }
.btn-danger:hover { background: #c0333f; border-color: #c0333f; }
.tb-btn {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 6px 11px; border: 1px solid transparent; background: transparent;
  color: var(--muted); border-radius: 7px; cursor: pointer; font-size: 13px; transition: all .12s;
}
.tb-btn:hover { background: var(--panel2); color: inherit; }
.tb-btn.accent { color: var(--accent); font-weight: 600; }
.tb-btn.accent:hover { background: color-mix(in srgb,var(--accent) 14%,transparent); }
.tb-btn.ghost { color: var(--muted); font-size: 12px; }
.tb-sep { width: 1px; height: 18px; background: var(--line); margin: 0 4px; }
.tb-label { font-size: 12px; color: var(--muted); }
.tb-select, .tb-input {
  padding: 6px 10px; border: 1px solid var(--line); border-radius: 7px;
  font-size: 13px; font-family: inherit; background: var(--panel); outline: none; color: inherit;
}
.tb-select:focus, .tb-input:focus { border-color: var(--accent); }
.modal { position: fixed; inset: 0; z-index: 100; display: flex; align-items: center; justify-content: center; }
.modal-mask { position: absolute; inset: 0; background: rgba(13,35,29,.48); }
.modal-dialog {
  position: relative; background: var(--panel); border-radius: 8px; box-shadow: var(--shadow-lg);
  width: 460px; max-width: calc(100vw - 40px); max-height: 88vh;
  display: flex; flex-direction: column; z-index: 1;
  animation: popIn .16s ease;
}
.modal-wide { width: 700px; }
.modal-head { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; border-bottom: 1px solid var(--line); }
.modal-head h3 { margin: 0; font-size: 16px; }
.modal-close { background: none; border: none; font-size: 18px; cursor: pointer; color: var(--muted); }
.modal-body { padding: 20px; overflow-y: auto; }
.modal-desc { font-size: 13px; color: var(--muted); margin: 0 0 16px; background: color-mix(in srgb,var(--accent) 14%,transparent); padding: 10px 12px; border-radius: 8px; }
.modal-foot { display: flex; justify-content: flex-end; gap: 10px; padding: 14px 20px; border-top: 1px solid var(--line); }
.field { display: block; margin-bottom: 14px; }
.field > span { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: var(--muted); }
.field-sep { height: 1px; background: var(--line); margin: 16px 0; }
.field textarea {
  width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px;
  font-family: inherit; font-size: 13px; resize: vertical; min-height: 64px;
}
.modal-foot > a.btn { text-decoration: none; }
.btn-sm { font-size: 12px; padding: 4px 9px; }
.mail-notif-stack {
  position: fixed; top: 18px; right: 18px; z-index: 9999;
  display: flex; flex-direction: column; gap: 10px;
  pointer-events: none;
}
.mail-notif {
  display: flex; align-items: flex-start; gap: 10px;
  width: 330px; padding: 12px 14px;
  background: var(--panel); border: 1px solid var(--line);
  border-left: 3px solid var(--accent);
  border-radius: 10px; box-shadow: 0 8px 26px rgba(0,0,0,.16);
  cursor: pointer; pointer-events: auto;
  animation: mailNotifIn .22s cubic-bezier(.2,.9,.3,1.2);
  transition: transform .15s, box-shadow .15s;
}
.mail-notif:hover { transform: translateX(-3px); box-shadow: 0 10px 30px rgba(0,0,0,.22); }
.mail-notif.out { animation: mailNotifOut .22s ease forwards; }
.mail-notif-ico { font-size: 20px; line-height: 1.1; flex-shrink: 0; }
.mail-notif-body { flex: 1; min-width: 0; }
.mail-notif-title { font-size: 12px; color: var(--accent); font-weight: 700; margin-bottom: 3px; }
.mail-notif-subject { font-size: 13.5px; color: inherit; font-weight: 600; line-height: 1.4; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.mail-notif-from { font-size: 12px; color: var(--muted); margin-top: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mail-notif-close {
  flex-shrink: 0; width: 20px; height: 20px; border: none; border-radius: 5px;
  background: transparent; color: var(--muted); cursor: pointer; font-size: 12px;
  display: flex; align-items: center; justify-content: center;
}
.mail-notif-close:hover { background: var(--panel2); color: inherit; }
.as-link { border: none; background: none; color: var(--accent); cursor: pointer; font-size: 12px; padding: 0; font-family: inherit; }
.as-link:hover { text-decoration: underline; }
.tb-spacer { flex: 1; }
.prof-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; }
.mail-wrap { display: flex; flex: 1 1 auto; gap: 12px; min-height: 340px; }
.mail-side { width: 218px; flex-shrink: 0; display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.mail-side-head { display: flex; align-items: center; justify-content: space-between; gap: 6px; padding: 10px 12px; border-bottom: 1px solid var(--line); }

.mail-acc:hover { background: color-mix(in srgb,var(--accent) 14%,transparent); }
.mail-acc.active { background: var(--accent); color: #fff; }
.mail-badge { width: 24px; height: 24px; border-radius: 50%; background: color-mix(in srgb,var(--accent) 14%,transparent); color: var(--accent); display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; flex-shrink: 0; }
.mail-acc.active .mail-badge { background: rgba(255, 255, 255, .22); color: #fff; }
.mail-acc-info { min-width: 0; display: flex; flex-direction: column; }

.mail-acc-info span { font-size: 11px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mail-acc.active .mail-acc-info span { color: rgba(255, 255, 255, .78); }
.mail-side-sep { height: 1px; background: var(--line); margin: 0 10px; flex-shrink: 0; }
.mail-folders { flex: 1; min-height: 0; overflow-y: auto; padding: 8px 6px; display: flex; flex-direction: column; gap: 2px; }
.mail-folder { display: flex; align-items: center; gap: 7px; padding: 6px 9px; border-radius: 7px; font-size: 12.5px; cursor: pointer; color: var(--muted); transition: background .12s; }
.mail-folder:hover { background: var(--panel2); }
.mail-folder.active { background: color-mix(in srgb,var(--accent) 14%,transparent); color: var(--accent); font-weight: 600; }
.mail-folder-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mail-empty-side { padding: 14px 10px; font-size: 12px; color: var(--muted); text-align: center; line-height: 1.7; }
.mail-list-col { width: 336px; flex-shrink: 0; display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.mail-list-head { display: flex; gap: 6px; align-items: center; padding: 9px 10px; border-bottom: 1px solid var(--line); flex-shrink: 0; }
.mail-search { flex: 1; min-width: 0; font-size: 12.5px; }
.mail-list-title { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; padding: 7px 12px; border-bottom: 1px solid var(--line); background: var(--panel2); flex-shrink: 0; }
.mail-title-main { font-size: 12.5px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mail-title-sub { font-size: 11px; color: var(--muted); white-space: nowrap; flex-shrink: 0; }
.mail-list { flex: 1; min-height: 0; overflow-y: auto; }
.mail-item { display: flex; gap: 8px; padding: 9px 12px; border-bottom: 1px solid var(--line); cursor: pointer; transition: background .12s; }
.mail-item:hover { background: var(--panel2); }
.mail-item.active { background: color-mix(in srgb,var(--accent) 14%,transparent); }
.mail-dot { width: 6px; height: 6px; border-radius: 50%; background: transparent; margin-top: 6px; flex-shrink: 0; }
.mail-item.unread .mail-dot { background: var(--accent); }
.mail-item-main { min-width: 0; flex: 1; }
.mail-item-row1 { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.mail-from { font-size: 12.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mail-item.unread .mail-from { color: inherit; font-weight: 600; }
.mail-date { font-size: 11px; color: var(--muted); flex-shrink: 0; }
.mail-item-row2 { display: flex; align-items: center; gap: 6px; margin-top: 2px; }
.mail-subject { flex: 1; min-width: 0; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); }
.mail-item.unread .mail-subject { color: inherit; font-weight: 600; }
.mail-attach-ico { font-size: 11px; flex-shrink: 0; }
.mail-loading, .mail-empty, .mail-error { padding: 30px 18px; text-align: center; font-size: 12.5px; color: var(--muted); line-height: 1.8; }

.mail-error .btn { margin-top: 10px; }
.mail-pager { display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-top: 1px solid var(--line); background: var(--panel2); flex-shrink: 0; }
.mail-page-info { font-size: 11.5px; color: var(--muted); }
.mail-page-size { margin-left: auto; }
.mail-page-size select { font-size: 11.5px; padding: 3px 6px; }
.mail-guide { display: flex; flex-direction: column; align-items: center; gap: 9px; padding: 44px 34px; text-align: center; color: var(--muted); }

.mail-detail-col { flex: 1; min-width: 0; display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
