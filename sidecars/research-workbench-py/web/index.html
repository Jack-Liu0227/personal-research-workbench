  // ---------- 邮件一键翻译 ----------

  /** 译文缓存。只保留当前这一封，切换邮件即失效（见 renderMailDetail） */
  let mailTrans = null;
  /** 单次翻译的字符上限，避免超长邮件把翻译接口拖垮 */
  const MAIL_TRANS_MAX = 6000;

  /**
   * 取邮件正文的纯文本用于翻译。
   * 优先用服务端给的 text；只有 HTML 时剥标签（邮件 HTML 常带 <style>/<script>，先删掉）。
   */
  function mailPlainBody(d) {
    const text = String(d?.text || '').trim();
    if (text) return text;
    const html = String(d?.html || '');
    if (!html) return '';
    const cleaned = html
      .replace(/<(script|style)[\s\S]*?<\/\1>/gi, ' ')
      .replace(/<!--[\s\S]*?-->/g, ' ');
    return String(stripHtml(cleaned) || '').replace(/\n{3,}/g, '\n\n').trim();
  }

  /** 一键翻译当前邮件正文 */
  async function mailTranslateBody() {
    if (!mailDetail) return;
    const uid = mailDetail.uid;
    const plain = mailPlainBody(mailDetail);
    if (!plain) { toast('这封邮件没有可翻译的正文', 'error'); return; }

    const truncated = plain.length > MAIL_TRANS_MAX;
    const text = truncated ? plain.slice(0, MAIL_TRANS_MAX) : plain;
    mailTrans = { uid, pending: true, text: '', truncated };
    renderMailDetail();

    const target = $('prLangTo')?.value || 'zh';
    let provider;
    let profileId;
    const src = $('prTranslateSource')?.value || 'auto';
    if (src.startsWith('llm:')) { provider = 'siliconflow'; profileId = src.slice(4); }
    else if (src !== 'auto') provider = src;

    try {
      const data = await api('/api/translate', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text, target, provider, profileId }),
      });
      // 期间用户可能已经切到别的邮件，避免把结果串到错的地方
      if (!mailTrans || mailTrans.uid !== uid) return;
      mailTrans = { uid, text: data.translation || '(未返回译文)', truncated };
      toast('邮件翻译完成', 'success');
    } catch (e) {
      if (!mailTrans || mailTrans.uid !== uid) return;
      mailTrans = { uid, error: e.message, truncated };
    }
    renderMailDetail();
  }

  // ---------- 数据加载 ----------
  async function ensureMailFolders(accountId, force = false) {
    if (!force && mailFoldersOwner === accountId && mailFolders.length) { renderMailSide(); return; }
    mailFoldersOwner = accountId;
    try {
      mailFolders = await api(`/api/mail/accounts/${accountId}/folders`);
    } catch (e) {
      mailFolders = [];
      toast('读取文件夹失败：' + e.message, 'error');
    }
    renderMailSide();
  }

  async function openMailFolder(accountId, folder, name, page = 1) {
    if (!accountId) return;
    mailCur.accountId = accountId;
    mailCur.folder = folder || 'INBOX';
    mailCur.folderName = name || folder || '收件箱';
    mailCur.page = page;
    mailDetail = null;
    renderMailSide();
    renderMailDetail();
    await loadMailMessages();
  }

  async function selectMailAccount(id) {
    if (!id || (mailCur.accountId === id && mailMessages.length)) return;
    mailMessages = []; mailTotal = 0; mailDetail = null;
    $('mailSearch').value = '';
    mailCur = { accountId: id, folder: 'INBOX', folderName: '收件箱', page: 1, pageSize: mailCur.pageSize, search: '' };
    await ensureMailFolders(id, true);
    // 优先定位到真正的收件箱文件夹（不同邮箱命名可能不同）
    const inbox = mailFolders.find((f) => f.specialUse === '\\Inbox') || mailFolders.find((f) => f.path === 'INBOX');
    await openMailFolder(id, inbox ? inbox.path : 'INBOX', inbox ? inbox.name : '收件箱', 1);
  }

  async function loadMailMessages() {
    if (!mailCur.accountId) return;
    $('mailList').innerHTML = '<div class="mail-loading">正在收取邮件…</div>';
    renderMailListHead();
    const q = new URLSearchParams({ folder: mailCur.folder, page: String(mailCur.page), pageSize: String(mailCur.pageSize) });
    if (mailCur.search) q.set('search', mailCur.search);
    try {
      const data = await api(`/api/mail/accounts/${mailCur.accountId}/messages?${q.toString()}`);
      mailMessages = data.messages || [];
      mailTotal = data.total || 0;
      renderMailMessages();
    } catch (e) {
      mailMessages = []; mailTotal = 0;
      $('mailList').innerHTML = `<div class="mail-error">收取失败：${esc(e.message)}<div><button class="btn" data-mail-retry="1">重试</button></div></div>`;
      renderMailPager();
    }
  }

  async function openMailMessage(uid) {
    const id = mailCur.accountId;
    $('mailDetail').innerHTML = '<div class="mail-loading">正在打开邮件…</div>';
    try {
      const d = await api(`/api/mail/accounts/${id}/messages/${uid}?folder=${encodeURIComponent(mailCur.folder)}`);
      mailDetail = d;
      renderMailDetail();
      const item = mailMessages.find((m) => m.uid === Number(uid));
      if (item && !item.seen) {
        item.seen = true;
        api(`/api/mail/accounts/${id}/messages/${uid}/seen`, {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ seen: true, folder: mailCur.folder }),
        }).catch(() => { /* 标记失败不影响阅读 */ });
      }
      renderMailMessages();
    } catch (e) {
      mailDetail = null;
      $('mailDetail').innerHTML = `<div class="mail-error">打开失败：${esc(e.message)}</div>`;
    }
  }

  async function markAllMailSeen() {
    if (!mailCur.accountId) return toast('请先选择邮箱账户', 'error');
    const scope = mailCur.search ? `当前文件夹（搜索结果不会影响批量范围）` : (mailCur.folderName || mailCur.folder);
    if (!confirm(`确认将「${scope}」中的全部未读邮件标记为已读？`)) return;
    const button = $('btnMailMarkAllRead');
    if (button) button.disabled = true;
    try {
      const result = await api(`/api/mail/accounts/${mailCur.accountId}/messages/seen-all`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ folder: mailCur.folder }),
      });
      mailMessages.forEach((item) => { item.seen = true; });
      renderMailMessages();
      toast(result.markedCount ? `已将 ${result.markedCount} 封邮件标记为已读` : '当前文件夹没有未读邮件', 'success');
      // 同步侧边栏未读角标，避免批量操作后仍显示旧数字。
      checkNewMail().catch(() => {});
    } catch (e) { toast('批量标记失败：' + e.message, 'error'); }
    finally { if (button) button.disabled = false; }
  }

  async function markMailUnread() {
    if (!mailDetail) return;
    const uid = mailDetail.uid;
    try {
      await api(`/api/mail/accounts/${mailCur.accountId}/messages/${uid}/seen`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ seen: false, folder: mailCur.folder }),
      });
      const it = mailMessages.find((m) => m.uid === uid);
      if (it) it.seen = false;
      renderMailMessages();
      toast('已标记为未读', 'success');
    } catch (e) { toast(e.message, 'error'); }
  }

  async function removeMailMessage() {
    if (!mailDetail) return;
    if (!confirm('确认删除这封邮件？删除后无法恢复。')) return;
    const uid = mailDetail.uid;
    try {
      await api(`/api/mail/accounts/${mailCur.accountId}/messages/${uid}?folder=${encodeURIComponent(mailCur.folder)}`, { method: 'DELETE' });
      mailDetail = null;
      renderMailDetail();
      await loadMailMessages();
      toast('邮件已删除', 'success');
    } catch (e) { toast(e.message, 'error'); }
  }

  // ---------- 账户管理 ----------
  function renderMaProviderOptions() {
    const sel = $('maProvider');
    if (sel.dataset.ready) return;
    sel.innerHTML = Object.entries(mailProviders || {})
      .map(([key, p]) => `<option value="${esc(key)}">${esc(p.label || key)}</option>`).join('');
    sel.dataset.ready = '1';
    sel.value = '163';
    applyMailProviderPreset();
  }

  function applyMailProviderPreset() {
    const p = (mailProviders || {})[$('maProvider').value] || {};
    $('maNote').textContent = p.note || '';
    $('maImapHost').value = p.imapHost || '';
    $('maImapPort').value = p.imapPort || 993;
    $('maImapSecure').checked = p.imapSecure !== false;
    $('maSmtpHost').value = p.smtpHost || '';
    $('maSmtpPort').value = p.smtpPort || 465;
    $('maSmtpSecure').checked = p.smtpSecure !== false;
    $('maSelfSigned').checked = false;
  }

  function resetMailAccountForm() {
    mailMaEditId = null;
    $('maFormTitle').textContent = '添加邮箱账户';
    $('maLabel').value = '';
    $('maEmail').value = '';
    $('maPassword').value = '';
    $('maTestResult').classList.add('hidden');
    $('maProvider').value = '163';
    applyMailProviderPreset();
  }

  function fillMailAccountForm(acc) {
    if (!acc) return;
    mailMaEditId = acc.id;
    $('maFormTitle').textContent = `编辑账户：${acc.label || acc.email}`;
    $('maProvider').value = acc.provider || 'custom';
    if (!mailProviders || !mailProviders[acc.provider]) $('maProvider').value = 'custom';
    $('maLabel').value = acc.label || '';
    $('maEmail').value = acc.email || '';
    $('maPassword').value = '';
    $('maPassword').placeholder = acc.hasPassword ? '留空表示不修改授权码' : '请输入授权码';
    $('maImapHost').value = acc.imapHost || '';
    $('maImapPort').value = acc.imapPort || 993;
    $('maImapSecure').checked = acc.imapSecure !== false;
    $('maSmtpHost').value = acc.smtpHost || '';
    $('maSmtpPort').value = acc.smtpPort || 465;
    $('maSmtpSecure').checked = acc.smtpSecure !== false;
    $('maSelfSigned').checked = !!acc.allowSelfSigned;
    $('maNote').textContent = (mailProviders[acc.provider] || {}).note || '';
    $('maTestResult').classList.add('hidden');
  }

  function renderMaList() {
    const box = $('maList');
    if (!mailAccounts.length) {
      box.innerHTML = '<div class="ma-empty">还没有添加任何邮箱账户。在下方表单填写信息即可登录，支持同时添加多个邮箱。</div>';
      return;
    }
    box.innerHTML = mailAccounts.map((a) => `
      <div class="ma-item${a.id === mailMaEditId ? ' active' : ''}">
        <span class="mail-badge">${mailBadge(a.email)}</span>
        <div class="ma-item-info">
          <b>${esc(a.label || a.email)}</b>
          <span>${esc(a.email)}${a.imapHost ? ' · ' + esc(a.imapHost) : ''}${a.lastSyncAt ? ' · 最近收信 ' + esc(fmtMailFullDate(a.lastSyncAt)) : ''}</span>
        </div>
        <div class="ma-item-ops">
          <button class="tb-btn" data-ma-test="${a.id}">测试</button>
          <button class="tb-btn" data-ma-edit="${a.id}">编辑</button>
          <button class="tb-btn danger" data-ma-del="${a.id}">删除</button>
        </div>
      </div>`).join('');
  }

  async function openMailAccountModal(id) {
    await ensureMailProviders();
    renderMaProviderOptions();
    mailMaEditId = id || null;
    renderMaList();
    if (id) fillMailAccountForm(mailAccounts.find((a) => a.id === id));
    else resetMailAccountForm();
    renderMaList();
    $('maTestResult').classList.add('hidden');
    $('mailAccountModal').classList.remove('hidden');
  }

  function mailAccFormData() {
    return {
      provider: $('maProvider').value,
      label: $('maLabel').value.trim(),
      email: $('maEmail').value.trim(),
      password: $('maPassword').value,
      imapHost: $('maImapHost').value.trim(),
      imapPort: $('maImapPort').value.trim(),
      imapSecure: $('maImapSecure').checked,
      smtpHost: $('maSmtpHost').value.trim(),
      smtpPort: $('maSmtpPort').value.trim(),
      smtpSecure: $('maSmtpSecure').checked,
      allowSelfSigned: $('maSelfSigned').checked,
    };
  }

  async function testMailAccountForm() {
    const box = $('maTestResult');
    box.className = 'ma-test-result';
    box.classList.remove('hidden');
    box.textContent = '正在连接邮件服务器…';
    const btn = $('btnMaTest');
    btn.disabled = true;
    try {
      const r = await api('/api/mail/test', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(mailAccFormData()),
      });
      box.classList.add('ok');
      box.textContent = `✅ 连接成功：收件箱 ${r.inboxMessages} 封邮件，共 ${r.folderCount} 个文件夹`;
    } catch (e) {
      box.classList.add('err');
      box.textContent = '❌ ' + e.message;
    } finally {
      btn.disabled = false;
    }
  }

  async function saveMailAccountForm() {
    const data = mailAccFormData();
    const btn = $('btnMaSave');
    btn.disabled = true;
    const editingId = mailMaEditId;
    try {
      if (editingId) {
        await api('/api/mail/accounts/' + editingId, {
          method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data),
        });
      } else {
        const created = await api('/api/mail/accounts', {
          method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data),
        });
        mailMaEditId = created.id;
      }
      await loadMailAccounts();
      const targetId = editingId || mailMaEditId;
      resetMailAccountForm();
      renderMaList();
      renderMailSide();
      toast(editingId ? '账户已更新' : '账户已添加，正在连接邮箱…', 'success');
      await selectMailAccount(targetId);
    } catch (e) {
      toast(e.message, 'error');
    } finally {
      btn.disabled = false;
    }
  }

  // ---------- 写邮件 ----------
  function openMailCompose(to = '', subject = '') {
    if (!mailAccounts.length) {
      toast('请先添加一个邮箱账户', 'error');
      openMailAccountModal(null);
      return;
    }
    $('mcFrom').innerHTML = mailAccounts
      .map((a) => `<option value="${a.id}">${esc(a.label || a.email)}</option>`).join('');
    if (mailCur.accountId) $('mcFrom').value = mailCur.accountId;
    $('mcTo').value = to || '';
    $('mcCc').value = '';
    $('mcSubject').value = subject || '';
    $('mcBody').value = '';
    $('mailComposeModal').classList.remove('hidden');
    setTimeout(() => { if (!to) $('mcTo').focus(); else $('mcBody').focus(); }, 30);
  }

  async function sendMailCompose() {
    const id = $('mcFrom').value;
    const to = $('mcTo').value.trim();
    if (!to) return toast('请填写收件人', 'error');
    const btn = $('btnMcSend');
    btn.disabled = true;
    const old = btn.textContent;
    btn.textContent = '发送中…';
    try {
      await api(`/api/mail/accounts/${id}/send`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          to, cc: $('mcCc').value.trim(),
          subject: $('mcSubject').value.trim(), text: $('mcBody').value,
        }),
      });
      $('mailComposeModal').classList.add('hidden');
      toast('邮件已发送', 'success');
    } catch (e) {
      toast('发送失败：' + e.message, 'error');
    } finally {
      btn.disabled = false;
      btn.textContent = old;
    }
  }

  // ---------- 邮箱事件绑定 ----------
  function bindMailEvents() {
    $('btnMailManage').addEventListener('click', () => openMailAccountModal(null));
    $('btnMailCompose').addEventListener('click', () => openMailCompose());
    $('btnMailRefresh').addEventListener('click', async () => {
      if (!mailCur.accountId) { toast('请先添加邮箱账户', 'error'); return; }
      await ensureMailFolders(mailCur.accountId, true);
      await loadMailMessages();
      toast('已刷新', 'success');
    });
    $('btnMailMarkAllRead').addEventListener('click', markAllMailSeen);

    $('mailSearch').addEventListener('keydown', (e) => {
      if (e.key !== 'Enter') return;
      if (!mailCur.accountId) return;
      mailCur.search = $('mailSearch').value.trim();
      mailCur.page = 1;
      loadMailMessages();
    });
    $('mailSearch').addEventListener('input', (e) => {
      if (!e.target.value && mailCur.search && mailCur.accountId) {
        mailCur.search = '';
        mailCur.page = 1;
        loadMailMessages();
      }
    });

    $('mailAccounts').addEventListener('click', (e) => {
      const a = e.target.closest('[data-acc]');
      if (a) selectMailAccount(a.dataset.acc);
    });
    $('mailFolders').addEventListener('click', (e) => {
      const f = e.target.closest('[data-folder]');
      if (f) openMailFolder(mailCur.accountId, f.dataset.folder, f.dataset.foldername, 1);
    });
    $('mailList').addEventListener('click', (e) => {
      if (e.target.closest('[data-mail-retry]')) { loadMailMessages(); return; }
      if (e.target.closest('#btnMailGuideAdd')) { openMailAccountModal(null); return; }
      const item = e.target.closest('[data-mail]');
      if (item) openMailMessage(Number(item.dataset.mail));
    });
    $('mailPager').addEventListener('click', (e) => {
      const b = e.target.closest('[data-mail-page]');
      if (!b) return;
      const pages = Math.max(1, Math.ceil(mailTotal / mailCur.pageSize));
      if (b.dataset.mailPage === 'prev' && mailCur.page > 1) { mailCur.page--; loadMailMessages(); }
      if (b.dataset.mailPage === 'next' && mailCur.page < pages) { mailCur.page++; loadMailMessages(); }
    });
    $('mailPager').addEventListener('change', (e) => {
      if (e.target.id === 'mailPageSize') {
        mailCur.pageSize = parseInt(e.target.value, 10) || 25;
        mailCur.page = 1;
        loadMailMessages();
      }
    });
    $('mailDetail').addEventListener('click', (e) => {
      if (!mailDetail) return;
      if (e.target.closest('[data-mail-translate]')) return mailTranslateBody();
      if (e.target.closest('[data-mail-trans-close]')) { mailTrans = null; renderMailDetail(); return; }
      if (e.target.closest('[data-mail-trans-copy]')) {
        const txt = mailTrans?.text || '';
        if (!txt) { toast('还没有译文可复制', 'error'); return; }
        navigator.clipboard.writeText(txt).then(() => toast('译文已复制', 'success')).catch(() => toast('复制失败', 'error'));
        return;
      }
      if (e.target.closest('[data-mail-reply]')) {
        const subj = /^re:/i.test(mailDetail.subject) ? mailDetail.subject : 'Re: ' + mailDetail.subject;
        openMailCompose(mailDetail.fromAddress, subj);
      } else if (e.target.closest('[data-mail-unread]')) markMailUnread();
      else if (e.target.closest('[data-mail-del]')) removeMailMessage();
    });

    // 账户管理弹窗
    $('btnMaClose').addEventListener('click', () => $('mailAccountModal').classList.add('hidden'));
    $('btnMaCancel').addEventListener('click', () => { resetMailAccountForm(); renderMaList(); });
    $('btnMaSave').addEventListener('click', saveMailAccountForm);
    $('btnMaTest').addEventListener('click', testMailAccountForm);
    $('maProvider').addEventListener('change', () => {
      $('maTestResult').classList.add('hidden');
      applyMailProviderPreset();
    });
    $('maList').addEventListener('click', async (e) => {
      const ed = e.target.closest('[data-ma-edit]');
      const del = e.target.closest('[data-ma-del]');
      const ts = e.target.closest('[data-ma-test]');
      if (ed) { fillMailAccountForm(mailAccounts.find((a) => a.id === ed.dataset.maEdit)); renderMaList(); return; }
      if (ts) {
        const box = $('maTestResult');
        box.className = 'ma-test-result';
        box.classList.remove('hidden');
        box.textContent = '正在连接邮件服务器…';
        try {
          const r = await api(`/api/mail/accounts/${ts.dataset.maTest}/test`, { method: 'POST' });
          box.classList.add('ok');
          box.textContent = `✅ 连接成功：收件箱 ${r.inboxMessages} 封邮件，共 ${r.folderCount} 个文件夹`;
        } catch (err) {
          box.classList.add('err');
          box.textContent = '❌ ' + err.message;
        }
        return;
      }
      if (del) {
        const acc = mailAccounts.find((a) => a.id === del.dataset.maDel);
        if (!acc) return;
        if (!confirm(`确认删除邮箱账户「${acc.label || acc.email}」？\n（仅从本软件移除，不会影响邮箱里的邮件）`)) return;
        try {
          await api('/api/mail/accounts/' + acc.id, { method: 'DELETE' });
          await loadMailAccounts();
          if (mailCur.accountId === acc.id) {
            mailCur = { accountId: '', folder: 'INBOX', folderName: '收件箱', page: 1, pageSize: mailCur.pageSize, search: '' };
            mailFolders = []; mailFoldersOwner = ''; mailMessages = []; mailTotal = 0; mailDetail = null;
            renderMailView();
          }
          if (mailMaEditId === acc.id) resetMailAccountForm();
          renderMaList();
          renderMailSide();
          toast('账户已移除', 'success');
        } catch (err) { toast(err.message, 'error'); }
      }
    });

    // 写邮件弹窗
    $('btnMcClose').addEventListener('click', () => $('mailComposeModal').classList.add('hidden'));
    $('btnMcCancel').addEventListener('click', () => $('mailComposeModal').classList.add('hidden'));
    $('btnMcSend').addEventListener('click', sendMailCompose);
  }

  // 进入邮箱视图（首次进入时懒加载账户，避免拖慢启动）
  async function enterMailView() {
    renderMailView();
    if (mailInited) return;
    mailInited = true;
    try {
      await ensureMailProviders();
      renderMaProviderOptions();
      await loadMailAccounts();
    } catch (e) {
      toast('读取邮箱账户失败：' + e.message, 'error');
    }
    renderMailView();
    if (mailAccounts.length && !mailCur.accountId) await selectMailAccount(mailAccounts[0].id);
  }


  /* ---- 本项目的入口：渲染这一页 → 绑事件 → 拉账户 ---- */
  async function renderMail(m){
    m.innerHTML = MAIL_HTML;
    bindMailEvents();
    await enterMailView();
    startMailNotify();
  }

/* ---------------- 知识库（Obsidian Vault 看板） ----------------
   版式/口径照 Baixiao-Reading-Cockpit（未读/在读/已读 + 吸收状态、年度热力、阅读完成率、状态写回笔记）；
   路径与写回边界照科研工作台的 obsidian 集成（服务端校验，永不写 .obsidian/，只改 frontmatter 那几个键）。
   Vault 路径存 localStorage：rw-vault。 */
const KB_READING = ["未读", "在读", "已读"];
const KB_ABSORB = ["待沉淀", "已沉淀", "无需沉淀"];
const KB_TABS = [["all", "全部"], ["today", "今日新增"], ["unread", "未读"], ["reading", "在读"], ["pending", "待沉淀"], ["long", "长期未读"]];
let kb = { vault: localStorage.getItem("rw-vault") || "", data: null, err: "", busy: false,
           tab: "all", folder: "", q: "", active: "", tip: "" };

async function renderLibrary(m){
  m.innerHTML = kbShell();
  kbBind(m);
  if(kb.vault && !kb.data && !kb.busy) kbLoad();
  kbPapers(m);
}

async function kbLoad(){
  if(!kb.vault) return;
  kb.busy = true; kb.err = ""; kbRender();
  try{
    kb.data = await api("/api/vault/scan?vault=" + encodeURIComponent(kb.vault), {method:"GET"});
    if(!kb.active || !kb.data.notes.some(n=>n.path===kb.active)) kb.active = kb.data.notes[0] ? kb.data.notes[0].path : "";
  }catch(e){ kb.err = e.message; kb.data = null; }
  kb.busy = false; kbRender();
}

function kbDom(){ return $("main"); }
function kbRender(){ const m = kbDom(); if(!m || !m.querySelector(".kb-page")) return; m.innerHTML = kbShell(); kbBind(m); }
function kbState(cls, text){ return `<span class="kb-state kb-${cls}">${esc(text)}</span>`; }
function kbFmt(iso){ return iso ? esc(iso) : "—"; }
function kbToday(){ return new Date().toLocaleDateString("sv-SE"); }

function kbFiltered(){
  if(!kb.data) return [];
  let ns = kb.data.notes.slice();
  if(kb.folder) ns = ns.filter(n=>n.rootFolder === kb.folder);
  const t = kbToday();
  if(kb.tab === "today") ns = ns.filter(n=>n.createdFromFrontmatter && n.created === t);
  else if(kb.tab === "unread") ns = ns.filter(n=>n.reading === "未读");
  else if(kb.tab === "reading") ns = ns.filter(n=>n.reading === "在读");
  else if(kb.tab === "pending") ns = ns.filter(n=>n.reading === "已读" && n.absorption === "待沉淀");
  else if(kb.tab === "long") ns = ns.filter(n=>n.reading === "未读" && n.created < new Date(Date.now()-30*864e5).toLocaleDateString("sv-SE"));
  const q = kb.q.trim().toLowerCase();
  if(q) ns = ns.filter(n=>(n.title + " " + n.path + " " + n.tags.join(" ")).toLowerCase().includes(q));
  return ns;
}

function kbStat(id, label, value, caption, ico, slim){
  return `<article class="kb-stat kb-fluid-stat${slim?" kb-slim":""}" data-fluid-card="${id}">
    <canvas class="kb-fluid-canvas" aria-hidden="true"></canvas>
    <div class="kb-fluid-noise" aria-hidden="true"></div>
    <div class="kb-fluid-fallback" aria-hidden="true"></div>
    <div class="kb-stat-content"><div class="kb-stat-t">${esc(label)}</div>
    <div><span class="kb-stat-v">${value}</span><span class="kb-stat-u">篇笔记</span></div>
    <div class="kb-stat-c">${esc(caption)}</div><span class="kb-stat-i">${ico}</span></div></article>`;
}

/* 环绕卡的目录 = Vault 根目录聚合（照参考的 folders()：按篇数排序，最多 6 张） */
function kbFolders(){
  if(!kb.data) return [];
  const m = new Map();
  kb.data.notes.forEach(n=>{ const k = n.rootFolder || "根目录";
    const c = m.get(k) || {name:k, total:0, unread:0};
    c.total++; if(n.reading === "未读") c.unread++; m.set(k, c); });
  return [...m.values()].sort((a,b)=>b.total - a.total);
}

function kbShell(){
  const d = kb.data, st = d ? d.stats : null;
  const name = kb.vault ? kb.vault.replace(/[\\/]+$/, "").split(/[\\/]/).pop() : "";
  const head = `<header class="kb-head">
    <div><h2>知识库</h2><p>未读识别 · 阅读推进 · 知识沉淀</p></div>
    <div class="kb-actions">
      <label class="kb-search">⌕<input id="kbQ" placeholder="搜索笔记、目录或标签…" value="${esc(kb.q)}"></label>
      <button class="btn" id="kbFolder">${kb.folder ? "⌁ " + esc(kb.folder) : "⌁ 全部目录"}</button>
      <button class="btn" id="kbVault">选择 Vault</button>
      <button class="btn btn-primary" id="kbScan">${kb.busy ? "扫描中…" : "＋ 立即扫描"}</button>
    </div></header>`;
  const vault = kb.vault
    ? `<div class="kb-vault"><span class="kb-vault-i">◈</span><b>${esc(d ? d.name : name)}</b>
       <span class="kb-path" title="${esc(kb.vault)}">${esc(kb.vault)}</span>
       ${d ? `<span class="kb-vault-n">${d.notes.length} 篇${d.skipped ? ` · 跳过 ${d.skipped}` : ""}</span>` : ""}</div>`
    : `<div class="kb-vault kb-empty">还没有授权 Vault —— 点右上「选择 Vault」挑一个 Obsidian 库目录。<span class="muted">只读/只写你库里的 Markdown frontmatter，永不碰 .obsidian/</span></div>`;
  if(kb.err) return `<div class="kb-page">${head}${vault}<div class="card kb-err">扫描失败：${esc(kb.err)}</div></div>`;
  if(!kb.vault) return `<div class="kb-page">${head}${vault}</div>`;
  if(!d) return `<div class="kb-page">${head}${vault}<div class="card kb-load">正在扫描 Vault…</div></div>`;

  const ns = kbFiltered();
  const list = ns.length ? ns.map(n=>`<button class="kb-row${n.path===kb.active?" on":""}" data-note="${esc(n.path)}">
      <span class="kb-row-t" title="${esc(n.path)}">${esc(n.title)}</span>
      <span class="kb-row-f">${esc(n.folder)}</span>
      ${kbState("r"+KB_READING.indexOf(n.reading), n.reading)}
      ${n.reading==="已读" ? kbState("a"+KB_ABSORB.indexOf(n.absorption), n.absorption) : ""}
      <span class="kb-row-d">${kbFmt(n.created)}</span></button>`).join("")
    : `<div class="hint">当前筛选下没有笔记。</div>`;

  const folders = [...new Set(d.notes.map(n=>n.rootFolder).filter(Boolean))].sort();
  const stats = `<section class="kb-stats">
    ${kbStat("today", "今日新增", st.todayAdded, "按 frontmatter 创建日期", "▣")}
    ${kbStat("unread", "未读库存", st.unread, "全库实时统计", "〽")}
    ${kbStat("read", "已经阅读", st.read, "全库实时统计", "✓")}
    ${kbStat("backlog", "长期未读", st.longUnread, "超过 30 天的未读", "!", true)}</section>`;

  const board = `<section class="kb-board">
    <div class="card kb-queue">
      <div class="kb-sec-head"><b>阅读队列</b><span>真实数据 · ${ns.length}/${d.notes.length} 篇</span></div>
      <div class="kb-tabs">${KB_TABS.map(([k,label])=>`<button class="kb-tab${kb.tab===k?" on":""}" data-tab="${k}">${esc(label)}</button>`).join("")}</div>
      <div class="kb-list">${list}</div>
      <div class="kb-foot">全库 ${d.notes.length} 篇 · 待沉淀 ${st.pending} 篇 · 词数合计 ${st.words.toLocaleString()}${folders.length?` · 目录 ${folders.length} 个`:""}</div>
    </div>
    ${kbVisual(st)}
    <div class="kb-side">${kbDetail()}</div></section>`;

  const heat = `<section class="card kb-heat">${kbHeat()}</section>`;
  const pdf = `<section class="card" id="kbPapers"><h3>本项目已入库 PDF</h3><div class="hint">加载中…</div></section>`;
  return `<div class="kb-page">${head}${vault}${stats}${board}${heat}${pdf}</div>`;
}

function kbDetail(){
  const n = kb.data ? kb.data.notes.find(x=>x.path===kb.active) : null;

  const opts = (list, cur) => list.map(v=>`<option value="${v}"${v===cur?" selected":""}>${v}</option>`).join("");
  return `<div class="card kb-detail">
    <div class="kb-detail-head"><span>✦ 智能详情</span><span class="muted">本机数据</span></div>

function kbHeat(){
  const days = kb.data.days;
  const maxAdded = Math.max(1, ...days.map(d=>d.added)), maxRead = Math.max(1, ...days.map(d=>d.read));
  const lv = (v, max) => v ? (v/max > .66 ? 2 : 1) : 0;
  const first = (new Date(days[0].date + "T12:00:00").getDay() + 6) % 7;      // 周一 = 0
  const empty = Array.from({length:first}, ()=>`<span class="kb-heat-empty"></span>`).join("");
  const today = kbToday();
  const cells = days.map(d=>`<button class="kb-heat-cell${d.date===today?" is-today":""}" data-d="${d.date}"
      data-added="${d.added}" data-read="${d.read}" data-pending="${d.pending}"
      ${d.added||d.read?`data-lv="${lv(d.added,maxAdded)}" data-rv="${lv(d.read,maxRead)}"`:""}
      aria-label="${d.date}：新增 ${d.added}，已读 ${d.read}，待沉淀 ${d.pending}"></button>`).join("");
  const months = days.filter((d,i)=>i===0 || d.date.slice(8)==="01" || i===days.length-1)
      .map(d=>`<span>${Number(d.date.slice(5,7))}月</span>`).join("");
  const last = days[days.length-1];
  return `<div class="kb-heat-head"><div><b>阅读时间轴</b><small>近一年 · 真实阅读行为</small></div>
      <time>${today}</time><button class="kb-heat-today" id="kbHeatToday">回到今日</button></div>
    <div class="kb-heat-line">今日新增：<strong>${last.added}</strong> 篇　<i></i>　全库总计：${kb.data.stats.total} 篇　<i></i>　已读：${kb.data.stats.read} 篇　<i></i>　待沉淀：${kb.data.stats.pending} 篇　<i></i>　未读积压：${kb.data.stats.unread} 篇</div>
    <div class="kb-heat-scroll"><div class="kb-heat-grid">${empty}${cells}</div></div>
    <div class="kb-heat-months">${months}</div>
    <div class="kb-heat-legend"><span class="kb-lg">无操作</span><span class="kb-lg" data-lv="1">仅新增</span><span class="kb-lg" data-lv="2">高新增</span><span class="kb-lg" data-rv="1">少量已读</span><span class="kb-lg" data-rv="2">高阅读量</span></div>
    <div class="kb-heat-tip" id="kbHeatTip">${kb.tip ? esc(kb.tip) : "鼠标移到格子上看当天明细"}</div>`;
}

  if(!box) return;
  if(!curTask){ box.innerHTML = `<h3>本项目已入库 PDF</h3><div class="hint">先在上面「项目」里选一个项目，这里会列它的 PDF 与检索结果。</div>`; return; }

    box.innerHTML = `<h3>本项目已入库 PDF <span class="pill">${(d.paper_list||[]).length}</span></h3>
      ${(d.paper_list||[]).length ? `<table><tr><th>文件名</th><th>页数</th><th>入库时间</th></tr>
        ${d.paper_list.map(p=>`<tr><td>${esc(p.filename)}</td><td class="muted">${p.pages||0}</td><td class="muted">${fmtDate(p.created_at)}</td></tr>`).join("")}</table>`
        : `<div class="hint">这个项目还没入库 PDF，去「工作流 · 下载精读」下几篇。</div>`}`;

function kbBind(m){
  const on = (sel, ev, fn) => m.querySelector(sel) && m.querySelector(sel).addEventListener(ev, fn);
  on("#kbVault", "click", kbPickVault);
  on("#kbScan", "click", kbLoad);
  on("#kbFolder", "click", ()=>{ const fs = [...new Set(kb.data.notes.map(n=>n.rootFolder).filter(Boolean))].sort();
      const i = fs.indexOf(kb.folder); kb.folder = i >= fs.length-1 ? "" : fs[i+1] || ""; kbRender(); });
  on("#kbQ", "input", e=>{ kb.q = e.target.value; const list = m.querySelector(".kb-list");
      if(!list) return; const keep = document.activeElement;
      m.innerHTML = kbShell(); kbBind(m);
      const q = m.querySelector("#kbQ"); if(q){ q.value = kb.q; q.focus(); } });
  on("#kbHeatToday", "click", ()=>{ const sc = m.querySelector(".kb-heat-scroll"); if(sc) sc.scrollLeft = sc.scrollWidth; });
  m.querySelectorAll(".kb-tab").forEach(b=>b.addEventListener("click", ()=>{ kb.tab = b.dataset.tab; kbRender(); }));
  m.querySelectorAll(".kb-row").forEach(b=>b.addEventListener("click", ()=>{ kb.active = b.dataset.note; kbRender(); }));
  m.querySelectorAll(".kb-heat-cell").forEach(c=>{
    c.addEventListener("mouseenter", ()=>{ kb.tip = `${c.dataset.d}：新增 ${c.dataset.added}，已读 ${c.dataset.read}，待沉淀 ${c.dataset.pending}`;
        const t = m.querySelector("#kbHeatTip"); if(t) t.textContent = kb.tip; });
    c.addEventListener("click", ()=>{ const t = m.querySelector("#kbHeatTip"); if(t) t.textContent = kb.tip + "（已固定）"; });
  });
  const n = kb.data ? kb.data.notes.find(x=>x.path===kb.active) : null;
  m.querySelectorAll(".kb-sel").forEach(s=>s.addEventListener("change", ()=>kbWrite(n, s.dataset.field, s.value)));
  on("#kbOpen", "click", ()=>api("/api/vault/open", {vault:kb.vault, path:kb.active}).catch(e=>alert(e.message)));
  on("#kbNext", "click", ()=>n && kbWrite(n, "阅读状态", n.reading==="未读" ? "在读" : n.reading==="在读" ? "已读" : "未读"));
  on("#kbAbsorb", "click", ()=>n && kbWrite(n, "吸收状态", n.absorption==="待沉淀" ? "已沉淀" : "待沉淀"));
  const cycleFolder = ()=>{ const fs = kbFolders().map(f=>f.name); const i = fs.indexOf(kb.folder);
      kb.folder = i >= fs.length-1 ? "" : (fs[i+1] || ""); kbRender(); };
  on("#kbFolder", "click", cycleFolder);
  if(window.KB3D){
    KB3D.fluid(m);
    KB3D.orbit(m, { folders: kbFolders(), onCycle: cycleFolder,
      onPick: name=>{ kb.folder = (kb.folder === name ? "" : name); kbRender(); } });
  }
}

async function kbWrite(n, field, value){
  if(!n) return;
  try{
    const d = await api("/api/vault/status", {vault:kb.vault, path:n.path, field, value});
    kb.data = d; kbRender();
  }catch(e){ alert("写回失败：" + e.message); }
}

async function kbPickVault(){
  const r = await api("/api/folder/pick?title=" + encodeURIComponent("选择 Obsidian Vault（知识库根目录）") +
                      "&initial=" + encodeURIComponent(kb.vault || ""), {method:"GET"}).catch(e=>({error:e.message}));
  if(!r || r.error) return alert("打开文件夹选择框失败：" + ((r && r.error) || "未知"));
  if(!r.dir) return;
  kb.vault = r.dir; localStorage.setItem("rw-vault", r.dir);
  kb.data = null; kb.active = ""; kb.err = ""; kbRender(); kbLoad();
}


/* ---------------- 笔记（大笔记：照抄 lit 的 Markdown 笔记，不绑项目） ---------------- */
let mdNotes=[], mdActiveId=null, mdSaveTimer=null, mdLoaded=false, mdFocusOn=false, mdNarrowOn=false, mdFocusPrev="split";

function markdownNoteClean(html){
  return (window.DOMPurify && window.marked)
    ? window.DOMPurify.sanitize(html, {ADD_TAGS:["mark","math","semantics","annotation","mrow","mi","mo","mn","msup","msub","mfrac","mspace","mtext"],
        ADD_ATTR:["align","style","target","rel","encoding","xmlns","aria-hidden"]})
    : html;
}
function renderMarkdown(value){
  const source = String(value||"");
  if(!window.marked || !window.marked.parse) return esc(source).replace(/\n/g,"<br />");
  try{ return markdownNoteClean(window.marked.parse(source)); }
  catch(e){ return esc(source).replace(/\n/g,"<br />"); }
}
function mdActive(){ return mdNotes.find(n=>n.id===mdActiveId) || null; }
const mdTaskName = (id)=> (S.tasks||[]).find(t=>t.id===id)?.title || "";
function mdPaintList(){
  const box=$("mdNoteList"); if(!box) return;
  const q = ($("mdNoteSearch")?.value||"").trim().toLowerCase();
  const list = mdNotes.filter(n=>!q || `${n.title} ${n.content}`.toLowerCase().includes(q));
  box.innerHTML = list.length ? list.map(n=>`<div class="md-note-item${n.id===mdActiveId?" active":""}" data-md-note="${n.id}">
      <b>${esc(n.title||"未命名笔记")}</b>${n.task_id?`<em class="md-bind">📁 ${esc(mdTaskName(n.task_id)||"已绑项目")}</em>`:""}<span>${fmtDate(n.updated_at)}</span></div>`).join("")
    : `<div class="hint" style="padding:8px">没有匹配的笔记</div>`;
}
function mdPaintPreview(){ const p=$("mdPreview"); if(p) p.innerHTML = renderMarkdown($("mdSource")?.value||""); }
function mdPaint(){
  mdPaintList();
  const note = mdActive();
  $("mdEmpty").classList.toggle("hidden", !!note);
  $("mdEditorShell").classList.toggle("hidden", !note);
  if(!note) return;
  $("mdNoteTitle").value = note.title || "未命名笔记";
  $("mdSource").value = note.content || "";
  mdPaintTaskSel(note);                              // 「绑定项目」下拉（空=不绑）
  $("mdSaveState").textContent = "";
  mdPaintPreview();
}
function mdPaintTaskSel(note){
  const sel = $("mdTask"); if(!sel) return;
  const html = `<option value="">不绑定项目</option>` +
    (S.tasks||[]).map(t=>`<option value="${t.id}">${esc(t.title)}</option>`).join("");
  if(sel.dataset.sig !== html){ sel.innerHTML = html; sel.dataset.sig = html; }   // 只在项目列表变了才重建，别把展开的下拉收掉
  sel.value = note.task_id || "";
}
function mdFocus(on, silent){
  /* 专注模式：左栏/工具栏都收掉，正文变一长列居中（读论文时放旁边随手记）。
     进入时顺手折叠左侧导航；Esc / 「退出专注」回来。 */
  mdFocusOn = !!on;
  const v = $("mdView"); if(!v) return;
  const ws = $("mdWorkspace");
  if(mdFocusOn){
    mdFocusPrev = (ws?.className||"").replace("md-workspace","").trim() || "split";
    if(ws) ws.className = "md-workspace write";
    if(!sidebarCollapsed){ sidebarCollapsed = true; localStorage.setItem("rw-sidebar","true"); renderSidebar(); }
  }else{
    if(ws) ws.className = "md-workspace " + mdFocusPrev;
    $("mdToolbar")?.querySelectorAll("[data-md-mode]").forEach(x=>x.classList.toggle("active", x.dataset.mdMode===mdFocusPrev));
  }
  v.classList.toggle("focus", mdFocusOn);
  if(!silent) localStorage.setItem("rw-md-focus", mdFocusOn ? "true" : "false");
}
async function mdNarrow(){
  /* 窄栏 = 整扇窗一张白纸：服务端把窗口钉到右缘，页面上只留「笔记名 + 退出」。 */
  mdNarrowOn = !mdNarrowOn;
  const b = $("btnMdNarrow");
  try{
    await api("/api/win/" + (mdNarrowOn ? "narrow" : "wide"), {});
    $("mdView")?.classList.toggle("narrow", mdNarrowOn);
    document.body.classList.toggle("md-narrow", mdNarrowOn);       // 外壳（侧栏/标签/状态栏）也收掉
    if(b) b.textContent = mdNarrowOn ? "▯ 铺满" : "▯ 窄栏";
  }catch(e){ mdNarrowOn = !mdNarrowOn; mdFail(e, "切窄栏"); }        // 失败就把状态翻回去，别骗人
}
function mdFail(e, what){
  // 前端已更新、服务端还是旧的（接口 404）时最容易撞上：把话说清楚，别静默失败
  const hint = /not found|404/i.test(e?.message||"") ? "（服务端还是旧版本，重启一次「科研工作 1.0」）" : "";
  console.error("笔记操作失败:", what, e);
  alert(`${what}失败：${e.message}${hint}`);
}
async function mdLoad(){
  try{
    const d = await api("/api/mdnotes");
    mdNotes = d.notes||[]; mdLoaded = true;
  }catch(e){ mdNotes = []; mdLoaded = true; mdFail(e, "读取笔记"); }
  if(mdActiveId && !mdActive()) mdActiveId = null;
  if(!mdActiveId && mdNotes.length) mdActiveId = mdNotes[0].id;
  mdPaint();
}
async function mdNew(title="未命名笔记", content="", focusSource=false){
  try{
    if(mdActive()) await mdSave();
    const d = await api("/api/mdnotes/save",{title, content});
    mdNotes.unshift(d.note); mdActiveId = d.note.id;
    mdPaint();
    setTimeout(()=> (focusSource ? $("mdSource") : $("mdNoteTitle"))?.focus(), 30);
  }catch(e){ mdFail(e, "新建笔记"); }
}
async function mdSave(){
  clearTimeout(mdSaveTimer);
  const note = mdActive(); if(!note) return;
  const title = $("mdNoteTitle").value.trim() || "未命名笔记";
  const content = $("mdSource").value;
  const task_id = ($("mdTask")?.value) || "";
  $("mdSaveState").textContent = "保存中…";
  try{
    const d = await api("/api/mdnotes/save",{id:note.id, title, content, task_id});
    Object.assign(note, d.note);
    $("mdSaveState").textContent = "已保存";
    mdPaintList();
  }catch(e){ $("mdSaveState").textContent = "保存失败"; $("mdSaveState").title = e.message; console.error("笔记自动保存失败:", e); }
}
function mdScheduleSave(){
  const note = mdActive(); if(!note) return;
  note.title = $("mdNoteTitle").value.trim() || "未命名笔记";
  note.content = $("mdSource").value;
  note.task_id = ($("mdTask")?.value) || "";         // 绑定的项目（空=不绑）
  $("mdSaveState").textContent = "未保存";
  mdPaintPreview();
  clearTimeout(mdSaveTimer);
  mdSaveTimer = setTimeout(mdSave, 650);
}
function mdInsert(before, after="", placeholder=""){
  const ta=$("mdSource"), s=ta.selectionStart, e=ta.selectionEnd;
  ta.setRangeText(before + (ta.value.slice(s,e)||placeholder) + after, s, e, "end");
  ta.focus(); mdScheduleSave();
}
function mdPrefixLines(prefix, ordered=false){
  const ta=$("mdSource");
  const start = ta.value.lastIndexOf("\n", ta.selectionStart-1)+1;
  const nextNl = ta.value.indexOf("\n", ta.selectionEnd);
  const end = nextNl<0 ? ta.value.length : nextNl;
  const lines = ta.value.slice(start,end).split("\n");
  ta.setRangeText(lines.map((l,i)=>(ordered?`${i+1}. `:prefix)+l.replace(/^(?:#{1,6}|[-*>]|\d+[.])\s+/,"")).join("\n"), start, end, "select");
  ta.focus(); mdScheduleSave();
}
function mdCmd(command, value=""){
  if(!$("mdSource")) return;
  if(command==="heading") return mdPrefixLines(value?"#".repeat(Number(value))+" ":"");
  if(command==="bold") return mdInsert("**","**","加粗文字");
  if(command==="italic") return mdInsert("*","*","斜体文字");
  if(command==="highlight") return mdInsert("<mark>","</mark>","高亮文字");
  if(command==="align"&&value) return mdInsert(`<div align="${value}">\n`,"\n</div>","对齐内容");
  if(command==="font"&&value) return mdInsert(`<span style="font-family: ${value}">`,"</span>","文字");
  if(command==="size"&&value) return mdInsert(`<span style="font-size: ${value}">`,"</span>","文字");
  if(command==="ul") return mdPrefixLines("- ");
  if(command==="ol") return mdPrefixLines("", true);
  if(command==="quote") return mdPrefixLines("> ");
  if(command==="link") return mdInsert("[","](https://)","链接文字");
  if(command==="code") return mdInsert("```text\n","\n```","在这里输入代码");
  if(command==="formula") return mdInsert("$$\n","\n$$","E = mc^2");
  if(command==="table") return mdInsert("","","| 列 1 | 列 2 | 列 3 |\n| --- | --- | --- |\n| 内容 | 内容 | 内容 |");
}
async function mdImport(files){
  const input=[...(files||[])], list=input.filter(f=>/\.(?:md|markdown)$/i.test(f.name));
  if(!list.length) return alert("请导入 .md 或 .markdown 文件");
  let n=0;
  for(const f of list.slice(0,50)){
    if(f.size > 5*1024*1024) continue;
    try{
      const content=(await f.text()).replace(/^\uFEFF/,"");
      await mdNew(f.name.replace(/\.(?:md|markdown)$/i,"")||"导入笔记", content, true); n++;
    }catch(e){ alert(`无法读取「${f.name}」：${e.message}`); }
  }
  if(n) $("mdSaveState").textContent = `已导入 ${n} 篇`;
}
async function mdExport(fmt){
  const note = mdActive(); if(!note) return;
  await mdSave();
  if(fmt==="pdf"){                                   // 走浏览器打印 → 另存为 PDF
    const w = window.open("", "_blank");
    if(!w) return alert("浏览器拦了打印窗口");
    w.document.write(`<title>${esc(note.title)}</title><link rel="stylesheet" href="/vendor/katex/katex.min.css">`
      + `<style>body{font:14px/1.75 "Microsoft YaHei",sans-serif;padding:32px;max-width:860px;margin:auto}`
      + `pre{background:#202124;color:#f4f5f7;padding:12px;border-radius:6px;overflow:auto}`
      + `table{border-collapse:collapse;width:100%}th,td{border:1px solid #ccc;padding:6px 9px}`
      + `blockquote{border-left:3px solid #888;margin:.8em 0;padding:.25em 1em;color:#444}</style>`
      + `<body>${renderMarkdown(note.content)}</body>`);
    w.document.close(); setTimeout(()=>{ w.focus(); w.print(); }, 350);
    return;
  }
  const blob = new Blob([note.content||""], {type:"text/markdown;charset=utf-8"});
  const url = URL.createObjectURL(blob), a = document.createElement("a");
  a.href=url; a.download = `${note.title||"note"}.md`; a.click();
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
}
function mdBind(m){
  if(!$("mdNoteList")) return;
  $("btnMdNew").onclick = ()=>mdNew();
  $("btnMdImport").onclick = ()=>$("mdFileInput").click();
  $("mdFileInput").onchange = (e)=>{ mdImport(e.target.files); e.target.value=""; };
  $("mdNoteSearch").oninput = mdPaintList;
  $("btnMdZotero").onclick = zotOpen;
  $("mdNoteList").onclick = (e)=>{
    const it = e.target.closest("[data-md-note]");
    if(!it || it.dataset.mdNote===mdActiveId) return;
    mdSave().then(()=>{ mdActiveId = it.dataset.mdNote; mdPaint(); });
  };
  $("mdSource").oninput = mdScheduleSave;
  $("mdNoteTitle").oninput = mdScheduleSave;
  $("mdTask").onchange = ()=>{ const b=$("mdTask"); const n=mdActive(); if(!n) return;
    n.task_id = b.value; mdPaintList(); mdSave(); };      // 换绑定立刻落库，列表上的胶囊跟着走
  $("mdToolbar").onclick = (e)=>{

function zotRowHTML(it){

  $("zotList").innerHTML = ""; $("zotCount").textContent = ""; $("zotCollection").innerHTML = "";
  try{

    $("zotStatus").textContent = st.message || "";

    const cols = await api("/api/zotero/collections");
    $("zotCollection").innerHTML = `<option value="">全库（按修改时间）</option>` +
      (cols.collections || []).map(c=>`<option value="${esc(c.key)}">${esc(c.name)}（${c.count}）</option>`).join("");

async function zotLoad(reset){
  if(reset) zotStart = 0;
  const qs = new URLSearchParams({ collection: $("zotCollection").value,
    q: $("zotQuery").value.trim(), start: String(zotStart), limit: "30" });
  const d = await api("/api/zotero/items?" + qs.toString());
  zotRows = reset ? (d.items || []) : zotRows.concat(d.items || []);
  zotMore = !!d.hasMore; zotStart = zotRows.length;
  $("zotCount").textContent = (d.total != null) ? (zotRows.length + "/" + d.total + " 条") : (zotRows.length + " 条");
  $("zotList").innerHTML = zotRows.length
    ? zotRows.map(zotRowHTML).join("") + (zotMore ? `<button class="btn ghost" id="zotMore" style="margin:8px">加载更多</button>` : "")
    : `<div class="hint" style="padding:8px">没有匹配的条目</div>`;
  const more = $("zotMore"); if(more) more.onclick = ()=>zotLoad(false).catch(e=>mdFail(e,"加载更多"));

async function zotImport(key){
  try{
    const d = await api("/api/zotero/note?key=" + encodeURIComponent(key));
    zotClose();
    await mdNew(d.title || "Zotero 条目", d.content || "", true);   // 复用原有新建流程
  }catch(e){ mdFail(e, "导入 Zotero 条目"); }
}
function zotBind(){

  $("btnZotClose").onclick = zotClose;
  $("btnZotClose2").onclick = zotClose;
  $("zotCollection").onchange = ()=>zotLoad(true).catch(e=>mdFail(e,"读条目"));
  $("zotSearch").onclick = ()=>zotLoad(true).catch(e=>mdFail(e,"搜索"));
  $("zotQuery").onkeydown = (e)=>{ if(e.key === "Enter") zotLoad(true).catch(err=>mdFail(err,"搜索")); };

function spBind(d){
  const tmApi = async (path, body, what)=>{
    try{ await api(path, body); }catch(e){ alert((what||"操作")+"失败："+e.message); return false; }
    spTeam = null; render(); return true;
  };
  const g = (id)=>$(id);
  if(g("tmAdd")) g("tmAdd").onclick = ()=>{
    const name=(g("tmName").value||"").trim(); if(!name) return alert("先写个名字");
    tmApi("/api/team/member/add", {id:curTask, name, step:g("tmStep").value, prompt:(g("tmPrompt").value||"").trim()}, "加成员");
  };
  if(g("tmDo")) g("tmDo").onclick = ()=>{
    const member=g("tmAssignee").value, prompt=(g("tmTask").value||"").trim();
    if(!member) return alert("先加一个成员"); if(!prompt) return alert("要派什么活？");
    tmApi("/api/team/assign", {id:curTask, member, prompt, manual:true}, "派活");
  };
  if(g("tmRefresh")) g("tmRefresh").onclick = ()=>{ spTeam=null; render(); };
  if(g("tmTellLeader")) g("tmTellLeader").onclick = ()=>{
    const title=(spData&&spData.task&&spData.task.title)||"这个项目";
    openTab("agent");
    setTimeout(()=>{ const t=$("ask"); if(t){ t.value=`帮我给《${title}》的团队加一个擅长 ___ 的成员`; t.focus(); } }, 80);
  };
  document.querySelectorAll("[data-tm-assign]").forEach(b=>b.onclick=()=>{
    const a=g("tmAssignee"); if(a) a.value=b.dataset.tmAssign;
    const t=g("tmTask"); if(t){ t.scrollIntoView({block:"center",behavior:"smooth"}); t.focus(); }
  });
  document.querySelectorAll("[data-tm-rename]").forEach(b=>b.onclick=()=>{
    const cur=((spTeam&&spTeam.members)||[]).find(m=>m.id===b.dataset.tmRename)||{};
    const name=window.prompt("新名字：", cur.name||""); if(!name) return;
    tmApi("/api/team/member/update", {member_id:b.dataset.tmRename, name}, "改名");
  });
  document.querySelectorAll("[data-tm-del]").forEach(b=>b.onclick=()=>{
    if(!window.confirm("移除这个成员？（已派给它的任务会留在看板里）")) return;
    tmApi("/api/team/member/remove", {member_id:b.dataset.tmDel}, "移除成员");
  });
  document.querySelectorAll("[data-tm-open]").forEach(b=>b.onclick=()=>{
    spOpen = spOpen===b.dataset.tmOpen ? null : b.dataset.tmOpen; render();
  });
  document.querySelectorAll("[data-tm-cancel]").forEach(b=>b.onclick=()=>tmApi("/api/team/task/cancel", {row_id:b.dataset.tmCancel}, "取消"));
  document.querySelectorAll("[data-tm-retry]").forEach(b=>b.onclick=()=>tmApi("/api/team/task/retry", {row_id:b.dataset.tmRetry}, "重试"));
  const live = ((spTeam&&spTeam.counts)||{});
  if((live.queued||0)+(live.running||0) > 0){          // 有活在看板上就自己刷，别让人手点
    clearTimeout(window.__tmTick);
    window.__tmTick = setTimeout(()=>{ if(route()==="space" && spTab==="team"){ spTeam=null; render(); } }, 3000);
  }
  const go = (id, route)=>{ const b=$(id); if(b) b.onclick = ()=>openTab(route); };
  go("spToFlow","workflow"); go("spToNote","notes"); go("spToCal","calendar"); go("spToLib","library");
  const del = $("spDel");
  if(del) del.onclick = async ()=>{
    const t = d.task||{};
    if(!confirm(`删除项目「${t.title||""}」？\n它的文献、证据、笔记、会话、日程、步骤都会一起删掉，不可撤销。`)) return;
    try{ await api("/api/task/delete", {id: curTask}); }catch(e){ return alert("删除失败："+e.message); }
    curTask = null; localStorage.removeItem("rw-task"); await refreshState(false); openTab("tasks");
  };
}
async function renderSpace(m){

  if(spTab === "team" && !spTeam){
    try{ spTeam = await api("/api/team?id=" + encodeURIComponent(curTask)); }
    catch(e){ spTeam = { error: e.message }; }

  let d;

  catch(e){ m.innerHTML = `<div class="msg error">读取项目失败：${esc(e.message)}</div>`; return; }
  const t = d.task||{};
  const opts = (S.tasks||[]).map(x=>`<option value="${x.id}" ${x.id===curTask?"selected":""}>${esc(x.title)}</option>`).join("");

        <p>项目级聚合只读取已关联的本地数据；写操作回到各领域的 Command 和安全通道。归档可恢复，外部文件不会被删除。</p></div>

      <button class="btn ghost" id="spLeader">问全局 Leader →</button></div></div>

    <div class="card" style="margin-top:12px"><div class="hint" style="display:flex;gap:14px;flex-wrap:wrap">
      <span>项目 ID：${esc(curTask)}</span><span class="sp-stage">阶段：${esc(t.stage_now||"未开始")}</span><span>更新：${esc(spWhen(t.updated_at))}</span></div></div>
    <div id="spBody"></div>`;
  $("spPick").onchange = (e)=>{ curTask = e.target.value; localStorage.setItem("rw-task", curTask); spId = null; render(); };
  $("spFlow").onclick = ()=>openTab("workflow");
  const sl = $("spLeader"); if(sl) sl.onclick = ()=>openTab("agent");
  m.querySelectorAll("[data-sp-tab]").forEach(b=>b.onclick=()=>{ spTab = b.dataset.spTab; render(); });
  $("spBody").innerHTML = spBodyHTML(d);
  spBind(d);

  m.innerHTML = `<div class="card"><h3>模型与 Agent</h3>

/* ---- 主题：抄 zotero-lit-tool，一个「主色」推导整套配色（8 个预设 + 自定义色号） ---- */
const DEFAULT_THEME = "#176B87";
const THEME_PRESETS = [
  {name:"研究蓝",primary:"#176B87"},{name:"松柏绿",primary:"#28735D"},
  {name:"群青蓝",primary:"#315F9B"},{name:"珊瑚红",primary:"#C85C4A"},
  {name:"琥珀金",primary:"#A87518"},{name:"莓果红",primary:"#A94762"},
  {name:"理性紫",primary:"#70578F"},{name:"石墨灰",primary:"#52625B"},
  {name:"莫兰迪灰",primary:"#BFBEBD"},{name:"莫兰迪米驼",primary:"#D8D3C9"},
  {name:"灰调雾霾蓝",primary:"#99B9C6"},{name:"灰豆绿",primary:"#A9B4A1"},
  {name:"裸粉豆沙",primary:"#DAC5C3"},{name:"灰调香芋紫",primary:"#B7A9B3"},
];
function hexToHsl(hex){
  const m=String(hex||"").trim().match(/^#?([0-9a-f]{6})$/i); if(!m) return null;
  const n=parseInt(m[1],16), r=((n>>16)&255)/255, g=((n>>8)&255)/255, b=(n&255)/255;
  const max=Math.max(r,g,b), min=Math.min(r,g,b), d=max-min, l=(max+min)/2;
  let h=0; const s=d===0?0:d/(1-Math.abs(2*l-1));
  if(d!==0){ if(max===r) h=60*(((g-b)/d)%6); else if(max===g) h=60*((b-r)/d+2); else h=60*((r-g)/d+4); }
  if(h<0) h+=360;
  return {h,s:s*100,l:l*100};
}
function hslToHex(h,s,l){
  s/=100; l/=100;
  const k=n=>(n+h/30)%12, a=s*Math.min(l,1-l),
    f=n=>l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1))),
    to=x=>Math.round(255*x).toString(16).padStart(2,"0");
  return "#"+to(f(0))+to(f(8))+to(f(4));
}
function luminance(hex){
  const m=String(hex||"").match(/^#?([0-9a-f]{6})$/i); if(!m) return 0;
  const n=parseInt(m[1],16);
  const c=[(n>>16)&255,(n>>8)&255,n&255].map(v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4);});
  return .2126*c[0]+.7152*c[1]+.0722*c[2];
}
function currentPrimary(){ return localStorage.getItem("rw-primary") || DEFAULT_THEME; }
function contrastOn(hex, bg){                       // WCAG 对比度
  const a=luminance(hex), b=luminance(bg), hi=Math.max(a,b), lo=Math.min(a,b);
  return (hi+0.05)/(lo+0.05);
}
function applyTheme(primary){
  const c = hexToHsl(primary);
  if(!c){ alert("色值格式不正确，请输入如 #176B87 的色号"); return; }
  const dark = document.documentElement.dataset.theme==="dark", root=document.documentElement;
  // 深色底要提亮；浅色底用本色，但莫兰迪那种浅灰本色在白底上等于看不见 → 一档档压暗到看得清为止
  const lightAccent = (()=>{ let l=c.l, x=primary;
    while(l>20 && contrastOn(x,"#ffffff")<3.2){ l-=3; x=hslToHex(c.h,c.s,l); } return x; })();
  const accent = dark ? hslToHex(c.h, Math.min(100, c.s*0.9+12), Math.max(58, Math.min(78, c.l+30))) : lightAccent;
  root.style.setProperty("--accent", accent);
  root.style.setProperty("--accent-ink", luminance(accent) > 0.42 ? "#0d1218" : "#ffffff");
  root.style.setProperty("--side-bg", hslToHex(c.h, Math.min(100,c.s*0.3+8), dark ? 9 : 96));
  localStorage.setItem("rw-primary", primary);
}
function themeSwatches(compact){
  const cur=currentPrimary().toLowerCase();
  return THEME_PRESETS.map(t=>`<span class="sw ${compact?"doton":""} ${t.primary.toLowerCase()===cur?"sel":""}" data-p="${t.primary}"
    style="--c:${t.primary}" title="${t.name}（${t.primary}）">${compact?"":`<em>${t.name}</em>`}</span>`).join("");
}

/* ---------------- markdown 极简渲染 ---------------- */
function md(t){
  const html = esc(t||"")
    .replace(/^### (.*)$/gm,"<h3>$1</h3>").replace(/^## (.*)$/gm,"<h2>$1</h2>").replace(/^# (.*)$/gm,"<h1>$1</h1>")
    .replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/`([^`]+)`/g,"<code>$1</code>")
    .replace(/^\s*[-*] (.*)$/gm,"<li>$1</li>").replace(/\|(.+)\|/g,m=>m);
  return html.replace(/(<li>[\s\S]*?<\/li>)(?!\s*<li>)/g,"<ul>$1</ul>").replace(/\n{2,}/g,"<br>");
}

async function refreshState(rerender=true){
  const st = await api("/api/state");
  S.tasks=st.tasks; S.chats=st.chats||[]; S.assistants=st.assistants||[]; S.models=st.models; S.active=st.active; S.events=st.events;
  { const pv = await api("/api/providers"); S.providers=pv.providers; S.wires=pv.wires; S.default=pv.default; }
  if(!S.tools.length) S.tools = (await api("/api/tools")).tools;
  S.loaded=true;
  if(curTask && !S.tasks.some(t=>t.id===curTask)) curTask=null;
  if(!curTask && S.tasks.length){ curTask=S.tasks[0].id; localStorage.setItem("rw-task",curTask); }
  if(curChat && !S.chats.some(c=>c.id===curChat)){ curChat=null; localStorage.removeItem("rw-chat"); }
  if(rerender) render();
}

/* ---------------- 情报日报（RSS，来源固定 5 个；照科研工作台 features/intel-daily 的读侧：
     来源/关键词/年份三条件筛选 + 手动刷新） ---------------- */
let itSrc = "", itQ = "", itYear = "", itItems = [], itTotal = 0, itTimer = 0, itSources = [];

async function intelLoad(){
  const p = new URLSearchParams({ source: itSrc, q: itQ, year: itYear });
  const d = await api("/api/rss/items?" + p.toString());
  itItems = d.items || []; itTotal = d.total || 0;
}
async function intelLoadSrcs(){
  const d = await api("/api/rss/sources");
  itSources = d.sources || [];
  const opts = [`<option value="">全部来源</option>`].concat(
    itSources.map(s=>`<option value="${s.id}" ${s.id===itSrc?"selected":""}>${esc(s.title)}（${s.count}）</option>`)).join("");
  const sel = $("itSrc"); if(sel) sel.innerHTML = opts;
}
function intelPaintList(){
  const box = $("itList"); if(!box) return;
  const n = $("itCount"); if(n) n.textContent = `${itTotal} 条`;
  box.innerHTML = itItems.length ? itItems.map(r=>`
    <div class="it-row">
      <a class="it-t" href="${esc(r.link)}" target="_blank" rel="noreferrer">${esc(r.title)}</a>
      <div class="it-m">${esc(r.authors || "作者未知")} · ${esc((r.published_at || "").slice(0,10) || "日期未知")} · ${esc(r.source_title || "")}</div>
      ${r.summary ? `<div class="it-s">${esc(r.summary)}</div>` : ""}
    </div>`).join("")
    : `<div class="hint">${itTotal ? "暂无匹配条目，换个条件或清掉筛选。" : "还没有数据：点右上「刷新」抓一批。"}</div>`;
}
async function intelRefresh(){
  const btn = $("itGo"); if(!btn || btn.disabled) return;
  const msg = $("itMsg");
  btn.disabled = true; btn.textContent = "抓取中…";
  if(msg) msg.textContent = "正在抓取 5 个来源…";
  try{
    const r = await api("/api/rss/refresh", {});
    const fail = (r.failures || []).length ? `；失败 ${r.failures.length} 个（${r.failures.map(f=>f.title).join("、")}）` : "";
    if(msg) msg.textContent = `已抓取 ${r.fetched}/${r.sources} 个来源，新增 ${r.added} 条${fail}`;
    await intelLoadSrcs(); await intelLoad(); intelPaintList();
  }catch(e){ if(msg) msg.textContent = "刷新失败：" + e.message; }
  btn.disabled = false; btn.textContent = "刷新";
}
function intelFilterDebounced(){
  clearTimeout(itTimer);
  itTimer = setTimeout(async ()=>{
    try{ await intelLoad(); intelPaintList(); }
    catch(e){ const m = $("itMsg"); if(m) m.textContent = "查询失败：" + e.message; }
  }, 300);
}
async function renderIntel(m){
  m.innerHTML = `
    <div class="card intel">
      <div class="it-head"><h3>情报日报 <span class="pill" id="itCount">…</span></h3>
        <button class="btn" id="itGo">刷新</button></div>
      <div class="it-bar">
        <select id="itSrc" class="control"><option value="">全部来源</option></select>
        <input id="itQ" placeholder="关键词（标题 / 摘要 / 作者）">
        <input id="itYear" placeholder="年份" inputmode="numeric">
      </div>
      <div class="hint" id="itMsg"></div>
      <div class="it-list" id="itList"></div>
    </div>`;
  $("itGo").onclick = intelRefresh;
  $("itQ").oninput = (e)=>{ itQ = e.target.value.trim(); intelFilterDebounced(); };
  $("itYear").oninput = (e)=>{ itYear = e.target.value.trim(); intelFilterDebounced(); };
  $("itSrc").onchange = async (e)=>{ itSrc = e.target.value; await intelLoad(); intelPaintList(); };
  try{ await intelLoadSrcs(); await intelLoad(); }
  catch(e){ m.querySelector("#itList").innerHTML = `<div class="hint">读不到数据：${esc(e.message)}</div>`; return; }
  intelPaintList();
}

/* ---------------- 选文件 / 拖进来 ---------------- */
async function trUpload(files){
  const f = [...(files||[])].find(x=>/\.pdf$/i.test(x.name));
  if(!f) return trMsg("只认 PDF 文件");
  if(!curTask) return trMsg("先选一个项目 —— PDF 要入当前项目的文献库");
  trMsg("上传中… " + f.name);
  try{
    const r = await fetch(`/api/upload?name=${encodeURIComponent(f.name)}&task_id=${encodeURIComponent(curTask)}`,
                          {method:"POST", headers:{"Content-Type":"application/octet-stream"}, body:f});
    const a = await r.json(); if(a.error) throw new Error(a.error);
    if(!a.paper_id) return trMsg("入库失败：" + (a.ingest_error || "不是有效 PDF"));
    await trOpen(a.paper_id);
  }catch(e){ trMsg("上传失败：" + e.message); }
}
function trMsg(t){ const el=$("trMsg"); if(el) el.textContent = t || ""; }

async function trOpen(pid){
  TR.pid = pid; TR.dual = false; TR.note = null;
  trView("read");
  trSegActive("read");
  $("trPen")?.classList.add("hidden"); TR.hlOn = false;
  trDualOff();
  TR.job = null; TR.words = {}; TR.prog = 0; trStopPoll();
  trMeta();
  await trReader(pid);
  trHlLoad();
}

/* ---------------- 元数据 ---------------- */
async function trMeta(){
  const set = (id, v)=> $(id).textContent = (v && String(v).trim()) ? v : "暂无信息";
  const meta = $("trMeta");
  if(!TR.pid) return;
  meta.classList.add("busy");
  try{
    const d = await api(`/api/papermeta?id=${encodeURIComponent(TR.pid)}`);
    if(d.error) throw new Error(d.error);
    TR.meta = d;
    set("trDoi", d.doi); set("trTitle", d.title); set("trDate", d.published); set("trKw", d.keywords);
    $("trTitle").title = d.title || "";
  }catch(e){ meta.classList.add("err"); trMsg("元数据读取失败：" + e.message); }
  meta.classList.remove("busy");
}

/* ---------------- 阅读器（pdf.js，一个 pane 一套） ---------------- */
function trWorker(){
  if(window.pdfjsLib && !window.pdfjsLib.GlobalWorkerOptions.workerSrc)
    window.pdfjsLib.GlobalWorkerOptions.workerSrc = "/vendor/pdfjs/pdf.worker.min.js";
}
function trPaneEl(key){ return key === "b" ? $("trPaneB") : $("trPaneA"); }
function trScrollEl(key){ return trPaneEl(key)?.querySelector(".tr-scroll"); }

async function trReader(pid){
  if(!window.pdfjsLib){ trMsg("pdf.js 没加载"); return; }
  trWorker();
  const url = `/api/pdf?id=${encodeURIComponent(pid)}`;
  if(!TR.dual){                                   // 单栏：只留 A 栏（B 栏藏起来）
    $("trStage").classList.remove("dual");
    $("trStage").style.gridTemplateColumns = "";
    $("trPaneB").classList.add("hidden");
    $("trSplit").classList.add("hidden");
    const box = trScrollEl("a"); if(box) box.innerHTML = "";
    await trMount("a", url);
  }
}
async function trMount(key, url){
  const box = trScrollEl(key); if(!box) return;
  box.innerHTML = `<div class="tr-load">正在渲染…</div>`;
  try{
    const pdf = await window.pdfjsLib.getDocument({url}).promise;
    TR.pdfs = TR.pdfs || {}; TR.pdfs[key] = pdf;
    if(key === "a"){ TR.pages = pdf.numPages; $("trPick") && trFillPick(); }
    box.innerHTML = "";
    for(let n = 1; n <= pdf.numPages; n++){
      const page = await pdf.getPage(n);
      const vp = page.getViewport({scale: TR.scale});
      const el = document.createElement("div");
      el.className = "tr-page"; el.dataset.page = n;
      el.style.width = Math.round(vp.width) + "px";
      el.style.height = Math.round(vp.height) + "px";
      el.innerHTML = `<span class="tr-ph">第 ${n} 页</span>`;
      box.appendChild(el);
    }
    box.onscroll = ()=>{ if(!TR.raf){ TR.raf = requestAnimationFrame(()=>{ TR.raf = 0; trPaintNear(key); trPageNo(key); }); } };
    box.scrollTop = 0;
    trPaintNear(key);
    trPageNo(key);
  }catch(e){
    box.innerHTML = `<div class="tr-load err">PDF 打不开：${esc(e.message)}</div>`;
  }
}
function trPaintNear(key){
  /* 只画视口附近那几页（滚动时再补），不用 IntersectionObserver —— 在这个 WebView2 里它不触发实测 */
  const box = trScrollEl(key); if(!box) return;
  const top = box.scrollTop - 400, bot = box.scrollTop + box.clientHeight + 900;
  box.querySelectorAll(".tr-page").forEach(el=>{
    if(el.offsetTop + el.offsetHeight > top && el.offsetTop < bot) trPaint(key, +el.dataset.page, el);
  });
}
function trWords(key){
  /* 每个词的坐标从后端来（fitz），自己铺文字层：选中→荧光笔才有依据。
     两栏各自一份（a=原文 / b=译文），所以中文那栏也能划。 */
  TR.words = TR.words || {};
  if(TR.words[key]) return Promise.resolve(TR.words[key]);
  TR.words[key] = {};
  if(!TR.pid) return Promise.resolve({});
  const kind = key === "b" ? "mono" : "src";
  return api(`/api/pdftext?id=${encodeURIComponent(TR.pid)}&task=${encodeURIComponent(curTask||"")}&kind=${kind}`)
    .then(d=>{ const m = TR.words[key] = {}; (d.pages||[]).forEach(p=>{ m[p.n] = p.words || []; }); return m; })
    .catch(()=>TR.words[key]);
}
function trBuildText(key, n, tl, vp){
  const words = (TR.words || {})[key]?.[n];
  if(!words){ trWords(key).then(()=>{ if((TR.words||{})[key]?.[n]) trBuildText(key, n, tl, vp); }); return; }
  const s = vp.scale;
  tl.innerHTML = words.map(w=>`<span style="left:${(w.x*s).toFixed(1)}px;top:${(w.y*s).toFixed(1)}px;`
    + `width:${(w.w*s).toFixed(1)}px;height:${(w.h*s).toFixed(1)}px;`
    + `font-size:${(w.h*s*0.95).toFixed(1)}px;line-height:${(w.h*s).toFixed(1)}px">${esc(w.t)}</span>`).join("");
}
async function trPaint(key, n, el){
  if(el.dataset.painted === "1" && el.querySelector("canvas")) return;
  el.dataset.painted = "1";
  const pdf = (TR.pdfs||{})[key]; if(!pdf) return;
  try{
    const page = await pdf.getPage(n);
    const vp = page.getViewport({scale: TR.scale});
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const cv = document.createElement("canvas");
    cv.width = Math.round(vp.width * dpr); cv.height = Math.round(vp.height * dpr);
    cv.style.width = "100%"; cv.style.height = "100%";
    el.innerHTML = "";
    el.appendChild(cv);
    await page.render({canvasContext: cv.getContext("2d"), viewport: vp, transform: [dpr,0,0,dpr,0,0]}).promise;
    const tl = document.createElement("div"); tl.className = "tr-text"; el.appendChild(tl);
    trBuildText(key, n, tl, vp);
    const hl = document.createElement("div"); hl.className = "tr-hls"; el.appendChild(hl);
    trPaintHls(n, el);
  }catch(e){ el.dataset.painted = ""; el.dataset.err = String(e && e.message || e);
             const ph = el.querySelector(".tr-ph"); if(ph) ph.textContent = "这一页渲染失败：" + el.dataset.err.slice(0, 80); }
}
function trPageNo(key){
  const box = trScrollEl(key); if(!box) return;
  const mid = box.scrollTop + box.clientHeight * 0.35;
  let best = 1;
  box.querySelectorAll(".tr-page").forEach(el=>{ if(el.offsetTop <= mid) best = +el.dataset.page; });
  if(key === (TR.active==="b"?"b":"a")) $("trPageNo").textContent = `${best} / ${TR.pages || 0}`;
  TR.cur = best;
}
function trZen(on){
  /* 专注模式：只把阅读区拉到全屏，其余（pdf.js 双栏、拖分隔线、点哪栏管哪栏）全复用现成的 */
  const st = $("trStage"); if(!st) return;
  const show = on === undefined ? !st.classList.contains("zen") : !!on;
  st.classList.toggle("zen", show);
  TR.zen = show;
  $("trZenTop")?.classList.toggle("active", show);
  trMsg(show ? "专注模式：中间那条线照样能拖；缩放用左上角那对加减号，Esc 退出"
             : "");
  if(show){ trPaintNear(TR.active === "b" ? "b" : "a"); trZoomLabel(); }
}
function trZoom(d){
  TR.scale = Math.min(TR_MAX, Math.max(TR_MIN, Math.round((TR.scale + d) * 100) / 100));
  trMsg(`缩放 ${Math.round(TR.scale*100)}%`);
  if(TR.dual){ trMount("a", `/api/pdf?id=${encodeURIComponent(TR.pid)}`);
               if(TR.monoUrl) trMount("b", TR.monoUrl); }
  else trReader(TR.pid);
  trZoomLabel();
}
function trZoomLabel(){
  const t = Math.round(TR.scale * 100) + "%";
  const v = $("trZenZoomV"); if(v) v.textContent = t;      // 专注模式左上角那个
  const w = $("trZoomV");    if(w) w.textContent = t;      // 工具栏缩放组里那个
}
function trExitFull(){
  /* ✕ / Esc 的统一出口：笔记模式先退回阅读器，再把全屏收掉 */
  if(TR.view === "note") trBack();
  trZen(false);
}
function trNoteZoom(d){
  TR.noteScale = Math.min(1.8, Math.max(0.7, Math.round((TR.noteScale + d) * 10) / 10));
  trNoteApply();
}
function trNoteApply(){
  /* 笔记模式里没有 PDF 可缩放 —— 顶栏那对加减号管的是中文/笔记两栏的字号 */
  const px = (13.5 * TR.noteScale).toFixed(1) + "px";
  const b = $("trNoteBody"), s = $("trNoteSrc");
  if(b) b.style.fontSize = px;
  if(s) s.style.fontSize = px;
  const v = $("trNoteZoomV"); if(v) v.textContent = Math.round(TR.noteScale*100) + "%";
}

/* ---------------- 荧光笔 ---------------- */
const TR_COLORS = ["#FFE066", "#8BD498", "#7FC4F0", "#F0A9C0", "#F07C7C"];
function trHlLoad(){
  let raw = null;
  try{ raw = JSON.parse(localStorage.getItem("rw-hl-" + TR.pid) || "null"); }catch(_){ raw = null; }
  if(raw && raw.v === 2) TR.hl = raw.list || [];          // v1 的坐标是压着文字底线的（偏低），直接丢掉重画
  else { TR.hl = []; if(raw) localStorage.removeItem("rw-hl-" + TR.pid); }
  trPaintAllHls();
  trMsg(TR.hl.length ? `这份 PDF 上有 ${TR.hl.length} 处标注` : "");
}
function trHlSave(){ try{ localStorage.setItem("rw-hl-" + TR.pid, JSON.stringify({v:2, list:TR.hl})); }catch(_){} }
function trPaintHls(n, el){
  const box = el.querySelector(".tr-hls"); if(!box) return;
  box.innerHTML = "";
  TR.hl.filter(h=>h.p === n).forEach((h, i)=>{
    const d = document.createElement("div");
    d.className = "tr-hl"; d.dataset.i = TR.hl.indexOf(h);
    d.style.cssText = `left:${h.x}px;top:${h.y}px;width:${h.w}px;height:${h.th}px;background:${h.c}`
      + ";position:absolute;border-radius:3px;opacity:.5;mix-blend-mode:multiply;cursor:pointer";
    d.title = "点一下删除这处标注";
    d.onclick = ()=>{ TR.hl.splice(+d.dataset.i, 1); trHlSave(); trPaintAllHls(); };
    box.appendChild(d);
  });
}

function trPenPanel(on){
  const p = $("trPen"); if(!p) return;
  const show = on === undefined ? p.classList.contains("hidden") : !!on;
  p.classList.toggle("hidden", !show);
  TR.hlOn = show;
  $("trPenTop")?.classList.toggle("active", show);

function trPenInit(){
  $("trColors").innerHTML = TR_COLORS.map((c,i)=>`<i data-c="${c}" class="${i===0?"on":""}" style="background:${c}"></i>`).join("");
  $("trColors").onclick = (e)=>{ const i = e.target.closest("i[data-c]"); if(!i) return;
    TR.hlColor = i.dataset.c;
    $("trColors").querySelectorAll("i").forEach(x=>x.classList.toggle("on", x===i)); };
  const w = $("trWidth"); w.value = TR.hlWidth;
  w.oninput = ()=>{ TR.hlWidth = +w.value; };
}
function trHlOnMouseUp(e){
  if(!TR.hlOn) return;
  const sel = window.getSelection();
  if(!sel || sel.isCollapsed) return;
  const pageEl = e.target.closest?.(".tr-page");
  if(!pageEl || !pageEl.dataset.painted) return;
  const pr = pageEl.getBoundingClientRect();
  const rects = [...sel.getRangeAt(0).getClientRects()].filter(r=>r.width > 3 && r.height > 3);
  if(!rects.length) return;
  const n = +pageEl.dataset.page;
  const th = TR.hlWidth;
  rects.forEach(r=>{
    TR.hl.push({p:n, x:Math.round(r.left - pr.left), y:Math.round(r.top - pr.top + r.height/2 - th/2),
                w:Math.round(r.width), th, c:TR.hlColor});      // 按文字行的垂直中线居中（原来是压着底线，偏低）
  });
  trHlSave(); trPaintHls(n, pageEl); sel.removeAllRanges();
  trMsg(`已标注 ${TR.hl.length} 处（存在本机，这份 PDF 专属）`);
}

/* ---------------- 中英互译（BabelDOC 后台任务） ---------------- */
async function trTranslate(){
  if(!TR.pid) return trMsg("先添加一篇 PDF");
  if(TR.job && TR.job.state === "running") return;
  const b = $("trBtnT");
  b.disabled = true;
  trMsg("启动翻译…（同一篇只翻一次，第二次秒开）");
  try{
    const r = await api("/api/trans/start", {id: TR.pid, task_id: curTask, pages: TR.testPages || ""});
    if(r.error) throw new Error(r.error);
    TR.job = r;
    if(r.state === "done" || r.cached) return trDualOpen();
    trStartPoll();
  }catch(e){ trMsg("翻译启动失败：" + e.message); b.disabled = false; }
}
function trStartPoll(){
  trStopPoll();
  TR.poll = setInterval(async ()=>{
    try{
      const s = await api(`/api/trans/status?id=${encodeURIComponent(TR.pid)}`);
      TR.job = s;
      if(s.state === "running" || s.state === "partial"){
        const el = Math.round((Date.now() - (TR.t0 || (TR.t0 = Date.now()))) / 1000);
        $("trBtnT").textContent = "🌐 翻译中…";
        const done = s.pages_done || 0;
        trMsg(`${s.msg || "正在翻译"}　已用 ${Math.floor(el/60)}分${el%60}秒（${TR.pages||"整篇"} 页大约十几分钟，可以先干别的）`);
        if(done > 0 && done !== TR.prog){          // 翻好一批就先给一批：第一页好了就先把第一页摆出来
          TR.prog = done;
          if(!TR.dual) trDualOpen(done); else trReloadB(done);
          trMsg(`已翻好第 1-${done} 页（共 ${s.total_pages||TR.pages||"?"} 页），后面还在翻…`);
        }
        if(s.state === "partial"){                 // 后面失败了：已有的照看，别把已经翻好的藏起来
          trStopPoll(); TR.t0 = 0; $("trBtnT").textContent = "🌐 中英互译"; $("trBtnT").disabled = false;
          if(!TR.dual && done > 0) trDualOpen(done);
          trMsg(`翻到第 ${done} 页时中断：${s.msg || ""}（已翻好的还在，日志：${s.log || ""}）`);
        }
      }
      if(s.state === "done"){ trStopPoll(); TR.t0 = 0; $("trBtnT").textContent = "🌐 中英互译";
                              $("trBtnT").disabled = false;
                              if(TR.dual) trReloadB(s.pages_done || 0); else trDualOpen(s.pages_done || 0); }
      if(s.state === "error"){ trStopPoll(); TR.t0 = 0; $("trBtnT").textContent = "🌐 中英互译";
                              $("trBtnT").disabled = false;
                              trMsg("翻译失败：" + (s.msg||"") + (s.log ? `（日志：${s.log}）` : "")); }
    }catch(_){}
  }, 2500);
}
function trStopPoll(){ if(TR.poll){ clearInterval(TR.poll); TR.poll = 0; } }

function trMonoUrl(v){

async function trReloadB(v){

/* ---------------- 笔记模式 ---------------- */
function trDedent(md){
  /* PDF 抽出来的正文常带缩进 —— markdown 会把 ≥4 空格的整段当代码块渲染成黑框，先去掉行首空白 */
  return (md || "").split("\n").map(l => l.replace(/^[ \t]+/, "")).join("\n");
}
function trSegActive(v){
  /* 原文 / 中英互译 / 笔记模式 三个视图键的选中态只有这一处说了算 */
  $("trBtnBack")?.classList.toggle("active", v === "read");
  $("trBtnT")?.classList.toggle("active", v === "dual");
  $("trBtnN")?.classList.toggle("active", v === "note");
}
function trView(v){
  /* 阅读器 / 双栏 / 笔记 三个视图的可见性只有这一处说了算 —— 免得异步加载回来把当前视图盖掉 */
  TR.view = v;
  $("trNote")?.classList.toggle("hidden", v !== "note");
  $("trDrop")?.classList.toggle("hidden", v !== "empty");
  /* 笔记模式 = 全屏（和专注模式共用同一个 fixed 舞台）；离开笔记模式时自动收掉全屏 */
  const st = $("trStage");
  if(st){
    st.classList.toggle("note", v === "note");
    if(v === "note"){ st.classList.add("zen"); TR.zen = true; TR.noteZen = true; }
    else if(TR.noteZen){ st.classList.remove("zen"); TR.zen = false; TR.noteZen = false; }
  }
}
async function trNoteMode(){
  /* 笔记模式：左边 3/4 中文全文（只读），右边 1/4 「阅读笔记」随记随写。
     笔记是**绑论文**的（论文又绑项目）：同一篇论文只会有一篇，再点就是打开它。空白起步，不塞论文正文。 */
  if(!TR.pid) return trMsg("先添加一篇 PDF");
  trMsg("正在打开这篇论文的「阅读笔记」…");
  try{
    const r = await api("/api/paper/note", {id: TR.pid, task_id: curTask});
    if(r.error) throw new Error(r.error);
    TR.note = r.note; TR.noteText = r.text || "";
    trDualOff();
    trView("note");
    trSegActive("note");
    $("trNoteTitle").value = TR.note.title || "阅读笔记";
    $("trNoteSrc").value = TR.note.content || "";                 // 空白：他自己写
    trNoteApply();
    $("trNoteBody").innerHTML = r.text ? renderMarkdown(trDedent(r.text))
                                       : `<div class="tr-load">还没有中文全文 —— 先点上面「🌐 中英互译」，翻好一段这里就有一段。</div>`;
    $("trNotePages").textContent = r.pages ? ` · ${r.pages} 页` : "";
    const pname = (TR.meta && TR.meta.title) ? trShort(TR.meta.title) : (TR.pid || "").slice(0, 8);
    $("trNoteBind").textContent = `已绑定论文：${pname}${curTask ? " · 项目" : ""} · 自动保存`;
    trMsg(`「阅读笔记」已绑到这篇论文；左边中文、右边随记随写，顶栏加减号调字号、✕ 退出（Esc）${r.pages ? "" : "（暂无中文全文）"}`);
  }catch(e){ trMsg("笔记打开失败：" + e.message + (/(not found|404)/i.test(e.message) ? "（服务端是旧版本，重启一次）" : "")); }
}
function trShort(s, n){ s = String(s || ""); return s.length > n ? s.slice(0, n) + "…" : s; }
function trNoteBind(){
  const t = $("trNoteTitle"), s = $("trNoteSrc");
  const save = async ()=>{
    if(!TR.note) return;
    $("trNoteState").textContent = " · 保存中…";
    try{
      const d = await api("/api/mdnotes/save", {id: TR.note.id, title: t.value.trim() || "未命名笔记",
                                                content: s.value, task_id: curTask || ""});
      Object.assign(TR.note, d.note); $("trNoteState").textContent = " · 已保存";
      if(mdLoaded){ const i = mdNotes.findIndex(n=>n.id===TR.note.id); if(i >= 0) mdNotes[i] = {...mdNotes[i], ...TR.note}; else mdNotes.unshift(TR.note); }
    }catch(e){ $("trNoteState").textContent = " · 保存失败"; }
  };
  let t0 = 0;
  const later = ()=>{ clearTimeout(t0); t0 = setTimeout(save, 700); };
  t.oninput = later; s.oninput = later;
}

async function trFillPick(){

  try{

    const list = d.paper_list || [];

    if(list.length === 1 && !TR.pid) setTimeout(()=>trOpen(list[0].id), 50);   // 只有一篇就直接开
  }catch(_){}
}
function trBind(){
  const inFile = $("trFile");
  $("trAdd").onclick = ()=>inFile.click();
  inFile.onchange = (e)=>{ trUpload(e.target.files); e.target.value = ""; };
  $("trPick").onchange = (e)=>{ if(e.target.value) trOpen(e.target.value); };
  $("trIn").onclick = ()=>trZoom(+0.15);
  $("trOut").onclick = ()=>trZoom(-0.15);
  $("trPenTop").onclick = ()=>trPenPanel();
  $("trBtnT").onclick = ()=>trTranslate();
  $("trBtnN").onclick = ()=>trNoteMode();
  $("trBtnBack").onclick = ()=>trBack();
  trPenInit(); trNoteBind(); trFillPick(); trZoomLabel();
  if(!TR.hlBound){ TR.hlBound = 1;                     // 文档级监听只挂一次（renderWorkflow 会反复调 trBind）
    document.addEventListener("mouseup", (e)=>{ if($("trStage")?.contains(e.target)) trHlOnMouseUp(e); });
    document.addEventListener("keydown", (e)=>{ if(e.key === "Escape"){ trPenPanel(false); trExitFull(); } });
  }
  // 拖进来（整页都能接）
  const st = $("trStage"); let depth = 0;
  ["dragenter","dragover"].forEach(t=>st.addEventListener(t,(e)=>{ e.preventDefault(); e.stopPropagation();
    if(t==="dragenter") depth++; st.classList.add("dragging"); }));
  ["dragleave","drop"].forEach(t=>st.addEventListener(t,(e)=>{ e.preventDefault(); e.stopPropagation();
    if(t==="drop"){ depth = 0; st.classList.remove("dragging"); trUpload(e.dataTransfer?.files); }
    else if(--depth <= 0){ depth = 0; st.classList.remove("dragging"); } }));
  st.addEventListener("drop",(e)=>{ e.preventDefault(); trUpload(e.dataTransfer?.files); });
  // 两栏之间的分隔线
  const sp = $("trSplit"); let dragging = false;
  sp.addEventListener("pointerdown",(e)=>{ dragging = true; sp.setPointerCapture(e.pointerId); e.preventDefault(); });
  sp.addEventListener("pointermove",(e)=>{
    if(!dragging) return;
    const box = $("trStage"), r = box.getBoundingClientRect();
    const pct = Math.min(0.85, Math.max(0.15, (e.clientX - r.left) / r.width));
    box.style.gridTemplateColumns = `${pct*100}% 6px ${(1-pct)*100}%`;
  });
  ["pointerup","pointercancel"].forEach(t=>sp.addEventListener(t,()=>{ dragging = false; }));
  $("trZenTop").onclick = () => trZen();
  $("trZenExit").onclick = () => trExitFull();
  $("trZenIn").onclick = () => trZoom(0.15);
  $("trZenOut").onclick = () => trZoom(-0.15);
  $("trNoteIn").onclick = () => trNoteZoom(0.1);
  $("trNoteOut").onclick = () => trNoteZoom(-0.1);
  $("trNoteExit").onclick = () => trExitFull();
  // 缩放只认左上角那对加减号：触屏捏合（浏览器报成 ctrl+wheel）/ Ctrl+滚轮 一律吞掉，
  // 不吞的话浏览器本体缩放会把 PDF 文字层带偏（文字层是按缩放比例铺的绝对定位）
  $("trStage").addEventListener("wheel",(e)=>{ if(e.ctrlKey) e.preventDefault(); },{passive:false});
  // 点哪一栏，工具栏就管哪一栏
  $("trStage").addEventListener("mousedown",(e)=>{
    const p = e.target.closest(".tr-pane"); if(!p) return;
    TR.active = p.dataset.pane;
    $("trPaneA").classList.toggle("act", TR.active === "a");
    $("trPaneB").classList.toggle("act", TR.active === "b");
    trPageNo(TR.active);
  });
}

async function mpLoad(){
  if(!curTask) return;
  try{
    const d = await api(`/api/map/state?id=${encodeURIComponent(curTask)}`);
    MP.nodes = d.nodes||[]; MP.edges = d.edges||[]; MP.src = d.sources||null; MP.outline = (d.outline&&d.outline.markdown)||"";
    MP.sig = JSON.stringify([MP.nodes, MP.edges]);
    $("mp-file").textContent = (d.path||"谱系.json").split(/[\\/]/).pop();
    $("mp-meta").textContent = `${d.sections||0} 小节 · ${d.refs||0} 关联${d.exists?"":" · 还没有图"}${d.broken?" · JSON 坏了":""}`;
    const chips = [];
    if(MP.src){
      chips.push(`<span class="mp-chip">大纲小节 ${MP.src.sections.length}</span>`);
      chips.push(`<span class="mp-chip">精读笔记 ${MP.src.notes.length}</span>`);
      chips.push(`<span class="mp-chip">文献库 ${MP.src.papers.length}</span>`);

      chips.push(`<span class="mp-chip">拖文件到画布 = 上传数据</span>`);

  }
